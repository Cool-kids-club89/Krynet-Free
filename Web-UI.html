<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">

  <title>KrynetAI.free – Chat</title>

  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: #0a0a0a;
      color: #fff;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* -------------------------------------------------------
       APP
    ------------------------------------------------------- */

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    /* -------------------------------------------------------
       SIDEBAR
    ------------------------------------------------------- */

    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: #160000;
      border-right: 1px solid #350000;
      display: flex;
      flex-direction: column;
      padding: 16px 10px;
    }

    .brand {
      padding: 8px 14px 18px;
      font-size: 18px;
      font-weight: 700;
    }

    .brand span {
      color: #ff4d4d;
    }

    .channel-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .channel {
      padding: 9px 12px;
      border-radius: 6px;
      color: #aaa;
      cursor: pointer;
      font-size: 14px;
    }

    .channel:hover,
    .channel.active {
      color: #fff;
      background: #300000;
    }

    /* -------------------------------------------------------
       CHAT
    ------------------------------------------------------- */

    .chat-container {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #0d0d0d;
    }

    .chat-header {
      height: 58px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: #151515;
      border-bottom: 1px solid #292929;
      font-size: 15px;
      font-weight: 600;
    }

    .chat-header .hash {
      color: #777;
      margin-right: 6px;
    }

    .chat-main {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    .chat-messages {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 760px;
      align-items: flex-start;
    }

    .message.self {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
      background: #222;
    }

    .message-body {
      min-width: 0;
    }

    .message-meta {
      margin-bottom: 5px;
      color: #888;
      font-size: 12px;
    }

    .message-meta strong {
      color: #ddd;
    }

    .message-content {
      color: #eee;
      background: #191919;
      border: 1px solid #252525;
      padding: 9px 12px;
      border-radius: 9px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .message.self .message-content {
      background: #330000;
      border-color: #500000;
    }

    /* -------------------------------------------------------
       EMBEDS
    ------------------------------------------------------- */

    .kr-embed {
      max-width: 480px !important;
    }

    .kr-embed img,
    .kr-embed video {
      max-width: 100%;
    }

    .kr-embed audio {
      width: 100%;
    }

    .kr-embed-placeholder {
      min-height: 20px;
    }

    /* -------------------------------------------------------
       LOCAL FILE ATTACHMENT
    ------------------------------------------------------- */

    .file-attachment {
      width: min(480px, 100%);
      margin-top: 8px;
      padding: 10px;
      background: #191919;
      border: 1px solid #303030;
      border-radius: 9px;
    }

    .file-attachment-header {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 8px;
    }

    .file-icon {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      background: #300000;
      color: #ff6666;
      font-size: 14px;
    }

    .file-name {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      color: #ddd;
    }

    .file-size {
      color: #777;
      font-size: 11px;
    }

    .file-attachment img,
    .file-attachment video {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 7px;
      background: #090909;
    }

    .file-attachment audio {
      display: block;
      width: 100%;
    }

    .file-download {
      display: inline-block;
      margin-top: 8px;
      color: #4db8ff;
      font-size: 12px;
      text-decoration: none;
    }

    .file-download:hover {
      text-decoration: underline;
    }

    /* -------------------------------------------------------
       USERS
    ------------------------------------------------------- */

    .user-list {
      width: 210px;
      flex-shrink: 0;
      background: #121212;
      border-left: 1px solid #292929;
      padding: 18px 14px;
      overflow-y: auto;
    }

    .user-list-title {
      color: #777;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin: 0 6px 14px;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #43b581;
    }

    .user .avatar {
      width: 30px;
      height: 30px;
    }

    /* -------------------------------------------------------
       INPUT
    ------------------------------------------------------- */

    .chat-input-wrap {
      flex-shrink: 0;
      padding: 12px 18px 18px;
      background: #0d0d0d;
    }

    .chat-input {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      background: #1b1b1b;
      border: 1px solid #303030;
      border-radius: 10px;
    }

    .chat-input input[type="text"] {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      padding: 8px;
      font-size: 14px;
    }

    .chat-input input::placeholder {
      color: #666;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #999;
      font-size: 18px;
    }

    .icon-button:hover {
      background: #292929;
      color: #fff;
    }

    #sendBtn {
      height: 36px;
      border: 0;
      border-radius: 7px;
      padding: 0 16px;
      background: #e83d3d;
      color: #fff;
      font-weight: 600;
    }

    #sendBtn:hover {
      background: #ff4d4d;
    }

    /* -------------------------------------------------------
       FILE PICKER
    ------------------------------------------------------- */

    #fileInput {
      display: none;
    }

    /* -------------------------------------------------------
       MOBILE
    ------------------------------------------------------- */

    @media (max-width: 850px) {
      .sidebar {
        width: 190px;
      }

      .user-list {
        display: none;
      }
    }

    @media (max-width: 600px) {
      .sidebar {
        display: none;
      }

      .chat-messages {
        padding: 16px 12px;
      }

      .message {
        max-width: 92%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="main-content">

    <!-- SIDEBAR -->

    <aside class="sidebar">
      <div class="brand">
        Krynet<span>AI</span>
      </div>

      <div class="channel-list">
        <div class="channel active"># general</div>
        <div class="channel"># support</div>
        <div class="channel"># random</div>
      </div>
    </aside>

    <!-- CHAT -->

    <section class="chat-container">

      <header class="chat-header">
        <span class="hash">#</span>
        general
      </header>

      <div class="chat-main">

        <main
          class="chat-messages"
          id="chatMessages"
        >

          <div
            class="message"
            data-message="true"
          >
            <img
              class="avatar"
              src="https://cdn.krynet.com/avatars/default1.png"
              alt="UserA"
            >

            <div class="message-body">

              <div class="message-meta">
                <strong>UserA</strong>
                • 12:34 PM
              </div>

              <div class="message-content">
                Welcome to KrynetAI.free
              </div>

            </div>
          </div>

        </main>

        <!-- USERS -->

        <aside class="user-list">

          <div class="user-list-title">
            Online — 2
          </div>

          <div class="user">
            <div class="status-dot"></div>

            <img
              class="avatar"
              src="https://cdn.krynet.com/avatars/default1.png"
              alt="UserA"
            >

            <span>UserA</span>
          </div>

          <div class="user">
            <div
              class="status-dot"
              style="background:#faa61a"
            ></div>

            <img
              class="avatar"
              src="https://cdn.krynet.com/avatars/default2.png"
              alt="UserB"
            >

            <span>UserB</span>
          </div>

        </aside>

      </div>

      <!-- INPUT -->

      <div class="chat-input-wrap">

        <div class="chat-input">

          <input
            id="fileInput"
            type="file"
            accept="image/*,video/*,audio/*,.avif,.heif,.heic,.aac,.m4a,.mp4,.pdf"
            multiple
          >

          <button
            class="icon-button"
            id="attachBtn"
            type="button"
            title="Attach file"
            aria-label="Attach file"
          >
            +
          </button>

          <input
            type="text"
            id="chatInput"
            placeholder="Message #general"
            autocomplete="off"
          >

          <button
            id="sendBtn"
            type="button"
          >
            Send
          </button>

        </div>

      </div>

    </section>

  </div>

</div>

<!-- =========================================================
     KRYNET JS FILES

     Normal scripts are loaded normally.

     embed.js MUST be a module because it imports:

         import { Reactions } from "./reactions.js";

     That means reactions.js is loaded automatically by the
     browser through embed.js.
========================================================= -->

<script src="./js/Cloudflare.js"></script>
<script src="./js/anonymous-upload.js"></script>
<script src="./js/blurNSFW.js"></script>
<script src="./js/clearURLS.js"></script>
<script src="./js/copyFileContents.js"></script>
<script src="./js/country-blocker.js"></script>
<script src="./js/dearrow.js"></script>

<script type="module">
  import { Embed } from "./js/embed.js";

  /*
   * Make Embed available to the rest of the page.
   */
  window.KrynetEmbed = Embed;

  /*
   * Scan existing messages once the module is ready.
   */
  Embed.scanMessages(
    '[data-message="true"]'
  );
</script>

<script src="./js/krysearch.js"></script>
<script src="./js/markdownRenderer.js"></script>
<script src="./js/openInApp.js"></script>
<script src="./js/screenshare.js"></script>
<script src="./js/sponsorblock.js"></script>
<script src="./js/tpm.js"></script>
<script src="./js/voicechat.js"></script>
<script src="./js/webcam.js"></script>
<script src="./js/youtubeAdblock.js"></script>

<!-- =========================================================
     CHAT APP
========================================================= -->

<script>
  "use strict";

  const input =
    document.getElementById("chatInput");

  const sendButton =
    document.getElementById("sendBtn");

  const chat =
    document.getElementById("chatMessages");

  const fileInput =
    document.getElementById("fileInput");

  const attachButton =
    document.getElementById("attachBtn");

  let messageCount = 0;

  /*
   * Keep local object URLs alive until the page is closed.
   *
   * This makes locally selected files render immediately.
   */
  const localObjectURLs = new Set();

  /* ---------------------------------------------------------
     HELPERS
  --------------------------------------------------------- */

  function getTime() {
    return new Date().toLocaleTimeString(
      [],
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );
  }

  function formatFileSize(bytes) {
    if (bytes < 1024) {
      return `${bytes} B`;
    }

    if (bytes < 1024 * 1024) {
      return `${(bytes / 1024).toFixed(1)} KB`;
    }

    if (bytes < 1024 * 1024 * 1024) {
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    }

    return `${(
      bytes /
      1024 /
      1024 /
      1024
    ).toFixed(1)} GB`;
  }

  function scrollChat() {
    chat.scrollTop =
      chat.scrollHeight;
  }

  /* ---------------------------------------------------------
     CREATE MESSAGE
  --------------------------------------------------------- */

  function createMessage(text) {
    const container =
      document.createElement("div");

    container.className =
      "message self";

    container.dataset.message =
      "true";

    const avatar =
      document.createElement("img");

    avatar.className =
      "avatar";

    avatar.src =
      "https://cdn.krynet.com/avatars/default2.png";

    avatar.alt =
      "You";

    const body =
      document.createElement("div");

    body.className =
      "message-body";

    const meta =
      document.createElement("div");

    meta.className =
      "message-meta";

    const name =
      document.createElement("strong");

    name.textContent =
      "You";

    meta.append(
      name,
      document.createTextNode(
        ` • ${getTime()}`
      )
    );

    const content =
      document.createElement("div");

    content.className =
      "message-content";

    content.textContent =
      text;

    body.append(
      meta,
      content
    );

    container.append(
      avatar,
      body
    );

    chat.appendChild(
      container
    );

    /*
     * Scan the newly-created message.
     *
     * This is what gives URLs their Discord-style embeds.
     */
    if (
      window.KrynetEmbed &&
      typeof window.KrynetEmbed.scanMessages ===
        "function"
    ) {
      window.KrynetEmbed.scanMessages(
        '[data-message="true"]'
      );
    }

    scrollChat();

    return container;
  }

  /* ---------------------------------------------------------
     FILE ATTACHMENT
  --------------------------------------------------------- */

  function createFileAttachment(file) {
    const url =
      URL.createObjectURL(file);

    localObjectURLs.add(url);

    const attachment =
      document.createElement("div");

    attachment.className =
      "file-attachment";

    const header =
      document.createElement("div");

    header.className =
      "file-attachment-header";

    const icon =
      document.createElement("div");

    icon.className =
      "file-icon";

    const fileName =
      file.name.toLowerCase();

    if (
      file.type.startsWith("image/")
    ) {
      icon.textContent = "IMG";
    } else if (
      file.type.startsWith("video/")
    ) {
      icon.textContent = "VID";
    } else if (
      file.type.startsWith("audio/")
    ) {
      icon.textContent = "AUD";
    } else {
      icon.textContent = "FILE";
    }

    const name =
      document.createElement("div");

    name.className =
      "file-name";

    name.textContent =
      file.name;

    const size =
      document.createElement("div");

    size.className =
      "file-size";

    size.textContent =
      formatFileSize(file.size);

    header.append(
      icon,
      name,
      size
    );

    attachment.appendChild(
      header
    );

    /*
     * IMAGE
     */

    if (
      file.type.startsWith("image/") ||
      /\.(avif|heif|heic)$/i.test(file.name)
    ) {
      const image =
        document.createElement("img");

      image.src =
        url;

      image.alt =
        file.name;

      image.loading =
        "lazy";

      attachment.appendChild(
        image
      );
    }

    /*
     * VIDEO
     */

    else if (
      file.type.startsWith("video/") ||
      /\.mp4$/i.test(file.name)
    ) {
      const video =
        document.createElement("video");

      video.src =
        url;

      video.controls =
        true;

      video.preload =
        "metadata";

      attachment.appendChild(
        video
      );
    }

    /*
     * AUDIO
     */

    else if (
      file.type.startsWith("audio/") ||
      /\.(aac|m4a)$/i.test(file.name)
    ) {
      const audio =
        document.createElement("audio");

      audio.src =
        url;

      audio.controls =
        true;

      audio.preload =
        "metadata";

      attachment.appendChild(
        audio
      );
    }

    /*
     * PDF
     */

    else if (
      file.type ===
      "application/pdf"
    ) {
      const frame =
        document.createElement("iframe");

      frame.src =
        url;

      frame.title =
        file.name;

      frame.loading =
        "lazy";

      Object.assign(
        frame.style,
        {
          width: "100%",
          height: "350px",
          border: "0",
          borderRadius: "7px",
          background: "#090909"
        }
      );

      attachment.appendChild(
        frame
      );
    }

    /*
     * GENERIC FILE
     */

    const download =
      document.createElement("a");

    download.className =
      "file-download";

    download.href =
      url;

    download.download =
      file.name;

    download.textContent =
      "Open / download file";

    attachment.appendChild(
      download
    );

    return attachment;
  }

  /* ---------------------------------------------------------
     SEND FILES
  --------------------------------------------------------- */

  function sendFiles(files) {
    if (!files.length) {
      return;
    }

    for (const file of files) {
      const container =
        document.createElement("div");

      container.className =
        "message self";

      container.dataset.message =
        "true";

      const avatar =
        document.createElement("img");

      avatar.className =
        "avatar";

      avatar.src =
        "https://cdn.krynet.com/avatars/default2.png";

      avatar.alt =
        "You";

      const body =
        document.createElement("div");

      body.className =
        "message-body";

      const meta =
        document.createElement("div");

      meta.className =
        "message-meta";

      const name =
        document.createElement("strong");

      name.textContent =
        "You";

      meta.append(
        name,
        document.createTextNode(
          ` • ${getTime()}`
        )
      );

      body.appendChild(
        meta
      );

      body.appendChild(
        createFileAttachment(file)
      );

      container.append(
        avatar,
        body
      );

      chat.appendChild(
        container
      );
    }

    fileInput.value =
      "";

    scrollChat();
  }

  /* ---------------------------------------------------------
     SEND TEXT
  --------------------------------------------------------- */

  function sendMessage() {
    const text =
      input.value.trim();

    if (!text) {
      return;
    }

    createMessage(
      text
    );

    input.value =
      "";

    messageCount++;

    /*
     * Put the cursor back in the input.
     */
    input.focus();
  }

  /* ---------------------------------------------------------
     INPUT EVENTS
  --------------------------------------------------------- */

  sendButton.addEventListener(
    "click",
    sendMessage
  );

  input.addEventListener(
    "keydown",
    event => {
      if (
        event.key !== "Enter" ||
        event.shiftKey
      ) {
        return;
      }

      event.preventDefault();

      sendMessage();
    }
  );

  attachButton.addEventListener(
    "click",
    () => {
      fileInput.click();
    }
  );

  fileInput.addEventListener(
    "change",
    () => {
      const files =
        Array.from(
          fileInput.files || []
        );

      sendFiles(files);
    }
  );

  /* ---------------------------------------------------------
     DRAG + DROP
  --------------------------------------------------------- */

  chat.addEventListener(
    "dragover",
    event => {
      event.preventDefault();
    }
  );

  chat.addEventListener(
    "drop",
    event => {
      event.preventDefault();

      const files =
        Array.from(
          event.dataTransfer?.files || []
        );

      sendFiles(files);
    }
  );

  /* ---------------------------------------------------------
     CLEANUP
  --------------------------------------------------------- */

  window.addEventListener(
    "beforeunload",
    () => {
      for (
        const url of localObjectURLs
      ) {
        URL.revokeObjectURL(url);
      }
    }
  );

  /*
   * Make sure the initial chat is at the bottom.
   */
  scrollChat();
</script>

</body>
</html>
