  <style>
    * {

    body {
      margin: 0;

      background: #0a0a0a;

    /* =========================================================

    .main-content {

    .sidebar {

      background: #1a0000;

    .channel-list {

       CHAT
    ========================================================== */

    .chat-container {
      flex: 1;

      display: flex;
      flex-direction: column;
    }

    .chat-header {

      display: flex;
      align-items: center;
      background: #1a0000;
      border-bottom: 1px solid #400000;
      font-weight: 600;
    }

    .chat-main {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    .chat-messages {
      flex: 1;
      min-width: 0;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    /* =========================================================
       MESSAGES
    ========================================================== */

    .message {
      display: flex;
      gap: 0.65rem;
      max-width: 800px;
      align-items: flex-start;
    }

    .message.self {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-content-wrap {
      min-width: 0;
    }

    .message-meta {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 0.25rem;
    }

    .message-content {
      background: #1a1a1a;

      border-radius: 0.65rem;
      overflow-wrap: anywhere;

      font-size: 20px;

    .file-name {

  <script>
    "use strict";

    const input =
      document.getElementById("chatInput");

    const button =
      document.getElementById("sendBtn");

    const chat =
      document.getElementById("chatMessages");

    const fileInput =
      document.getElementById("fileInput");

    const fileButton =
      document.getElementById("fileButton");

    const attachmentPreview =
      document.getElementById("attachmentPreview");

    const attachmentPreviewName =
      document.getElementById("attachmentPreviewName");

    const removeAttachment =
      document.getElementById("removeAttachment");

    let selectedFiles = [];

    let messageCount = 0;

    /* =========================================================
       FILE HELPERS
    ========================================================== */

    function formatFileSize(bytes) {
      if (bytes < 1024) {
        return `${bytes} B`;
      }

      if (bytes < 1024 * 1024) {
        return `${(bytes / 1024).toFixed(1)} KB`;
      }

      if (bytes < 1024 * 1024 * 1024) {
        return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      }

      return `${(bytes / 1024 / 1024 / 1024).toFixed(1)} GB`;
    }

    function getFileIcon(file) {
      if (file.type.startsWith("image/")) {
        return "🖼️";
      }

      if (file.type.startsWith("video/")) {
        return "🎬";
      }

      if (file.type.startsWith("audio/")) {
        return "🎵";
      }

      if (file.type === "application/pdf") {
        return "📕";
      }

      return "📄";
    }

    /* =========================================================
       FILE ATTACHMENT
    ========================================================== */

    function createFileAttachment(file) {
      const attachment =
        document.createElement("div");

      attachment.className =
        "attachment";

      /*
       * Images
       */

      if (file.type.startsWith("image/")) {
        const image =
          document.createElement("img");

        const url =
          URL.createObjectURL(file);

        image.src = url;
        image.alt = file.name;
        image.loading = "lazy";

        image.onload = () => {
          URL.revokeObjectURL(url);
        };

        image.onerror = () => {
          URL.revokeObjectURL(url);
          attachment.replaceChildren(
            createGenericFileCard(file)
          );
        };

        attachment.appendChild(image);

        return attachment;
      }

      /*
       * Video
       */

      if (file.type.startsWith("video/")) {
        const video =
          document.createElement("video");

        video.controls = true;
        video.preload = "metadata";

        const url =
          URL.createObjectURL(file);

        video.src = url;

        video.onloadeddata = () => {
          URL.revokeObjectURL(url);
        };

        attachment.appendChild(video);

        return attachment;
      }

      /*
       * Audio
       */

      if (file.type.startsWith("audio/")) {
        const audio =
          document.createElement("audio");

        audio.controls = true;
        audio.preload = "metadata";

        const url =
          URL.createObjectURL(file);

        audio.src = url;

        attachment.appendChild(audio);

        return attachment;
      }

      /*
       * PDF
       */

      if (file.type === "application/pdf") {
        const frame =
          document.createElement("iframe");

        frame.src =
          URL.createObjectURL(file);

        frame.title =
          file.name;

        frame.style.width =
          "100%";

        frame.style.height =
          "400px";

        frame.style.border =
          "0";

        attachment.appendChild(frame);

        return attachment;
      }

      /*
       * Generic file
       */

      attachment.appendChild(
        createGenericFileCard(file)
      );

      return attachment;
    }

    function createGenericFileCard(file) {
      const card =
        document.createElement("div");

      card.className =
        "file-card";

      const icon =
        document.createElement("div");

      icon.className =
        "file-icon";

      icon.textContent =
        getFileIcon(file);

      const info =
        document.createElement("div");

      info.className =
        "file-info";

      const name =
        document.createElement("div");

      name.className =
        "file-name";

      name.textContent =
        file.name;

      const size =
        document.createElement("div");

      size.className =
        "file-size";

      size.textContent =
        formatFileSize(file.size);

      info.append(
        name,
        size
      );

      card.append(
        icon,
        info
      );

      return card;
    }

    /* =========================================================
       FILE SELECTION
    ========================================================== */

    fileButton.addEventListener(
      "click",
      () => {
        fileInput.click();
      }
    );

    fileInput.addEventListener(
      "change",
      () => {
        selectedFiles =
          Array.from(fileInput.files || []);

        if (!selectedFiles.length) {
          attachmentPreview.classList.remove(
            "visible"
          );

          return;
        }

        attachmentPreviewName.textContent =
          selectedFiles.length === 1
            ? selectedFiles[0].name
            : `${selectedFiles.length} files selected`;

        attachmentPreview.classList.add(
          "visible"
        );
      }
    );

    removeAttachment.addEventListener(
      "click",
      clearFiles
    );

    function clearFiles() {
      selectedFiles = [];

      fileInput.value = "";

      attachmentPreview.classList.remove(
        "visible"
      );
    }

    /* =========================================================
       URL EMBEDS
    ========================================================== */

    const URL_REGEX =
      /https?:\/\/[^\s<>"']+?(?=[\s<>"']|$)/gi;

    const NOEMBED_API =
      "https://noembed.com/embed";

    const embedCache =
      new Map();

    function normalizeURL(value) {
      try {
        const url =
          new URL(value);

        if (
          url.protocol !== "http:" &&
          url.protocol !== "https:"
        ) {
          return null;
        }

        return url.href;
      } catch {
        return null;
      }
    }

    function getFilename(url) {
      try {
        const parsed =
          new URL(url);

        const pathname =
          decodeURIComponent(
            parsed.pathname
          );

        return (
          pathname
            .split("/")
            .filter(Boolean)
            .pop() ||
          parsed.hostname
        );
      } catch {
        return url;
      }
    }

    async function getMime(url) {
      try {
        const response =
          await fetch(url, {
            method: "GET",
            headers: {
              Range: "bytes=0-0"
            }
          });

        return (
          response.headers.get(
            "content-type"
          ) || ""
        );
      } catch {
        return "";
      }
    }

    async function getMeta(url) {
      try {
        const endpoint =
          `${NOEMBED_API}?url=${encodeURIComponent(url)}`;

        const response =
          await fetch(endpoint);

        if (!response.ok) {
          return {};
        }

        const data =
          await response.json();

        if (
          !data ||
          typeof data !== "object"
        ) {
          return {};
        }

        return data;
      } catch {
        return {};
      }
    }

    async function getEmbedData(url) {
      if (embedCache.has(url)) {
        return embedCache.get(url);
      }

      const request =
        Promise.all([
          getMeta(url),
          getMime(url)
        ]).then(
          ([meta, mime]) => ({
            meta,
            mime
          })
        );

      embedCache.set(
        url,
        request
      );

      return request;
    }

    function createEmbedMedia(
      url,
      mime,
      meta
    ) {
      if (meta.thumbnail_url) {
        const image =
          document.createElement("img");

        image.src =
          meta.thumbnail_url;

        image.alt =
          meta.title ||
          "Embedded media";

        image.loading =
          "lazy";

        image.referrerPolicy =
          "no-referrer";

        return image;
      }

      if (mime.startsWith("image/")) {
        const image =
          document.createElement("img");

        image.src = url;
        image.alt =
          getFilename(url);
        image.loading =
          "lazy";

        return image;
      }

      if (mime.startsWith("video/")) {
        const video =
          document.createElement("video");

        video.src = url;
        video.controls = true;
        video.preload = "metadata";

        return video;
      }

      if (mime.startsWith("audio/")) {
        const audio =
          document.createElement("audio");

        audio.src = url;
        audio.controls = true;
        audio.preload = "metadata";

        return audio;
      }

      if (mime === "application/pdf") {
        const frame =
          document.createElement("iframe");

        frame.src = url;
        frame.loading = "lazy";
        frame.title = "PDF document";

        return frame;
      }

      return null;
    }

    async function buildEmbed(url) {
      const {
        meta,
        mime
      } = await getEmbedData(url);

      const card =
        document.createElement("div");

      card.className =
        "kr-embed";

      const bar =
        document.createElement("div");

      bar.className =
        "kr-embed-bar";

      const body =
        document.createElement("div");

      body.className =
        "kr-embed-body";

      card.append(
        bar,
        body
      );

      const title =
        document.createElement("a");

      title.className =
        "kr-embed-title";

      title.href = url;
      title.target = "_blank";
      title.rel =
        "noopener noreferrer";

      title.textContent =
        meta.title ||
        getFilename(url);

      body.appendChild(title);

      if (meta.description) {
        const description =
          document.createElement("div");

        description.className =
          "kr-embed-description";

        description.textContent =
          meta.description;

        body.appendChild(
          description
        );
      }

      const media =
        createEmbedMedia(
          url,
          mime,
          meta
        );

      if (media) {
        body.appendChild(media);
      }

      if (meta.provider_name) {
        const provider =
          document.createElement("div");

        provider.className =
          "kr-embed-provider";

        provider.textContent =
          meta.provider_name;

        body.appendChild(
          provider
        );
      }

      /*
       * Use the existing Reactions class
       * when reactions.js exposes it.
       */

      const reactions =
        document.createElement("div");

      reactions.className =
        "kr-embed-reactions";

      body.appendChild(
        reactions
      );

      if (
        typeof window.Reactions ===
        "function"
      ) {
        try {
          new window.Reactions(
            reactions
          );
        } catch {
          // Reactions is optional.
        }
      }

      return card;
    }

    function extractURLs(text) {
      const matches =
        text.match(URL_REGEX);

      if (!matches) {
        return [];
      }

      const unique =
        new Set();

      for (const match of matches) {
        const url =
          normalizeURL(match);

        if (url) {
          unique.add(url);
        }
      }

      return Array.from(unique);
    }

    async function addURLEmbeds(
      message,
      text
    ) {
      const urls =
        extractURLs(text);

      if (!urls.length) {
        return;
      }

      for (const url of urls) {
        try {
          const embed =
            await buildEmbed(url);

          if (!message.isConnected) {
            return;
          }

          message
            .querySelector(
              ".message-content-wrap"
            )
            ?.appendChild(embed);

        } catch (error) {
          console.warn(
            "[Krynet] Embed failed:",
            url,
            error
          );
        }
      }
    }

    /* =========================================================
       SEND MESSAGE
    ========================================================== */

    function sendMessage() {
      const text =
        input.value.trim();

      if (
        !text &&
        !selectedFiles.length
      ) {
        return;
      }

      const container =
        document.createElement("div");

      container.className =
        "message self";

      const avatar =
        document.createElement("img");

      avatar.className =
        "avatar";

      avatar.src =
        "https://cdn.krynet.com/avatars/default2.png";

      avatar.alt =
        "You";

      const wrap =
        document.createElement("div");

      wrap.className =
        "message-content-wrap";

      const meta =
        document.createElement("div");

      meta.className =
        "message-meta";

      const strong =
        document.createElement("strong");

      strong.textContent =
        "You";

      meta.appendChild(strong);

      meta.append(
        document.createTextNode(
          " • " +
          new Date().toLocaleTimeString(
            [],
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )
        )
      );

      wrap.appendChild(meta);

      /*
       * Text message
       */

      if (text) {
        const bubble =
          document.createElement("div");

        bubble.className =
          "message-content";

        bubble.textContent =
          text;

        wrap.appendChild(
          bubble
        );
      }

      /*
       * File attachments
       */

      const filesToSend =
        [...selectedFiles];

      for (const file of filesToSend) {
        const attachment =
          createFileAttachment(file);

        wrap.appendChild(
          attachment
        );
      }

      container.append(
        avatar,
        wrap
      );

      chat.appendChild(
        container
      );

      /*
       * Build URL embeds directly
       * underneath the message.
       */

      if (text) {
        void addURLEmbeds(
          container,
          text
        );
      }

      messageCount++;

      /*
       * Ad every 5 messages.
       */

      if (messageCount % 5 === 0) {
        const adContainer =
          document.createElement("div");

        adContainer.className =
          "message";

        const ad =
          document.createElement("ins");

        ad.className =
          "adsbygoogle";

        ad.style.display =
          "block";

        ad.style.width =
          "100%";

        ad.dataset.adClient =
          "ca-pub-3940256099942544";

        ad.dataset.adSlot =
          "6300978111";

        ad.dataset.adFormat =
          "auto";

        ad.dataset.fullWidthResponsive =
          "true";

        adContainer.appendChild(ad);

        chat.appendChild(
          adContainer
        );

        try {
          (
            window.adsbygoogle =
            window.adsbygoogle || []
          ).push({});
        } catch {
          // Ad blocker / unavailable.
        }
      }

      input.value = "";

      clearFiles();

      chat.scrollTop =
        chat.scrollHeight;
    }

    /* =========================================================
       EVENTS
    ========================================================== */

    button.addEventListener(
      "click",
      sendMessage
    );

    input.addEventListener(
      "keydown",
      event => {
        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();
          sendMessage();
        }
      }
    );

    /* =========================================================
       STARTUP
    ========================================================== */

    console.log(
      "[Krynet] Chat initialized"
    );

    console.log(
      "[Krynet] File attachments enabled"
    );

    console.log(
      "[Krynet] Discord-style embeds enabled"
    );
  </script>

</body>
</html>
