<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />

  <title>KrynetAI.free – Chat UI</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <script
    async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3940256099942544"
    crossorigin="anonymous"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: #0a0a0a;
      color: #fff;
      display: flex;
      height: 100vh;
      flex-direction: column;
    }

    button,
    input {
      font-family: inherit;
    }

    .main-content {
      display: flex;
      flex-grow: 1;
      min-height: 0;
    }

    /* SIDEBAR */

    .sidebar {
      width: 240px;
      background: #1a0000;
      border-right: 1px solid #400000;
      display: flex;
      flex-direction: column;
      padding: 1rem 0;
      flex-shrink: 0;
    }

    .channel-list {
      flex-grow: 1;
      overflow-y: auto;
    }

    .channel {
      padding: 0.65rem 1.25rem;
      border-radius: 5px;
      cursor: pointer;
      color: #fff;
      font-size: 0.95rem;
    }

    .channel:hover {
      background: #330000;
    }

    /* CHAT */

    .chat-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      padding: 1rem;
      background: #1a0000;
      border-bottom: 1px solid #400000;
      font-size: 1rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .chat-main {
      display: flex;
      flex-grow: 1;
      min-height: 0;
    }

    .chat-messages {
      flex-grow: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-width: 0;
    }

    /* MESSAGE */

    .message {
      display: flex;
      gap: 0.6rem;
      max-width: min(70%, 700px);
      align-items: flex-start;
    }

    .message.self {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-content {
      background: #1a1a1a;
      padding: 0.6rem 0.9rem;
      border-radius: 0.6rem;
      overflow-wrap: anywhere;
    }

    .message.self .message-content {
      background: #330000;
    }

    .message-meta {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 0.25rem;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    /* EMBEDS */

    .kr-embed {
      max-width: 480px;
    }

    .kr-embed a {
      transition: opacity 0.15s ease;
    }

    .kr-embed a:hover {
      opacity: 0.8;
    }

    .kr-embed img,
    .kr-embed video {
      max-width: 400px;
    }

    .kr-embed-reactions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .kr-embed-placeholder {
      min-height: 20px;
    }

    /* USER LIST */

    .user-list {
      width: 200px;
      background: #1a0000;
      border-left: 1px solid #400000;
      padding: 1rem 0.75rem;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #43b581;
      flex-shrink: 0;
    }

    /* INPUT */

    .chat-input {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 1rem;
      border-top: 1px solid #400000;
      background: #1a0000;
      flex-shrink: 0;
    }

    .chat-input input[type="text"] {
      flex-grow: 1;
      min-width: 0;
      padding: 0.7rem;
      border: none;
      outline: none;
      border-radius: 0.5rem;
      background: #333;
      color: #fff;
      font-size: 1rem;
    }

    .chat-input button {
      background: #ff4d4d;
      border: none;
      padding: 0.7rem 1rem;
      border-radius: 0.5rem;
      color: white;
      cursor: pointer;
      white-space: nowrap;
    }

    .chat-input button:hover {
      background: #cc0000;
    }

    .file-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #333;
      color: white;
      padding: 0.7rem 0.9rem;
      border-radius: 0.5rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .file-button:hover {
      background: #444;
    }

    #fileInput {
      display: none;
    }

    /* ADS */

    .ad-banner {
      background: #111;
      text-align: center;
      padding: 0.5rem;
      font-size: 0.9rem;
      border-bottom: 1px solid #400000;
      flex-shrink: 0;
    }

    /* FILE PREVIEW */

    .upload-preview {
      display: none;
      padding: 0.5rem 1rem;
      background: #120000;
      border-top: 1px solid #300000;
    }

    .upload-preview.active {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .upload-preview img,
    .upload-preview video {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 6px;
    }

    .upload-preview-info {
      min-width: 0;
      flex-grow: 1;
    }

    .upload-preview-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .upload-preview-type {
      color: #888;
      font-size: 0.75rem;
    }

    .clear-upload {
      background: #333 !important;
      padding: 0.45rem 0.7rem !important;
    }

    /* MOBILE */

    @media (max-width: 800px) {
      .sidebar {
        display: none;
      }

      .user-list {
        display: none;
      }

      .message {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       AD
  ======================================================== -->

  <div class="ad-banner">
    <ins
      class="adsbygoogle"
      style="display:block"
      data-ad-client="ca-pub-3940256099942544"
      data-ad-slot="6300978111"
      data-ad-format="auto"
      data-full-width-responsive="true"
    ></ins>

    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>

  <!-- =======================================================
       MAIN
  ======================================================== -->

  <div class="main-content">

    <!-- SIDEBAR -->

    <div class="sidebar">
      <div class="channel-list">
        <div class="channel"># general</div>
        <div class="channel"># support</div>
        <div class="channel"># random</div>
      </div>
    </div>

    <!-- CHAT -->

    <div class="chat-container">

      <div class="chat-header">
        # general
      </div>

      <div class="chat-main">

        <div
          class="chat-messages"
          id="chatMessages"
        >

          <!-- Example message -->

          <div class="message other">

            <img
              class="avatar"
              src="https://cdn.krynet.com/avatars/default1.png"
              alt="User"
            />

            <div>

              <div class="message-meta">
                <strong>UserA</strong>
                • 12:34 PM
              </div>

              <div class="message-content">
                Welcome to KrynetAI.free
              </div>

            </div>

          </div>

        </div>

        <!-- USER LIST -->

        <div class="user-list">

          <div class="user">

            <div class="status-dot"></div>

            <img
              class="avatar"
              src="https://cdn.krynet.com/avatars/default1.png"
              alt="UserA"
            />

            <span>UserA</span>

          </div>

          <div class="user">

            <div
              class="status-dot"
              style="background-color:#faa61a;"
            ></div>

            <img
              class="avatar"
              src="https://cdn.krynet.com/avatars/default2.png"
              alt="UserB"
            />

            <span>UserB</span>

          </div>

        </div>

      </div>

      <!-- UPLOAD PREVIEW -->

      <div
        id="uploadPreview"
        class="upload-preview"
      ></div>

      <!-- INPUT -->

      <div class="chat-input">

        <label
          class="file-button"
          for="fileInput"
          title="Attach file"
        >
          📎
        </label>

        <input
          type="file"
          id="fileInput"
          accept="image/*,video/*,audio/*,.pdf,.avif,.heif,.heic,.aac,.m4a,.mp4"
        />

        <input
          type="text"
          id="chatInput"
          placeholder="Type your message..."
          autocomplete="off"
        />

        <button id="sendBtn">
          Send
        </button>

      </div>

    </div>

  </div>

  <!-- =======================================================
       KRYNET JAVASCRIPT
       
       Keep these as external files.
       Order matters for dependencies.
  ======================================================== -->

  <script src="./js/Cloudflare.js"></script>
  <script src="./js/anonymous-upload.js"></script>
  <script src="./js/blurNSFW.js"></script>
  <script src="./js/clearURLS.js"></script>
  <script src="./js/copyFileContents.js"></script>
  <script src="./js/country-blocker.js"></script>
  <script src="./js/dearrow.js"></script>

  <!-- embed.js imports reactions.js, so reactions must load first -->
  <script src="./js/reactions.js"></script>
  <script
    type="module"
    src="./js/embed.js"
  ></script>

  <script src="./js/krysearch.js"></script>
  <script src="./js/markdownRenderer.js"></script>
  <script src="./js/openInApp.js"></script>
  <script src="./js/screenshare.js"></script>
  <script src="./js/sponsorblock.js"></script>
  <script src="./js/tpm.js"></script>
  <script src="./js/voicechat.js"></script>
  <script src="./js/webcam.js"></script>
  <script src="./js/youtubeAdblock.js"></script>

  <!-- =======================================================
       CHAT APP
  ======================================================== -->

  <script>
    "use strict";

    const input =
      document.getElementById("chatInput");

    const button =
      document.getElementById("sendBtn");

    const chat =
      document.getElementById("chatMessages");

    const fileInput =
      document.getElementById("fileInput");

    const uploadPreview =
      document.getElementById("uploadPreview");

    let msgCount = 0;
    let selectedFile = null;
    let selectedFileURL = null;


    /* -------------------------------------------------------
       FILE PREVIEW
    ------------------------------------------------------- */

    function clearSelectedFile() {
      selectedFile = null;

      if (selectedFileURL) {
        URL.revokeObjectURL(selectedFileURL);
        selectedFileURL = null;
      }

      uploadPreview.replaceChildren();
      uploadPreview.classList.remove("active");
      fileInput.value = "";
    }


    function showSelectedFile(file) {
      clearSelectedFile();

      selectedFile = file;
      selectedFileURL = URL.createObjectURL(file);

      uploadPreview.classList.add("active");

      const info =
        document.createElement("div");

      info.className =
        "upload-preview-info";

      const name =
        document.createElement("div");

      name.className =
        "upload-preview-name";

      name.textContent =
        file.name;

      const type =
        document.createElement("div");

      type.className =
        "upload-preview-type";

      type.textContent =
        file.type || "Unknown file type";

      info.append(
        name,
        type
      );

      uploadPreview.appendChild(info);

      const clearButton =
        document.createElement("button");

      clearButton.type = "button";
      clearButton.className = "clear-upload";
      clearButton.textContent = "×";
      clearButton.title = "Remove attachment";

      clearButton.addEventListener(
        "click",
        clearSelectedFile
      );

      uploadPreview.appendChild(
        clearButton
      );
    }


    fileInput.addEventListener(
      "change",
      () => {
        const file =
          fileInput.files?.[0];

        if (!file) {
          clearSelectedFile();
          return;
        }

        showSelectedFile(file);
      }
    );


    /* -------------------------------------------------------
       MESSAGE
    ------------------------------------------------------- */

    function createMessageElement(
      text,
      file = null
    ) {
      const container =
        document.createElement("div");

      container.className =
        "message self";

      const avatar =
        document.createElement("img");

      avatar.className =
        "avatar";

      avatar.src =
        "https://cdn.krynet.com/avatars/default2.png";

      avatar.alt =
        "You";

      const infoWrap =
        document.createElement("div");

      const meta =
        document.createElement("div");

      meta.className =
        "message-meta";

      const strong =
        document.createElement("strong");

      strong.textContent =
        "You";

      const time =
        document.createTextNode(
          " • " +
          new Date().toLocaleTimeString(
            [],
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )
        );

      meta.append(
        strong,
        time
      );

      const bubble =
        document.createElement("div");

      bubble.className =
        "message-content";

      if (text) {
        const textNode =
          document.createElement("div");

        textNode.textContent =
          text;

        bubble.appendChild(
          textNode
        );
      }

      /*
       * Local file embed.
       *
       * This makes the uploaded file appear
       * directly inside the Discord-style
       * message bubble instead of only showing
       * a separate preview above the input.
       */

      if (file) {
        const media =
          createLocalFileEmbed(file);

        if (media) {
          bubble.appendChild(media);
        }
      }

      infoWrap.append(
        meta,
        bubble
      );

      container.append(
        avatar,
        infoWrap
      );

      return container;
    }


    /* -------------------------------------------------------
       LOCAL FILE EMBED
    ------------------------------------------------------- */

    function createLocalFileEmbed(file) {
      const url =
        URL.createObjectURL(file);

      const extension =
        file.name
          .split(".")
          .pop()
          ?.toLowerCase() || "";

      const card =
        document.createElement("div");

      card.className =
        "kr-embed";

      Object.assign(
        card.style,
        {
          display: "flex",
          background: "#2f3136",
          borderRadius: "8px",
          maxWidth: "480px",
          marginTop: "6px",
          overflow: "hidden",
          fontFamily:
            "gg sans, Arial, sans-serif"
        }
      );

      const bar =
        document.createElement("div");

      Object.assign(
        bar.style,
        {
          width: "4px",
          flexShrink: "0",
          background: "#5865F2"
        }
      );

      const body =
        document.createElement("div");

      Object.assign(
        body.style,
        {
          padding: "10px",
          flex: "1",
          minWidth: "0"
        }
      );

      const title =
        document.createElement("div");

      title.textContent =
        file.name;

      Object.assign(
        title.style,
        {
          color: "#00aff4",
          fontWeight: "600",
          fontSize: "14px",
          overflowWrap: "anywhere"
        }
      );

      body.appendChild(title);

      if (
        file.type.startsWith("image/") ||
        extension === "avif" ||
        extension === "heif" ||
        extension === "heic"
      ) {
        const image =
          document.createElement("img");

        image.src = url;
        image.alt = file.name;
        image.loading = "lazy";

        Object.assign(
          image.style,
          {
            maxWidth: "400px",
            width: "100%",
            maxHeight: "400px",
            objectFit: "contain",
            borderRadius: "6px",
            marginTop: "6px",
            display: "block"
          }
        );

        body.appendChild(image);

      } else if (
        file.type.startsWith("video/") ||
        extension === "mp4"
      ) {
        const video =
          document.createElement("video");

        video.src = url;
        video.controls = true;
        video.preload = "metadata";

        Object.assign(
          video.style,
          {
            maxWidth: "400px",
            width: "100%",
            borderRadius: "6px",
            marginTop: "6px",
            display: "block"
          }
        );

        body.appendChild(video);

      } else if (
        file.type.startsWith("audio/") ||
        extension === "aac" ||
        extension === "m4a"
      ) {
        const audio =
          document.createElement("audio");

        audio.src = url;
        audio.controls = true;
        audio.preload = "metadata";

        Object.assign(
          audio.style,
          {
            width: "100%",
            marginTop: "6px"
          }
        );

        body.appendChild(audio);

      } else if (
        file.type === "application/pdf"
      ) {
        const frame =
          document.createElement("iframe");

        frame.src = url;
        frame.loading = "lazy";
        frame.title = "PDF document";

        Object.assign(
          frame.style,
          {
            width: "100%",
            height: "400px",
            border: "none",
            borderRadius: "6px",
            marginTop: "6px"
          }
        );

        body.appendChild(frame);

      } else {
        const generic =
          document.createElement("div");

        generic.textContent =
          "📎 " + file.name;

        Object.assign(
          generic.style,
          {
            background: "#3a3b3c",
            padding: "8px",
            borderRadius: "6px",
            marginTop: "6px",
            fontSize: "13px"
          }
        );

        body.appendChild(generic);
      }

      card.append(
        bar,
        body
      );

      return card;
    }


    /* -------------------------------------------------------
       SEND
    ------------------------------------------------------- */

    function sendMessage() {
      const text =
        input.value.trim();

      if (!text && !selectedFile) {
        return;
      }

      const file =
        selectedFile;

      const message =
        createMessageElement(
          text,
          file
        );

      chat.appendChild(message);

      /*
       * embed.js scans actual chat messages for URLs.
       *
       * This is what gives normal pasted URLs their
       * Discord-style embeds.
       */

      if (
        window.Embed &&
        typeof window.Embed.scanMessages ===
          "function"
      ) {
        window.Embed.scanMessages(
          ".message"
        );
      }

      msgCount++;

      /*
       * Ad every five messages.
       */

      if (msgCount % 5 === 0) {
        const adContainer =
          document.createElement("div");

        adContainer.className =
          "message";

        adContainer.innerHTML = `
          <div style="width:100%">
            <ins
              class="adsbygoogle"
              style="display:block;width:100%;"
              data-ad-client="ca-pub-3940256099942544"
              data-ad-slot="6300978111"
              data-ad-format="auto"
              data-full-width-responsive="true"
            ></ins>
          </div>
        `;

        chat.appendChild(
          adContainer
        );

        try {
          (
            window.adsbygoogle =
              window.adsbygoogle || []
          ).push({});
        } catch {
          // AdSense unavailable.
        }
      }

      input.value = "";

      clearSelectedFile();

      chat.scrollTop =
        chat.scrollHeight;
    }


    button.addEventListener(
      "click",
      sendMessage
    );


    input.addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          event.preventDefault();
          sendMessage();
        }
      }
    );


    /* -------------------------------------------------------
       INITIAL EMBED SCAN
    ------------------------------------------------------- */

    function scanExistingMessages() {
      if (
        window.Embed &&
        typeof window.Embed.scanMessages ===
          "function"
      ) {
        window.Embed.scanMessages(
          ".message"
        );
      }
    }


    /*
     * embed.js is a module, so give it a moment
     * to initialize before performing the first scan.
     */

    window.addEventListener(
      "load",
      scanExistingMessages
    );

  </script>

</body>
</html>
