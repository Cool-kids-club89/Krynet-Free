<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">

  <title>KrynetAI.free – Chat</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <script
    async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3940256099942544"
    crossorigin="anonymous"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: #0a0a0a;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* -------------------------------------------------------
       AD
    ------------------------------------------------------- */

    .ad-banner {
      background: #111;
      border-bottom: 1px solid #400000;
      text-align: center;
      padding: 8px;
      min-height: 60px;
    }

    /* -------------------------------------------------------
       LAYOUT
    ------------------------------------------------------- */

    .main-content {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* -------------------------------------------------------
       SIDEBAR
    ------------------------------------------------------- */

    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: #1a0000;
      border-right: 1px solid #400000;
      display: flex;
      flex-direction: column;
      padding: 16px 0;
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
    }

    .channel {
      padding: 9px 20px;
      border-radius: 5px;
      cursor: pointer;
      color: #fff;
      font-size: 15px;
    }

    .channel:hover {
      background: #330000;
    }

    .channel.active {
      background: #400000;
      font-weight: 600;
    }

    /* -------------------------------------------------------
       CHAT
    ------------------------------------------------------- */

    .chat-container {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 16px;
      background: #1a0000;
      border-bottom: 1px solid #400000;
      font-weight: 600;
      flex-shrink: 0;
    }

    .chat-main {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .chat-messages {
      flex: 1;
      min-width: 0;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* -------------------------------------------------------
       MESSAGES
    ------------------------------------------------------- */

    .message {
      display: flex;
      gap: 10px;
      max-width: min(760px, 80%);
      align-items: flex-start;
      position: relative;
      padding: 4px 0;
    }

    .message.self {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-content-wrapper {
      min-width: 0;
    }

    .message-content {
      background: #1a1a1a;
      padding: 10px 13px;
      border-radius: 9px;
      overflow-wrap: anywhere;
    }

    .message.self .message-content {
      background: #330000;
    }

    .message-meta {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* -------------------------------------------------------
       USER LIST
    ------------------------------------------------------- */

    .user-list {
      width: 210px;
      flex-shrink: 0;
      background: #1a0000;
      border-left: 1px solid #400000;
      padding: 16px 12px;
      overflow-y: auto;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .user .avatar {
      width: 30px;
      height: 30px;
      flex-basis: 30px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #43b581;
    }

    /* -------------------------------------------------------
       INPUT
    ------------------------------------------------------- */

    .chat-input {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid #400000;
      background: #1a0000;
      flex-shrink: 0;
    }

    .chat-input input {
      flex: 1;
      min-width: 0;
      padding: 11px 13px;
      border: 1px solid #444;
      border-radius: 8px;
      outline: none;
      background: #222;
      color: #fff;
      font: inherit;
    }

    .chat-input input:focus {
      border-color: #ff4d4d;
    }

    .chat-input button {
      background: #ff4d4d;
      border: 0;
      padding: 10px 18px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    .chat-input button:hover {
      background: #cc0000;
    }

    /* -------------------------------------------------------
       EMBEDS
    ------------------------------------------------------- */

    .kr-embed {
      max-width: 480px;
    }

    /* -------------------------------------------------------
       FILE EMBEDS
    ------------------------------------------------------- */

    .file-embed {
      margin-top: 8px;
      padding: 10px;
      border-radius: 8px;
      background: #111;
      border: 1px solid #333;
    }

    .file-embed img,
    .file-embed video {
      display: block;
      max-width: 100%;
      border-radius: 7px;
    }

    .file-embed audio {
      width: 100%;
    }

    .file-name {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 8px;
      overflow-wrap: anywhere;
    }

    /* -------------------------------------------------------
       MOBILE
    ------------------------------------------------------- */

    @media (max-width: 850px) {
      .sidebar {
        width: 190px;
      }

      .user-list {
        display: none;
      }

      .message {
        max-width: 90%;
      }
    }

    @media (max-width: 600px) {
      .sidebar {
        display: none;
      }

      .chat-messages {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       AD
  ======================================================== -->

  <div class="ad-banner">
    <ins
      class="adsbygoogle"
      style="display:block"
      data-ad-client="ca-pub-3940256099942544"
      data-ad-slot="6300978111"
      data-ad-format="auto"
      data-full-width-responsive="true"
    ></ins>

    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>

  <!-- =======================================================
       MAIN
  ======================================================== -->

  <div class="main-content">

    <!-- =====================================================
         CHANNEL SIDEBAR
    ====================================================== -->

    <aside class="sidebar">
      <div class="channel-list">

        <div class="channel active">
          # general
        </div>

        <div class="channel">
          # support
        </div>

        <div class="channel">
          # random
        </div>

      </div>
    </aside>

    <!-- =====================================================
         CHAT
    ====================================================== -->

    <main class="chat-container">

      <header class="chat-header">
        # general
      </header>

      <div class="chat-main">

        <!-- ===============================================
             MESSAGES
        ================================================ -->

        <section
          class="chat-messages"
          id="chatMessages"
        >

          <div class="message other">

            <img
              class="avatar"
              src="https://cdn.krynet.com/avatars/default1.png"
              alt="UserA"
            >

            <div class="message-content-wrapper">

              <div class="message-meta">
                <strong>UserA</strong>
                • 12:34 PM
              </div>

              <div class="message-content">
                Welcome to KrynetAI.free
              </div>

            </div>

          </div>

        </section>

        <!-- ===============================================
             ONLINE USERS
        ================================================ -->

        <aside class="user-list">

          <div class="user">
            <div class="status-dot"></div>

            <img
              class="avatar"
              src="https://cdn.krynet.com/avatars/default1.png"
              alt="UserA"
            >

            <span>UserA</span>
          </div>

          <div class="user">
            <div
              class="status-dot"
              style="background-color:#faa61a"
            ></div>

            <img
              class="avatar"
              src="https://cdn.krynet.com/avatars/default2.png"
              alt="UserB"
            >

            <span>UserB</span>
          </div>

        </aside>

      </div>

      <!-- =================================================
           MESSAGE INPUT
      ================================================== -->

      <div class="chat-input">

        <input
          type="text"
          id="chatInput"
          placeholder="Type your message..."
          autocomplete="off"
        >

        <button id="sendBtn">
          Send
        </button>

      </div>

    </main>

  </div>

  <!-- =====================================================
       CHAT LOGIC
  ====================================================== -->

  <script>
    "use strict";

    const input =
      document.getElementById("chatInput");

    const button =
      document.getElementById("sendBtn");

    const chat =
      document.getElementById("chatMessages");

    let msgCount = 0;

    function createMessage(text) {
      const container =
        document.createElement("div");

      container.className =
        "message self";

      const avatar =
        document.createElement("img");

      avatar.className =
        "avatar";

      avatar.src =
        "https://cdn.krynet.com/avatars/default2.png";

      avatar.alt =
        "You";

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "message-content-wrapper";

      const meta =
        document.createElement("div");

      meta.className =
        "message-meta";

      const name =
        document.createElement("strong");

      name.textContent =
        "You";

      const separator =
        document.createTextNode(
          " • " +
          new Date().toLocaleTimeString(
            [],
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )
        );

      meta.append(
        name,
        separator
      );

      const bubble =
        document.createElement("div");

      bubble.className =
        "message-content";

      bubble.textContent =
        text;

      wrapper.append(
        meta,
        bubble
      );

      container.append(
        avatar,
        wrapper
      );

      return container;
    }

    function addAd() {
      const adContainer =
        document.createElement("div");

      adContainer.className =
        "message";

      const ad =
        document.createElement("ins");

      ad.className =
        "adsbygoogle";

      ad.style.display =
        "block";

      ad.style.width =
        "100%";

      ad.dataset.adClient =
        "ca-pub-3940256099942544";

      ad.dataset.adSlot =
        "6300978111";

      ad.dataset.adFormat =
        "auto";

      ad.dataset.fullWidthResponsive =
        "true";

      adContainer.appendChild(ad);

      chat.appendChild(
        adContainer
      );

      try {
        (
          window.adsbygoogle =
          window.adsbygoogle || []
        ).push({});
      } catch {
        // AdSense may not be ready yet.
      }
    }

    function sendMessage() {
      const text =
        input.value.trim();

      if (!text) {
        return;
      }

      const message =
        createMessage(text);

      chat.appendChild(
        message
      );

      msgCount++;

      if (msgCount % 5 === 0) {
        addAd();
      }

      input.value = "";

      chat.scrollTop =
        chat.scrollHeight;
    }

    button.addEventListener(
      "click",
      sendMessage
    );

    input.addEventListener(
      "keydown",
      event => {
        if (event.key !== "Enter") {
          return;
        }

        event.preventDefault();

        sendMessage();
      }
    );
  </script>

</body>
