<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="color-scheme"
        content="dark"
    >

    <title>Krynet Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #0f1012;
            color: #f2f3f5;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            overflow: hidden;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* -------------------------------------------------
           APP
        ------------------------------------------------- */

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* -------------------------------------------------
           HEADER
        ------------------------------------------------- */

        .header {
            height: 56px;
            flex-shrink: 0;

            display: flex;
            align-items: center;

            padding: 0 18px;

            background: #18191c;
            border-bottom: 1px solid #292b2f;
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
        }

        .header-subtitle {
            margin-left: 10px;

            color: #72767d;
            font-size: 13px;
        }

        /* -------------------------------------------------
           MESSAGES
        ------------------------------------------------- */

        #messages {
            flex: 1;

            overflow-y: auto;
            overflow-x: hidden;

            padding: 18px 0 24px;
        }

        #messages::-webkit-scrollbar {
            width: 10px;
        }

        #messages::-webkit-scrollbar-track {
            background: transparent;
        }

        #messages::-webkit-scrollbar-thumb {
            background: #202225;
            border-radius: 10px;
        }

        .message {
            position: relative;

            display: flex;
            gap: 12px;

            padding: 7px 24px;

            transition:
                background 120ms ease;
        }

        .message:hover {
            background: rgba(255, 255, 255, 0.025);
        }

        .avatar {
            width: 40px;
            height: 40px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #5865f2;
            border-radius: 50%;

            font-size: 15px;
            font-weight: 700;
        }

        .message-main {
            min-width: 0;
            flex: 1;
        }

        .message-header {
            display: flex;
            align-items: baseline;
            gap: 8px;

            min-height: 20px;
        }

        .username {
            color: #ffffff;
            font-size: 15px;
            font-weight: 650;
        }

        .timestamp {
            color: #72767d;
            font-size: 11px;
        }

        .message-content {
            color: #dcddde;
            font-size: 15px;
            line-height: 1.45;

            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .message-content a {
            color: #00aff4;
        }

        /* -------------------------------------------------
           EMBEDS
        ------------------------------------------------- */

        .message-embeds {
            display: flex;
            flex-direction: column;
            align-items: flex-start;

            margin-top: 6px;
        }

        .kr-embed {
            width: min(520px, 100%);

            display: flex;

            background: #2b2d31;
            border-radius: 7px;

            overflow: hidden;

            margin-top: 4px;

            border: 1px solid rgba(
                255,
                255,
                255,
                0.04
            );
        }

        .kr-embed-bar {
            width: 4px;
            flex-shrink: 0;
            background: #5865f2;
        }

        .kr-embed-body {
            min-width: 0;
            flex: 1;

            padding: 10px;
        }

        .kr-embed-title {
            display: block;

            color: #00aff4;

            font-size: 14px;
            font-weight: 650;

            text-decoration: none;

            overflow-wrap: anywhere;
        }

        .kr-embed-description {
            margin-top: 3px;

            color: #b9bbbe;

            font-size: 12px;
            line-height: 1.4;

            overflow-wrap: anywhere;
        }

        .kr-embed-provider {
            margin-top: 6px;

            color: #72767d;
            font-size: 11px;
        }

        .kr-embed-image {
            display: block;

            width: 100%;
            max-width: 500px;

            margin-top: 8px;

            border-radius: 5px;
        }

        .kr-embed-video {
            display: block;

            width: 100%;
            max-width: 500px;

            aspect-ratio: 16 / 9;

            margin-top: 8px;

            border: 0;
            border-radius: 5px;

            background: #000;
        }

        .kr-embed-media {
            display: block;

            width: 100%;
            max-width: 500px;

            margin-top: 8px;

            border-radius: 5px;
        }

        .kr-embed-audio {
            display: block;

            width: 100%;
            margin-top: 8px;
        }

        .kr-embed-file {
            margin-top: 8px;

            padding: 9px;

            background: #202225;
            border-radius: 5px;

            color: #b9bbbe;
            font-size: 13px;
        }

        /* -------------------------------------------------
           REACTIONS
        ------------------------------------------------- */

        .message-actions {
            position: absolute;

            right: 24px;
            top: -18px;

            display: none;

            background: #18191c;
            border: 1px solid #292b2f;
            border-radius: 7px;

            padding: 4px;

            z-index: 20;
        }

        .message:hover .message-actions {
            display: flex;
        }

        .react-button {
            width: 32px;
            height: 30px;

            border: 0;
            border-radius: 5px;

            background: transparent;
            color: #b9bbbe;

            font-size: 17px;
        }

        .react-button:hover {
            background: #2f3136;
            color: #ffffff;
        }

        .message-reactions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;

            margin-top: 5px;
        }

        .reaction {
            display: inline-flex;
            align-items: center;
            gap: 4px;

            min-height: 24px;

            padding: 2px 7px;

            border: 1px solid #3f4147;
            border-radius: 6px;

            background: #2b2d31;

            color: #dcddde;

            font-size: 13px;
        }

        .reaction:hover {
            border-color: #5865f2;
        }

        /* -------------------------------------------------
           COMPOSER
        ------------------------------------------------- */

        .composer-wrap {
            flex-shrink: 0;

            padding: 10px 18px 18px;

            background: #18191c;
        }

        .composer {
            min-height: 52px;

            display: flex;
            align-items: flex-end;
            gap: 8px;

            padding: 8px;

            background: #383a40;
            border-radius: 8px;
        }

        #fileInput {
            display: none;
        }

        .composer-button {
            width: 34px;
            height: 34px;

            flex-shrink: 0;

            border: 0;
            border-radius: 6px;

            background: transparent;
            color: #b9bbbe;

            font-size: 22px;
        }

        .composer-button:hover {
            color: #ffffff;
            background: #4a4c52;
        }

        #messageInput {
            flex: 1;

            min-height: 34px;
            max-height: 180px;

            resize: none;

            padding: 7px 4px;

            border: 0;
            outline: 0;

            background: transparent;
            color: #ffffff;

            line-height: 20px;
        }

        #messageInput::placeholder {
            color: #72767d;
        }

        #sendButton {
            width: 42px;
            height: 34px;

            flex-shrink: 0;

            border: 0;
            border-radius: 6px;

            background: #5865f2;
            color: white;

            font-size: 16px;
        }

        #sendButton:hover {
            background: #4752c4;
        }

        /* -------------------------------------------------
           UPLOAD PREVIEW
        ------------------------------------------------- */

        #uploadPreview {
            display: none;

            margin-bottom: 8px;
            padding: 10px;

            background: #2b2d31;
            border-radius: 7px;

            color: #b9bbbe;
            font-size: 13px;
        }

        #uploadPreview.active {
            display: block;
        }

        .upload-name {
            color: #ffffff;
            font-weight: 600;
        }

        /* -------------------------------------------------
           MOBILE
        ------------------------------------------------- */

        @media (max-width: 600px) {
            .message {
                padding-left: 12px;
                padding-right: 12px;
            }

            .composer-wrap {
                padding-left: 8px;
                padding-right: 8px;
            }

            .message-actions {
                right: 12px;
            }

            .avatar {
                width: 34px;
                height: 34px;
            }
        }
    </style>
</head>

<body>

<div id="app">

    <header class="header">
        <div class="header-title">
            Krynet
        </div>

        <div class="header-subtitle">
            # general
        </div>
    </header>


    <main id="messages">

        <!--
            Messages are intentionally separate from their
            embed container.

            This is important:
            .message
              .message-main
                .message-content
                .message-embeds
                .message-reactions

            The embed never replaces the message.
        -->

    </main>


    <footer class="composer-wrap">

        <div id="uploadPreview"></div>

        <div class="composer">

            <label
                class="composer-button"
                title="Upload file"
            >
                +
                <input
                    id="fileInput"
                    type="file"
                    accept="image/*,video/*,audio/*,.pdf,.avif,.heif,.heic,.aac,.m4a,.mp4"
                >
            </label>

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Message #general"
                autocomplete="off"
            ></textarea>

            <button
                id="sendButton"
                type="button"
                title="Send"
            >
                ➤
            </button>

        </div>

    </footer>

</div>


<!-- =====================================================
     YOUR JS FILES
===================================================== -->

<script
    type="module"
    src="./js/reactions.js"
></script>

<script
    src="./js/anonymous-upload.js"
></script>

<script
    type="module"
    src="./js/embed.js"
></script>

<script
    type="module"
    src="./js/openInApp.js"
></script>


<script type="module">

    import { Embed } from "./js/embed.js";

    /*
     * ------------------------------------------------------
     * ELEMENTS
     * ------------------------------------------------------
     */

    const messages =
        document.getElementById("messages");

    const input =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const fileInput =
        document.getElementById("fileInput");

    const uploadPreview =
        document.getElementById("uploadPreview");


    /*
     * ------------------------------------------------------
     * REACTION EMOJIS
     * ------------------------------------------------------
     */

    const REACTIONS = [
        "👍",
        "❤️",
        "😂",
        "🔥",
        "😮",
        "😢",
        "🎉"
    ];


    /*
     * ------------------------------------------------------
     * URL HELPERS
     * ------------------------------------------------------
     */

    function escapeHTML(value) {
        const div =
            document.createElement("div");

        div.textContent = value;

        return div.innerHTML;
    }


    function linkify(text) {
        const fragment =
            document.createDocumentFragment();

        const regex =
            /https?:\/\/[^\s<>"']+/gi;

        let lastIndex = 0;

        for (
            const match of text.matchAll(regex)
        ) {
            const start =
                match.index;

            const url =
                match[0];

            if (start > lastIndex) {
                fragment.appendChild(
                    document.createTextNode(
                        text.slice(
                            lastIndex,
                            start
                        )
                    )
                );
            }

            const anchor =
                document.createElement("a");

            anchor.href = url;
            anchor.target = "_blank";
            anchor.rel =
                "noopener noreferrer";

            anchor.textContent = url;

            fragment.appendChild(anchor);

            lastIndex =
                start + url.length;
        }

        if (lastIndex < text.length) {
            fragment.appendChild(
                document.createTextNode(
                    text.slice(lastIndex)
                )
            );
        }

        return fragment;
    }


    /*
     * ------------------------------------------------------
     * MESSAGE
     * ------------------------------------------------------
     */

    function createMessage(
        username,
        text,
        file = null
    ) {
        const message =
            document.createElement("article");

        message.className =
            "message";


        /*
         * Avatar
         */

        const avatar =
            document.createElement("div");

        avatar.className =
            "avatar";

        avatar.textContent =
            username
                .slice(0, 1)
                .toUpperCase();


        /*
         * Main
         */

        const main =
            document.createElement("div");

        main.className =
            "message-main";


        /*
         * Header
         */

        const header =
            document.createElement("div");

        header.className =
            "message-header";


        const name =
            document.createElement("span");

        name.className =
            "username";

        name.textContent =
            username;


        const timestamp =
            document.createElement("span");

        timestamp.className =
            "timestamp";

        timestamp.textContent =
            "just now";


        header.append(
            name,
            timestamp
        );


        /*
         * Actual message text.
         *
         * IMPORTANT:
         * We do NOT hide or replace this.
         */

        const content =
            document.createElement("div");

        content.className =
            "message-content";

        content.appendChild(
            linkify(text)
        );


        /*
         * Embed container.
         *
         * Embed.js puts embeds HERE.
         * It does not replace the message.
         */

        const embeds =
            document.createElement("div");

        embeds.className =
            "message-embeds";


        /*
         * Reactions.
         */

        const reactions =
            document.createElement("div");

        reactions.className =
            "message-reactions";


        /*
         * Reaction button.
         */

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";


        const reactionButton =
            document.createElement("button");

        reactionButton.type =
            "button";

        reactionButton.className =
            "react-button";

        reactionButton.title =
            "Add reaction";

        reactionButton.textContent =
            "😊";


        reactionButton.addEventListener(
            "click",
            event => {
                event.stopPropagation();

                showReactionPicker(
                    reactionButton,
                    reactions
                );
            }
        );


        actions.appendChild(
            reactionButton
        );


        /*
         * Put everything together.
         */

        main.append(
            header,
            content,
            embeds,
            reactions
        );

        message.append(
            avatar,
            main,
            actions
        );


        /*
         * File attachment.
         */

        if (file) {
            createFileEmbed(
                file,
                embeds
            );
        }


        /*
         * Ask embed.js to scan THIS message.
         *
         * The important part is that Embed receives
         * the message element, while its implementation
         * inserts the embed into .message-embeds.
         */

        queueMicrotask(() => {
            Embed.scanMessages(
                ".message"
            );
        });


        return message;
    }


    /*
     * ------------------------------------------------------
     * REACTION PICKER
     * ------------------------------------------------------
     */

    function showReactionPicker(
        button,
        reactions
    ) {
        const existing =
            button.parentElement.querySelector(
                ".reaction-picker"
            );

        if (existing) {
            existing.remove();
            return;
        }

        const picker =
            document.createElement("div");

        picker.className =
            "reaction-picker";

        Object.assign(
            picker.style,
            {
                position: "absolute",
                right: "0",
                top: "36px",
                zIndex: "100",
                display: "flex",
                gap: "3px",
                padding: "6px",
                background: "#18191c",
                border: "1px solid #292b2f",
                borderRadius: "7px",
                boxShadow:
                    "0 8px 24px rgba(0,0,0,.35)"
            }
        );


        for (
            const emoji of REACTIONS
        ) {
            const option =
                document.createElement("button");

            option.type =
                "button";

            option.textContent =
                emoji;

            Object.assign(
                option.style,
                {
                    width: "30px",
                    height: "30px",
                    border: "0",
                    borderRadius: "5px",
                    background: "transparent",
                    color: "white",
                    fontSize: "17px",
                    cursor: "pointer"
                }
            );


            option.addEventListener(
                "mouseenter",
                () => {
                    option.style.background =
                        "#2f3136";
                }
            );


            option.addEventListener(
                "mouseleave",
                () => {
                    option.style.background =
                        "transparent";
                }
            );


            option.addEventListener(
                "click",
                () => {
                    addReaction(
                        reactions,
                        emoji
                    );

                    picker.remove();
                }
            );


            picker.appendChild(option);
        }


        button.parentElement.appendChild(
            picker
        );
    }


    /*
     * ------------------------------------------------------
     * ADD REACTION
     * ------------------------------------------------------
     */

    function addReaction(
        container,
        emoji
    ) {
        const existing =
            Array.from(
                container.children
            ).find(
                element =>
                    element.dataset.emoji ===
                    emoji
            );


        if (existing) {
            const count =
                Number(
                    existing.dataset.count || 1
                ) + 1;

            existing.dataset.count =
                String(count);

            existing.querySelector(
                ".reaction-count"
            ).textContent =
                String(count);

            return;
        }


        const reaction =
            document.createElement("button");

        reaction.type =
            "button";

        reaction.className =
            "reaction";

        reaction.dataset.emoji =
            emoji;

        reaction.dataset.count =
            "1";

        reaction.innerHTML = `
            <span>${emoji}</span>
            <span class="reaction-count">1</span>
        `;


        reaction.addEventListener(
            "click",
            () => {
                const count =
                    Number(
                        reaction.dataset.count
                    ) - 1;

                if (count <= 0) {
                    reaction.remove();
                    return;
                }

                reaction.dataset.count =
                    String(count);

                reaction.querySelector(
                    ".reaction-count"
                ).textContent =
                    String(count);
            }
        );


        container.appendChild(
            reaction
        );
    }


    /*
     * ------------------------------------------------------
     * FILE EMBED
     * ------------------------------------------------------
     */

    function createFileEmbed(
        file,
        container
    ) {
        const url =
            URL.createObjectURL(file);


        if (file.type.startsWith("image/")) {
            const image =
                document.createElement("img");

            image.className =
                "kr-embed-media";

            image.src = url;
            image.alt = file.name;
            image.loading = "lazy";

            container.appendChild(
                image
            );

            return;
        }


        if (file.type.startsWith("video/")) {
            const video =
                document.createElement("video");

            video.className =
                "kr-embed-media";

            video.src = url;
            video.controls = true;
            video.preload = "metadata";

            container.appendChild(
                video
            );

            return;
        }


        if (file.type.startsWith("audio/")) {
            const audio =
                document.createElement("audio");

            audio.className =
                "kr-embed-audio";

            audio.src = url;
            audio.controls = true;

            container.appendChild(
                audio
            );

            return;
        }


        const fileCard =
            document.createElement("div");

        fileCard.className =
            "kr-embed-file";

        fileCard.textContent =
            file.name;

        container.appendChild(
            fileCard
        );
    }


    /*
     * ------------------------------------------------------
     * SEND
     * ------------------------------------------------------
     */

    function sendMessage() {
        const text =
            input.value.trim();

        const file =
            fileInput.files?.[0] || null;


        if (!text && !file) {
            return;
        }


        const message =
            createMessage(
                "Barney",
                text,
                file
            );


        messages.appendChild(
            message
        );


        input.value = "";

        fileInput.value = "";

        uploadPreview.classList.remove(
            "active"
        );

        uploadPreview.replaceChildren();


        messages.scrollTop =
            messages.scrollHeight;


        /*
         * Scan after the element is actually
         * attached to the DOM.
         */

        Embed.scanMessages(
            ".message"
        );
    }


    sendButton.addEventListener(
        "click",
        sendMessage
    );


    input.addEventListener(
        "keydown",
        event => {
            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {
                event.preventDefault();
                sendMessage();
            }
        }
    );


    /*
     * ------------------------------------------------------
     * TEXTAREA AUTO GROW
     * ------------------------------------------------------
     */

    input.addEventListener(
        "input",
        () => {
            input.style.height =
                "auto";

            input.style.height =
                Math.min(
                    input.scrollHeight,
                    180
                ) + "px";
        }
    );


    /*
     * ------------------------------------------------------
     * UPLOAD PREVIEW
     * ------------------------------------------------------
     */

    fileInput.addEventListener(
        "change",
        () => {
            const file =
                fileInput.files?.[0];

            uploadPreview.replaceChildren();

            if (!file) {
                uploadPreview.classList.remove(
                    "active"
                );

                return;
            }


            uploadPreview.classList.add(
                "active"
            );


            const label =
                document.createElement("span");

            label.textContent =
                "Attachment: ";


            const name =
                document.createElement("span");

            name.className =
                "upload-name";

            name.textContent =
                file.name;


            uploadPreview.append(
                label,
                name
            );
        }
    );


    /*
     * ------------------------------------------------------
     * DEMO MESSAGE
     * ------------------------------------------------------
     */

    messages.appendChild(
        createMessage(
            "Krynet",
            "Paste a YouTube link or any supported URL and the embed will appear underneath the message."
        )
    );


    /*
     * ------------------------------------------------------
     * INITIAL EMBED SCAN
     * ------------------------------------------------------
     */

    Embed.scanMessages(
        ".message"
    );

</script>

</body>
</html>
