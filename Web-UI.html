<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="color-scheme"
        content="dark"
    >

    <title>Krynet Community</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #202225;
            color: #ffffff;
            overflow: hidden;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            border: 0;
        }

        /* =====================================================
           APP
        ===================================================== */

        .app {
            width: 100%;
            height: 100%;
            display: flex;
            overflow: hidden;
        }

        /* =====================================================
           SERVER SIDEBAR
        ===================================================== */

        .server-sidebar {
            width: 72px;
            flex-shrink: 0;
            background: #1e1f22;
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .server-button {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: #313338;
            color: #fff;
            cursor: pointer;
            font-size: 19px;
            transition:
                border-radius .15s,
                background .15s,
                transform .15s;
        }

        .server-button:hover {
            border-radius: 14px;
            background: #5865f2;
            transform: translateY(-1px);
        }

        .server-button.active {
            border-radius: 14px;
            background: #5865f2;
        }

        .server-divider {
            width: 32px;
            height: 1px;
            background: #35363c;
        }

        /* =====================================================
           CHANNEL SIDEBAR
        ===================================================== */

        .channel-sidebar {
            width: 240px;
            flex-shrink: 0;
            background: #2b2d31;
            display: flex;
            flex-direction: column;
        }

        .server-header {
            height: 52px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #1f2023;
            font-weight: 700;
            cursor: pointer;
        }

        .server-header:hover {
            background: #35373c;
        }

        .channel-list {
            flex: 1;
            padding: 12px 8px;
            overflow-y: auto;
        }

        .channel-category {
            padding: 10px 8px 5px;
            color: #949ba4;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .channel {
            width: 100%;
            min-height: 36px;
            padding: 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 5px;
            background: transparent;
            color: #949ba4;
            cursor: pointer;
            text-align: left;
            margin: 1px 0;
        }

        .channel:hover {
            background: #35373c;
            color: #dbdee1;
        }

        .channel.active {
            background: #404249;
            color: #fff;
        }

        .channel-icon {
            width: 22px;
            color: #80848e;
            font-size: 20px;
        }

        .channel.active .channel-icon {
            color: #fff;
        }

        .channel.voice {
            position: relative;
        }

        .channel.voice.connected {
            color: #fff;
            background: #35373c;
        }

        .voice-connection-dot {
            width: 7px;
            height: 7px;
            margin-left: auto;
            border-radius: 50%;
            background: #23a559;
            display: none;
        }

        .channel.voice.connected .voice-connection-dot {
            display: block;
        }

        /* =====================================================
           USER PANEL
        ===================================================== */

        .user-panel {
            min-height: 52px;
            padding: 8px;
            background: #232428;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #5865f2;
            font-size: 13px;
            font-weight: 700;
        }

        .user-info {
            min-width: 0;
            flex: 1;
        }

        .username {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-text {
            color: #949ba4;
            font-size: 11px;
        }

        .status-text.in-vc {
            color: #23a559;
        }

        /* =====================================================
           CHAT
        ===================================================== */

        .chat {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #313338;
        }

        .chat-header {
            height: 52px;
            flex-shrink: 0;
            padding: 0 16px;
            border-bottom: 1px solid #26272b;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,.15);
        }

        .chat-header-icon {
            color: #949ba4;
            font-size: 22px;
        }

        .chat-header-name {
            font-weight: 700;
        }

        .chat-header-topic {
            color: #949ba4;
            font-size: 13px;
            border-left: 1px solid #4b4d53;
            padding-left: 10px;
        }

        /* =====================================================
           CALL CONTROLS
        ===================================================== */

        .call-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-left: auto;
        }

        .call-button {
            width: 34px;
            height: 34px;
            border-radius: 7px;
            background: transparent;
            color: #b5bac1;
            cursor: pointer;
            font-size: 15px;
        }

        .call-button:hover {
            background: #404249;
            color: #fff;
        }

        .call-button.active {
            background: #5865f2;
            color: #fff;
        }

        .call-button.leave {
            color: #f23f42;
        }

        .call-button.leave:hover {
            background: #f23f42;
            color: #fff;
        }

        #joinVoiceButton,
        .vc-control {
            display: none;
        }

        .call-controls.voice-available #joinVoiceButton {
            display: block;
        }

        .call-controls.in-vc .vc-control {
            display: block;
        }

        .call-controls.in-vc #joinVoiceButton {
            display: none;
        }

        /* =====================================================
           MESSAGES
        ===================================================== */

        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 20px 18px 12px;
        }

        .message {
            position: relative;
            display: flex;
            gap: 12px;
            padding: 3px 8px;
            margin: 1px 0;
            border-radius: 4px;
        }

        .message:hover {
            background: rgba(0,0,0,.04);
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            margin-top: 1px;
            border-radius: 50%;
            background: #5865f2;
            display: grid;
            place-items: center;
            font-size: 14px;
            font-weight: 700;
        }

        .message-content {
            min-width: 0;
            max-width: min(850px,100%);
        }

        .message-author-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            min-height: 20px;
        }

        .message-author {
            font-size: 15px;
            font-weight: 600;
        }

        .message-time {
            color: #949ba4;
            font-size: 11px;
        }

        /*
         * IMPORTANT:
         * This is now a Markdown container.
         * Do NOT use white-space: pre-wrap here because
         * Markdown generates its own paragraphs/code blocks.
         */

        .message-text {
            color: #dbdee1;
            font-size: 15px;
            line-height: 1.45;
            overflow-wrap: anywhere;
            min-width: 0;
        }

        .message.link-only .message-text {
            display: none;
        }

        /* =====================================================
           MARKDOWN
        ===================================================== */

        .kr-markdown {
            min-width: 0;
        }

        .kr-markdown > :first-child {
            margin-top: 0;
        }

        .kr-markdown > :last-child {
            margin-bottom: 0;
        }

        .kr-markdown p {
            margin: 4px 0;
        }

        .kr-markdown h1,
        .kr-markdown h2,
        .kr-markdown h3,
        .kr-markdown h4,
        .kr-markdown h5,
        .kr-markdown h6 {
            color: #fff;
            line-height: 1.25;
            margin: 10px 0 5px;
        }

        .kr-markdown h1 {
            font-size: 24px;
        }

        .kr-markdown h2 {
            font-size: 20px;
        }

        .kr-markdown h3 {
            font-size: 17px;
        }

        .kr-markdown h4,
        .kr-markdown h5,
        .kr-markdown h6 {
            font-size: 15px;
        }

        .kr-markdown strong {
            color: #fff;
            font-weight: 700;
        }

        .kr-markdown em {
            color: #e1e4e8;
        }

        .kr-markdown del {
            color: #949ba4;
        }

        .kr-markdown a {
            color: #00aff4;
            text-decoration: none;
        }

        .kr-markdown a:hover {
            text-decoration: underline;
        }

        .kr-markdown ul,
        .kr-markdown ol {
            margin: 5px 0;
            padding-left: 24px;
        }

        .kr-markdown li {
            margin: 2px 0;
        }

        .kr-markdown blockquote {
            margin: 7px 0;
            padding: 3px 10px;
            border-left: 4px solid #4e5058;
            color: #b5bac1;
        }

        .kr-markdown hr {
            border: 0;
            border-top: 1px solid #4b4d53;
            margin: 10px 0;
        }

        .kr-markdown code {
            padding: 2px 5px;
            border-radius: 4px;
            background: #1e1f22;
            color: #f2f3f5;
            font-family:
                "Fira Code",
                "Cascadia Code",
                Consolas,
                monospace;
            font-size: .9em;
        }

        .kr-markdown pre {
            margin: 7px 0;
            padding: 12px;
            overflow-x: auto;
            border-radius: 7px;
            background: #1e1f22;
            border: 1px solid #111214;
        }

        .kr-markdown pre code {
            padding: 0;
            background: transparent;
            color: #dbdee1;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre;
        }

        .kr-markdown table {
            width: max-content;
            max-width: 100%;
            margin: 8px 0;
            border-collapse: collapse;
            display: block;
            overflow-x: auto;
        }

        .kr-markdown th,
        .kr-markdown td {
            padding: 6px 9px;
            border: 1px solid #4b4d53;
            text-align: left;
        }

        .kr-markdown th {
            background: #2b2d31;
            color: #fff;
        }

        .kr-markdown img {
            max-width: 100%;
            max-height: 420px;
            border-radius: 8px;
            display: block;
            margin: 6px 0;
        }

        .kr-markdown input[type="checkbox"] {
            margin-right: 6px;
            accent-color: #5865f2;
        }

        /* =====================================================
           FILE COPY
        ===================================================== */

        .kr-file-card {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            padding: 8px;
            max-width: 520px;
            border-radius: 7px;
            background: #2b2d31;
        }

        .kr-file-icon {
            font-size: 20px;
        }

        .kr-file-name {
            min-width: 0;
            flex: 1;
            color: #dbdee1;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .kr-copy-btn {
            width: 30px;
            height: 30px;
            flex-shrink: 0;
            border-radius: 6px;
            background: #404249;
            color: #dbdee1;
            cursor: pointer;
        }

        .kr-copy-btn:hover:not(:disabled) {
            background: #5865f2;
            color: #fff;
        }

        .kr-copy-btn:disabled {
            cursor: not-allowed;
        }

        .kr-toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%);
            z-index: 10000;
            padding: 10px 14px;
            border-radius: 7px;
            background: #111214;
            color: #fff;
            font-size: 13px;
            box-shadow: 0 8px 25px rgba(0,0,0,.4);
            opacity: 1;
            transition: opacity .3s ease;
            pointer-events: none;
        }

        .kr-toast.fade {
            opacity: 0;
        }

        /* =====================================================
           EMBEDS
        ===================================================== */

        .kr-embed {
            margin-top: 5px;
            max-width: 520px;
        }

        .kr-embed iframe {
            width: 100%;
            min-height: 292px;
            border: 0;
            border-radius: 7px;
            background: #18191c;
            display: block;
        }

        .kr-embed img {
            max-width: 100%;
            max-height: 420px;
            border-radius: 8px;
            object-fit: contain;
        }

        .kr-embed video {
            max-width: 100%;
            max-height: 420px;
            border-radius: 8px;
            background: #000;
        }

        /* =====================================================
           YOUTUBE
        ===================================================== */

        .youtube-embed {
            display: flex;
            max-width: 520px;
            overflow: hidden;
            border-radius: 8px;
            background: #2f3136;
        }

        .youtube-embed-bar {
            width: 4px;
            flex-shrink: 0;
            background: #ff0000;
        }

        .youtube-embed-body {
            flex: 1;
            min-width: 0;
            padding: 8px;
        }

        .youtube-embed iframe {
            min-height: 292px;
            width: 100%;
        }

        /* =====================================================
           REACTIONS
        ===================================================== */

        .kr-message-reactions,
        .message-reactions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 5px;
        }

        .kr-reaction {
            min-height: 25px;
            padding: 2px 7px;
            border: 1px solid #4f5158;
            border-radius: 7px;
            background: #2b2d31;
            color: #dbdee1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
        }

        .kr-reaction:hover {
            border-color: #5865f2;
            background: #35384a;
        }

        .kr-reaction.active {
            border-color: #5865f2;
            background: #3c4270;
        }

        /* =====================================================
           MESSAGE ACTIONS
        ===================================================== */

        .message-actions {
            position: absolute;
            right: 10px;
            top: -16px;
            display: none;
            align-items: center;
            gap: 2px;
            padding: 3px;
            border: 1px solid #1f2023;
            border-radius: 6px;
            background: #2b2d31;
            box-shadow: 0 4px 12px rgba(0,0,0,.3);
            z-index: 10;
        }

        .message:hover .message-actions {
            display: flex;
        }

        .message-action {
            width: 30px;
            height: 28px;
            border-radius: 4px;
            background: transparent;
            color: #b5bac1;
            cursor: pointer;
        }

        .message-action:hover {
            background: #404249;
            color: #fff;
        }

        /* =====================================================
           WELCOME
        ===================================================== */

        .welcome {
            padding: 18px 8px 20px;
        }

        .welcome-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .welcome-description {
            color: #949ba4;
            font-size: 14px;
        }

        /* =====================================================
           COMPOSER
        ===================================================== */

        .composer-wrap {
            padding: 0 16px 18px;
            flex-shrink: 0;
        }

        .attachment-preview {
            display: none;
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 8px;
            background: #2b2d31;
        }

        .attachment-preview.visible {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .attachment-preview img,
        .attachment-preview video {
            max-width: 100px;
            max-height: 70px;
            border-radius: 5px;
            object-fit: cover;
        }

        .attachment-name {
            flex: 1;
            min-width: 0;
            color: #dbdee1;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .attachment-remove {
            width: 28px;
            height: 28px;
            border-radius: 5px;
            background: transparent;
            color: #b5bac1;
            cursor: pointer;
        }

        .attachment-remove:hover {
            background: #404249;
            color: #fff;
        }

        .composer {
            min-height: 48px;
            border-radius: 8px;
            background: #383a40;
            display: flex;
            align-items: flex-end;
            padding: 8px;
            gap: 7px;
        }

        .composer-button {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 50%;
            background: transparent;
            color: #b5bac1;
            cursor: pointer;
            font-size: 18px;
        }

        .composer-button:hover {
            color: #fff;
            background: #404249;
        }

        .composer-input {
            flex: 1;
            min-width: 0;
            max-height: 160px;
            padding: 7px 4px;
            resize: none;
            border: 0;
            outline: 0;
            background: transparent;
            color: #dbdee1;
            line-height: 1.4;
        }

        .composer-input::placeholder {
            color: #949ba4;
        }

        .send-button {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border-radius: 7px;
            background: #5865f2;
            color: #fff;
            cursor: pointer;
            font-size: 17px;
        }

        .send-button:hover {
            background: #4752c4;
        }

        #fileInput {
            display: none;
        }

        /* =====================================================
           CALL PANEL
        ===================================================== */

        .call-panel {
            position: fixed;
            right: 20px;
            bottom: 85px;
            width: 360px;
            display: none;
            overflow: hidden;
            border: 1px solid #1f2023;
            border-radius: 10px;
            background: #18191c;
            box-shadow: 0 12px 40px rgba(0,0,0,.5);
            z-index: 100;
        }

        .call-panel.visible {
            display: block;
        }

        .call-panel-header {
            height: 42px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #232428;
            color: #dbdee1;
            font-size: 13px;
            font-weight: 600;
        }

        .call-close {
            width: 28px;
            height: 28px;
            border-radius: 5px;
            background: transparent;
            color: #b5bac1;
            cursor: pointer;
        }

        .call-close:hover {
            background: #404249;
            color: #fff;
        }

        .call-video {
            width: 100%;
            display: block;
            background: #000;
            aspect-ratio: 16 / 9;
            object-fit: contain;
        }

        .call-status {
            padding: 9px 12px;
            color: #949ba4;
            font-size: 12px;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {
            .channel-sidebar {
                width: 190px;
            }

            .server-sidebar {
                width: 60px;
            }

            .server-button {
                width: 42px;
                height: 42px;
            }
        }

        @media (max-width: 600px) {
            .server-sidebar {
                display: none;
            }

            .channel-sidebar {
                width: 64px;
            }

            .server-header {
                justify-content: center;
                padding: 0;
            }

            .server-header span {
                display: none;
            }

            .channel-category {
                display: none;
            }

            .channel {
                justify-content: center;
                padding: 0;
            }

            .channel span:not(.channel-icon) {
                display: none;
            }

            .voice-connection-dot {
                display: none !important;
            }

            .user-info {
                display: none;
            }

            .user-panel {
                justify-content: center;
            }

            .messages {
                padding-left: 8px;
                padding-right: 8px;
            }

            .message-actions {
                display: none !important;
            }

            .chat-header-topic {
                display: none;
            }

            .call-panel {
                left: 8px;
                right: 8px;
                bottom: 76px;
                width: auto;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="server-sidebar">

        <button
            class="server-button active"
            title="Krynet"
            type="button"
        >
            K
        </button>

        <div class="server-divider"></div>

        <button
            class="server-button"
            title="Community"
            type="button"
        >
            C
        </button>

        <button
            class="server-button"
            title="Add server"
            type="button"
        >
            +
        </button>

    </aside>


    <aside class="channel-sidebar">

        <div class="server-header">
            <span>Krynet Community</span>
            <span style="margin-left:auto">⌄</span>
        </div>

        <div class="channel-list">

            <div class="channel-category">
                Text Channels
            </div>

            <button
                class="channel active"
                data-channel="general"
                data-type="text"
                type="button"
            >
                <span class="channel-icon">#</span>
                <span>general</span>
            </button>

            <button
                class="channel"
                data-channel="community"
                data-type="text"
                type="button"
            >
                <span class="channel-icon">#</span>
                <span>community</span>
            </button>

            <button
                class="channel"
                data-channel="development"
                data-type="text"
                type="button"
            >
                <span class="channel-icon">#</span>
                <span>development</span>
            </button>

            <div class="channel-category">
                Voice Channels
            </div>

            <button
                class="channel voice"
                data-channel="Lounge"
                data-type="voice"
                type="button"
            >
                <span class="channel-icon">🔊</span>
                <span>Lounge</span>
                <span class="voice-connection-dot"></span>
            </button>

            <button
                class="channel voice"
                data-channel="Gaming"
                data-type="voice"
                type="button"
            >
                <span class="channel-icon">🔊</span>
                <span>Gaming</span>
                <span class="voice-connection-dot"></span>
            </button>

        </div>

        <div class="user-panel">

            <div class="avatar">B</div>

            <div class="user-info">
                <div class="username">Barney</div>

                <div
                    class="status-text"
                    id="userStatus"
                >
                    Online
                </div>
            </div>

            <button
                class="composer-button"
                title="Settings"
                type="button"
            >
                ⚙
            </button>

    </aside>

<!-- =========================================================
     MARKDOWN DEPENDENCIES

     We deliberately do NOT load:
         ./krynet-markdown.js

     That file is currently resolving to an HTML page on
     GitHub Pages, which is why Firefox reports:

         NS_ERROR_CORRUPTED_CONTENT
         MIME type text/html
========================================================= -->

<script type="module">

    import { marked } from
        "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js";

    import DOMPurify from
        "https://cdn.jsdelivr.net/npm/dompurify@3.2.6/+esm";

    import { Embed } from "./js/embed.js";
    import { Reactions } from "./js/reactions.js";
    import { KrySearch } from "./js/krysearch.js";


    "use strict";


    /* ========================================================
       MARKDOWN
    ======================================================== */

    const markdownOptions = {
        gfm: true,
        breaks: true
    };


    function renderMarkdown(
        element,
        markdown
    ) {
        if (!element) {
            return;
        }

        const source =
            String(markdown ?? "");

        if (!source.trim()) {
            element.replaceChildren();
            return;
        }

        try {
            const html =
                marked.parse(
                    source,
                    markdownOptions
                );

            const safeHTML =
                DOMPurify.sanitize(
                    html,
                    {
                        USE_PROFILES: {
                            html: true
                        }
                    }
                );

            element.innerHTML =
                safeHTML;

            element.classList.add(
                "kr-markdown"
            );

        } catch (error) {

            console.error(
                "[KrynetMarkdown] Render failed:",
                error
            );

            element.textContent =
                source;
        }
    }


    function renderExistingMarkdown() {

        document
            .querySelectorAll(
                ".message-text"
            )
            .forEach(element => {

                const source =
                    element.textContent || "";

                renderMarkdown(
                    element,
                    source
                );

            });
    }


    /*
     * Public API.
     *
     * This gives your existing Krynet code a compatible
     * global entry point without requiring the broken
     * GitHub Pages module.
     */

    window.KrynetMarkdown = {
        render: renderMarkdown,
        scan: renderExistingMarkdown
    };


    /* ========================================================
       KRYSEARCH
    ======================================================== */

    if (
        KrySearch &&
        typeof KrySearch.init === "function"
    ) {
        KrySearch.init();
    }


    /* ========================================================

    ======================================================== */

        document.getElementById("messageInput");

        document.getElementById("sendButton");

        document.getElementById("uploadButton");

        document.getElementById("attachmentPreview");

    /* ========================================================
       STATE
    ======================================================== */

    let selectedFile = null;
    let selectedFileContent = null;

    let webcamSession = null;
    let screenSession = null;

    let voiceChat = null;

    let currentVoiceChannel = null;
    let voiceJoined = false;
    let microphoneMuted = false;


    const VOICE_SERVER_URL =
        window.KRYNET_VOICE_SERVER_URL || "";

    const VOICE_SESSION_ID =
        window.KRYNET_VOICE_SESSION_ID || "";

    const VOICE_USER_ID =
        window.KRYNET_VOICE_USER_ID || "";

    const VOICE_SERVER_PUBLIC_KEY =
        window.KRYNET_VOICE_SERVER_PUBLIC_KEY || "";


    /* ========================================================
       HELPERS
    ======================================================== */

    function getTime() {
        return new Date().toLocaleTimeString(
            [],
            {
                hour: "numeric",
                minute: "2-digit"
            }
        );
    }


    function getInitial(name) {
        return (
            name.trim().charAt(0).toUpperCase() ||
            "?"
        );
    }


    function isURLOnly(text) {
        const value =
            text.trim();

        if (!value) {
            return false;
        }

        try {
            const url =
                new URL(value);

            return (
                url.protocol === "http:" ||
                url.protocol === "https:"
            );

        } catch {
            return false;
        }
    }


    function isYouTubeURL(value) {
        try {
            const url =
                new URL(value);

            const host =
                url.hostname
                    .toLowerCase()
                    .replace(/^www\./, "");

            return (
                host === "youtube.com" ||
                host === "youtu.be" ||
                host === "youtube-nocookie.com"
            );

        } catch {
            return false;
        }
    }


    function getYouTubeVideoId(value) {

        try {

            const url =
                new URL(value);

            const host =
                url.hostname
                    .toLowerCase()
                    .replace(/^www\./, "");

            if (host === "youtu.be") {
                return (
                    url.pathname
                        .split("/")
                        .filter(Boolean)[0] ||
                    null
                );
            }

            if (
                host === "youtube.com" ||
                host === "youtube-nocookie.com"
            ) {

                if (
                    url.pathname === "/watch"
                ) {
                    return url.searchParams.get("v");
                }

                if (
                    url.pathname.startsWith("/shorts/")
                ) {
                    return (
                        url.pathname
                            .split("/")
                            .filter(Boolean)[1] ||
                        null
                    );
                }

                if (
                    url.pathname.startsWith("/embed/")
                ) {
                    return (
                        url.pathname
                            .split("/")
                            .filter(Boolean)[1] ||
                        null
                    );
                }
            }

            return null;

        } catch {
            return null;
        }
    }


    function createYouTubeEmbed(url) {

        const videoId =
            getYouTubeVideoId(url);

        if (!videoId) {
            return null;
        }

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "youtube-embed";

        const bar =
            document.createElement("div");

        bar.className =
            "youtube-embed-bar";

        const body =
            document.createElement("div");

        body.className =
            "youtube-embed-body";

        const iframe =
            document.createElement("iframe");

        iframe.src =
            `https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}`;

        iframe.title =
            "YouTube video";

        iframe.loading =
            "lazy";

        iframe.allow =
            "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";

        iframe.allowFullscreen =
            true;

        body.appendChild(
            iframe
        );

        wrapper.append(
            bar,
            body
        );

        return wrapper;
    }


    function removeWelcome() {
        messages
            .querySelector(".welcome")
            ?.remove();
    }


    function isVoiceChannel(channel) {
        return (
            channel === "Lounge" ||
            channel === "Gaming"
        );
    }


    function getSelectedChannelType() {

        const active =
            document.querySelector(
                ".channel.active"
            );

        return (
            active?.dataset.type ||
            "text"
        );
    }


    /* ========================================================
       VOICE UI
    ======================================================== */

    function updateVoiceControls() {

        const type =
            getSelectedChannelType();

        const voiceChannel =
            type === "voice";

        callControls.classList.toggle(
            "voice-available",
            voiceChannel
        );

        callControls.classList.toggle(
            "in-vc",
            voiceJoined
        );

        if (voiceJoined) {

            channelIcon.textContent =
                "🔊";

            userStatus.textContent =
                `Connected to ${currentVoiceChannel}`;

            userStatus.classList.add(
                "in-vc"
            );

        } else {

            userStatus.textContent =
                "Online";

            userStatus.classList.remove(
                "in-vc"
            );
        }
    }


    function markVoiceChannelConnected(
        channel,
        connected
    ) {

        document
            .querySelectorAll(
                ".channel.voice"
            )
            .forEach(element => {

                element.classList.toggle(
                    "connected",
                    connected &&
                    element.dataset.channel === channel
                );

            });
    }


    /* ========================================================
       VOICE CHAT
    ======================================================== */

    async function createVoiceChat() {

        if (
            !VOICE_SERVER_URL ||
            !VOICE_SESSION_ID ||
            !VOICE_USER_ID ||
            !VOICE_SERVER_PUBLIC_KEY
        ) {
            throw new Error(
                "Voice chat configuration is missing"
            );
        }

        if (
            typeof window.VoiceChatApex !==
            "function"
        ) {
            throw new Error(
                "voicechat.js did not expose VoiceChatApex"
            );
        }

        const instance =
            new window.VoiceChatApex(
                VOICE_SERVER_URL,
                VOICE_SESSION_ID,
                VOICE_USER_ID,
                {
                    serverPublicKey:
                        VOICE_SERVER_PUBLIC_KEY
                }
            );

        await instance.init();

        return instance;
    }


    async function joinVoiceChannel(channel) {

        if (!isVoiceChannel(channel)) {
            return;
        }

        if (voiceJoined) {

            if (
                currentVoiceChannel === channel
            ) {
                return;
            }

            await leaveVoiceChannel();
        }

        showCallPanel(
            `🔊 ${channel}`,
            "Connecting to voice..."
        );

        joinVoiceButton.disabled =
            true;

        try {

            voiceChat =
                await createVoiceChat();

            currentVoiceChannel =
                channel;

            voiceJoined =
                true;

            microphoneMuted =
                false;

            muteButton.textContent =
                "🎤";

            muteButton.classList.remove(
                "active"
            );

            markVoiceChannelConnected(
                channel,
                true
            );

            updateVoiceControls();

            callTitle.textContent =
                `🔊 ${channel}`;

            callStatus.textContent =
                "Connected to voice";

        } catch (error) {

            console.error(
                "[Krynet] Voice connection failed:",
                error
            );

            try {
                await voiceChat?.stop();
            } catch {}

            voiceChat =
                null;

            currentVoiceChannel =
                null;

            voiceJoined =
                false;

            markVoiceChannelConnected(
                channel,
                false
            );

            updateVoiceControls();

            callStatus.textContent =
                error?.message ||
                "Could not connect to voice";

        } finally {

            joinVoiceButton.disabled =
                false;
        }
    }


    async function leaveVoiceChannel() {

        const previousChannel =
            currentVoiceChannel;

        voiceJoined =
            false;

        currentVoiceChannel =
            null;

        try {
            await voiceChat?.stop();
        } catch {}

        voiceChat =
            null;

        if (previousChannel) {

            markVoiceChannelConnected(
                previousChannel,
                false
            );
        }

        await stopWebcam();
        await stopScreenshare();

        microphoneMuted =
            false;

        muteButton.classList.remove(
            "active"
        );

        muteButton.textContent =
            "🎤";

        updateVoiceControls();
        hideCallPanel();
    }


    muteButton.addEventListener(
        "click",
        () => {

            if (!voiceJoined) {
                return;
            }

            microphoneMuted =
                !microphoneMuted;

            muteButton.classList.toggle(
                "active",
                microphoneMuted
            );

            muteButton.textContent =
                microphoneMuted
                    ? "🔇"
                    : "🎤";

            if (
                typeof voiceChat?.setMuted ===
                "function"
            ) {

                try {

                    voiceChat.setMuted(
                        microphoneMuted
                    );

                } catch (error) {

                    console.warn(
                        "[Krynet] Failed to update microphone:",
                        error
                    );
                }
            }
        }
    );


    joinVoiceButton.addEventListener(
        "click",
        async () => {

            const channel =
                channelName.textContent.trim();

            if (!isVoiceChannel(channel)) {
                return;
            }

            await joinVoiceChannel(channel);
        }
    );


    leaveVoiceButton.addEventListener(
        "click",
        async () => {
            await leaveVoiceChannel();
        }
    );


    /* ========================================================
       LOCAL FILE EMBED
    ======================================================== */

    function createLocalFileEmbed(
        file,
        content = null
    ) {

        const url =
            URL.createObjectURL(file);

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "kr-embed";

        if (
            file.type.startsWith("image/")
        ) {

            const image =
                document.createElement("img");

            image.src =
                url;

            image.alt =
                file.name;

            image.loading =
                "lazy";

            wrapper.appendChild(
                image
            );

            return wrapper;
        }

        if (
            file.type.startsWith("video/")
        ) {

            const video =
                document.createElement("video");

            video.src =
                url;

            video.controls =
                true;

            video.preload =
                "metadata";

            wrapper.appendChild(
                video
            );

            return wrapper;
        }

        if (
            file.type.startsWith("audio/")
        ) {

            const audio =
                document.createElement("audio");

            audio.src =
                url;

            audio.controls =
                true;

            audio.style.width =
                "100%";

            wrapper.appendChild(
                audio
            );

            return wrapper;
        }

        const card =
            document.createElement("div");

        card.className =
            "kr-file-card";

        const icon =
            document.createElement("span");

        icon.className =
            "kr-file-icon";

        icon.textContent =
            "📎";

        const name =
            document.createElement("span");

        name.className =
            "kr-file-name";

        name.textContent =
            file.name;

        card.append(
            icon,
            name
        );

        if (
            content !== null &&
            window.KrynetCopyFile
        ) {

            const copyFile = {
                name: file.name,
                type: file.type,
                size: file.size,
                content
            };

            const copyButton =
                window.KrynetCopyFile.createButton(
                    copyFile
                );

            if (copyButton) {
                card.appendChild(
                    copyButton
                );
            }
        }

        wrapper.appendChild(
            card
        );

        return wrapper;
    }


    /* ========================================================
       ADD MESSAGE
    ======================================================== */

    function addMessage({
        author = "Barney",
        text = "",
        file = null,
        fileContent = null
    }) {

        removeWelcome();

        const article =
            document.createElement("article");

        article.className =
            "message";

        article.dataset.messageId =
            crypto.randomUUID();

        const linkOnly =
            isURLOnly(text);

        if (linkOnly) {
            article.classList.add(
                "link-only"
            );
        }

        const avatar =
            document.createElement("div");

        avatar.className =
            "message-avatar";

        avatar.textContent =
            getInitial(author);

        const content =
            document.createElement("div");

        content.className =
            "message-content";

        const authorRow =
            document.createElement("div");

        authorRow.className =
            "message-author-row";

        const authorElement =
            document.createElement("span");

        authorElement.className =
            "message-author";

        authorElement.textContent =
            author;

        const time =
            document.createElement("span");

        time.className =
            "message-time";

        time.textContent =
            `Today at ${getTime()}`;

        authorRow.append(
            authorElement,
            time
        );

        const textElement =
            document.createElement("div");

        textElement.className =
            "message-text";

        /*
         * THIS is the important fix.
         *
         * Old:
         *
         *     textElement.textContent = text;
         *
         * New:
         *
         *     renderMarkdown(textElement, text);
         *
         * Markdown is now converted into real DOM.
         */

        renderMarkdown(
            textElement,
            text
        );

        content.append(
            authorRow,
            textElement
        );

        if (file) {

            content.appendChild(
                createLocalFileEmbed(
                    file,
                    fileContent
                )
            );
        }

        /*
         * Only hide the Markdown container for a message
         * containing nothing except a URL.
         */
        if (linkOnly) {

            if (isYouTubeURL(text)) {

                const youtube =
                    createYouTubeEmbed(
                        text.trim()
                    );

                if (youtube) {

                    content.appendChild(
                        youtube
                    );
                }

            } else {

                requestAnimationFrame(() => {

                    Embed.scanMessages(
                        `.message[data-message-id="${CSS.escape(article.dataset.messageId)}"]`
                    );

                });
            }
        }

        const reactions =
            document.createElement("div");

        reactions.className =
            "kr-message-reactions";

        content.appendChild(
            reactions
        );

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";

        const reactButton =
            document.createElement("button");

        reactButton.className =
            "message-action";

        reactButton.type =
            "button";

        reactButton.dataset.action =
            "react";

        reactButton.title =
            "Add Reaction";

        reactButton.textContent =
            "😊";

        const replyButton =
            document.createElement("button");

        replyButton.className =
            "message-action";

        replyButton.type =
            "button";

        replyButton.dataset.action =
            "reply";

        replyButton.title =
            "Reply";

        replyButton.textContent =
            "↩";

        actions.append(
            reactButton,
            replyButton
        );

        article.append(
            avatar,
            content,
            actions
        );

        messages.appendChild(
            article
        );

        new Reactions(
            reactions
        );

        messages.scrollTop =
            messages.scrollHeight;

        return article;
    }


    /* ========================================================
       SEND
    ======================================================== */

    async function sendMessage() {

        const text =
            messageInput.value.trim();

        if (
            !text &&
            !selectedFile
        ) {
            return;
        }

        let cleanedText =
            text;

        /*
         * Clean URLs BEFORE Markdown parsing.
         *
         * This prevents URL-cleaning from modifying
         * generated HTML.
         */

        if (
            window.ClearURLsCleanText &&
            text
        ) {

            cleanedText =
                window.ClearURLsCleanText(
                    text
                );
        }

        addMessage({
            author: "Barney",
            text: cleanedText,
            file: selectedFile,
            fileContent: selectedFileContent
        });

        messageInput.value =
            "";

        messageInput.style.height =
            "auto";

        clearAttachment();
    }


    /* ========================================================
       ATTACHMENTS
    ======================================================== */

    async function showAttachment(file) {

        selectedFile =
            file;

        selectedFileContent =
            null;

        attachmentPreview.classList.add(
            "visible"
        );

        attachmentName.textContent =
            file.name;

        attachmentContent.replaceChildren();

        if (
            window.KrynetCopyFile &&
            window.KrynetCopyFile.isTextFile(file) &&
            file.size <=
                window.KrynetCopyFile.MAX_COPY_SIZE
        ) {

            try {

                selectedFileContent =
                    await file.text();

            } catch (error) {

                console.warn(
                    "[KrynetCopyFile] Failed to read file:",
                    error
                );
            }
        }

        if (
            file.type.startsWith("image/")
        ) {

            const image =
                document.createElement("img");

            image.src =
                URL.createObjectURL(file);

            image.alt =
                file.name;

            attachmentContent.appendChild(
                image
            );

            return;
        }

        if (
            file.type.startsWith("video/")
        ) {

            const video =
                document.createElement("video");

            video.src =
                URL.createObjectURL(file);

            video.muted =
                true;

            attachmentContent.appendChild(
                video
            );
        }
    }


    function clearAttachment() {

        selectedFile =
            null;

        selectedFileContent =
            null;

        fileInput.value =
            "";

        attachmentContent.replaceChildren();

        attachmentName.textContent =
            "";

        attachmentPreview.classList.remove(
            "visible"
        );
    }


    /* ========================================================
       CALL PANEL
    ======================================================== */

    function showCallPanel(
        title,
        status
    ) {

        callTitle.textContent =
            title;

        callStatus.textContent =
            status;

        callPanel.classList.add(
            "visible"
        );
    }


    function hideCallPanel() {

        callPanel.classList.remove(
            "visible"
        );

        callVideo.pause();

        callVideo.srcObject =
            null;
    }


    /* ========================================================
       WEBCAM
    ======================================================== */

    async function stopWebcam() {

        if (!webcamSession) {
            return;
        }

        try {
            webcamSession.stop();
        } catch {}

        webcamSession =
            null;

        cameraButton.classList.remove(
            "active"
        );
    }


    async function startWebcam() {

        if (!voiceJoined) {
            return;
        }

        if (webcamSession) {

            await stopWebcam();

            if (!screenSession) {
                hideCallPanel();
            }

            return;
        }

        if (
            typeof window.startWebcamStream !==
            "function"
        ) {

            showCallPanel(
                "Camera",
                "webcam.js is not loaded"
            );

            return;
        }

        try {

            showCallPanel(
                `🔊 ${currentVoiceChannel}`,
                "Starting camera..."
            );

            webcamSession =
                await window.startWebcamStream();

            if (
                webcamSession?.stream
            ) {

                callVideo.srcObject =
                    webcamSession.stream;

                await callVideo
                    .play()
                    .catch(() => {});
            }

            cameraButton.classList.add(
                "active"
            );

            callStatus.textContent =
                "Camera active";

        } catch (error) {

            webcamSession =
                null;

            callStatus.textContent =
                error?.message ||
                "Could not start camera";

            console.error(
                "[Krynet] Camera failed:",
                error
            );
        }
    }


    cameraButton.addEventListener(
        "click",
        startWebcam
    );


    /* ========================================================
       SCREEN SHARE
    ======================================================== */

    async function stopScreenshare() {

        if (!screenSession) {
            return;
        }

        try {
            screenSession.stop();
        } catch {}

        screenSession =
            null;

        screenButton.classList.remove(
            "active"
        );
    }


    async function startScreenshare() {

        if (!voiceJoined) {
            return;
        }

        if (screenSession) {

            await stopScreenshare();

            if (!webcamSession) {
                hideCallPanel();
            }

            return;
        }

        if (
            typeof window.startMonitorAdaptiveScreenshare !==
            "function"
        ) {

            showCallPanel(
                "Screen Share",
                "screenshare.js is not loaded"
            );

            return;
        }

        const wsUrl =
            window.KRYNET_SCREEN_WS_URL ||
            "wss://localhost:8443/screenshare";

        const wtUrl =
            window.KRYNET_SCREEN_WT_URL ||
            "https://localhost:8443/screenshare";

        try {

            showCallPanel(
                `🔊 ${currentVoiceChannel}`,
                "Starting screen capture..."
            );

            screenSession =
                await window.startMonitorAdaptiveScreenshare(
                    wsUrl,
                    wtUrl,
                    {
                        captureAudio: true,
                        videoQuality: .82,
                        maxFPS: 60,
                        useSpatialAudio: false
                    }
                );

            if (
                screenSession?.stream
            ) {

                callVideo.srcObject =
                    screenSession.stream;

                await callVideo
                    .play()
                    .catch(() => {});
            }

            screenButton.classList.add(
                "active"
            );

            callStatus.textContent =
                "Screen sharing active";

        } catch (error) {

            screenSession =
                null;

            callStatus.textContent =
                error?.message ||
                "Could not start screen share";

            console.error(
                "[Krynet] Screen share failed:",
                error
            );
        }
    }


    screenButton.addEventListener(
        "click",
        startScreenshare
    );


    /* ========================================================
       CALL PANEL CLOSE
    ======================================================== */

    callClose.addEventListener(
        "click",
        async () => {

            if (voiceJoined) {

                await stopWebcam();
                await stopScreenshare();

                hideCallPanel();

                return;
            }

            hideCallPanel();
        }
    );


    /* ========================================================
       COMPOSER
    ======================================================== */

    sendButton.addEventListener(
        "click",
        () => {
            void sendMessage();
        }
    );


    uploadButton.addEventListener(
        "click",
        () => fileInput.click()
    );


    fileInput.addEventListener(
        "change",
        () => {

            const file =
                fileInput.files?.[0];

            if (!file) {
                return;
            }

            void showAttachment(file);
        }
    );


    removeAttachment.addEventListener(
        "click",
        clearAttachment
    );


    messageInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                void sendMessage();
            }
        }
    );


    messageInput.addEventListener(
        "input",
        () => {

            messageInput.style.height =
                "auto";

            messageInput.style.height =
                Math.min(
                    messageInput.scrollHeight,
                    160
                ) + "px";
        }
    );


    /* ========================================================
       CHANNEL SWITCHING
    ======================================================== */

    document
        .querySelectorAll(".channel")
        .forEach(channel => {

            channel.addEventListener(
                "click",
                async () => {

                    const name =
                        channel.dataset.channel ||
                        "general";

                    const type =
                        channel.dataset.type ||
                        "text";

                    if (
                        voiceJoined &&
                        (
                            type !== "voice" ||
                            name !== currentVoiceChannel
                        )
                    ) {

                        await leaveVoiceChannel();
                    }

                    document
                        .querySelectorAll(".channel")
                        .forEach(item => {

                            item.classList.remove(
                                "active"
                            );

                        });

                    channel.classList.add(
                        "active"
                    );

                    channelName.textContent =
                        name;

                    channelIcon.textContent =
                        type === "voice"
                            ? "🔊"
                            : "#";

                    messageInput.placeholder =
                        `Message #${name}`;

                    updateVoiceControls();
                }
            );
        });


    /* ========================================================
       INITIAL MARKDOWN
    ======================================================== */

    renderExistingMarkdown();


    /* ========================================================
       INITIAL EMBEDS
    ======================================================== */

    requestAnimationFrame(() => {

        Embed.scanMessages(
            ".message"
        );

        Reactions.scan(
            messages
        );

    });


    /* ========================================================
       MESSAGE OBSERVER
    ======================================================== */

    const messageObserver =
        new MutationObserver(
            mutations => {

                let shouldScan =
                    false;

                for (
                    const mutation of mutations
                ) {

                    for (
                        const node of mutation.addedNodes
                    ) {

                        if (
                            node instanceof Element &&
                            (
                                node.matches(".message") ||
                                node.querySelector?.(".message")
                            )
                        ) {

                            shouldScan =
                                true;
                        }
                    }
                }

                if (!shouldScan) {
                    return;
                }

                /*
                 * Messages created by addMessage() are
                 * already Markdown-rendered.
                 *
                 * This scan is only for messages that
                 * arrive from other code.
                 */

                document
                    .querySelectorAll(
                        ".message-text:not(.kr-markdown)"
                    )
                    .forEach(element => {

                        const source =
                            element.textContent || "";

                        renderMarkdown(
                            element,
                            source
                        );
                    });

                Embed.scanMessages(
                    ".message"
                );

                Reactions.scan(
                    messages
                );
            }
        );


    messageObserver.observe(
        messages,
        {
            childList: true,
            subtree: true
        }
    );


    /* ========================================================
       CLEANUP
    ======================================================== */

    window.addEventListener(
        "beforeunload",
        () => {

            try {
                voiceChat?.stop();
            } catch {}

            try {
                webcamSession?.stop();
            } catch {}

            try {
                screenSession?.stop();
            } catch {}
        }
    );


    /* ========================================================
       INITIAL STATE
    ======================================================== */

    updateVoiceControls();


    /* ========================================================
       MARKDOWN TEST MESSAGE
       
       Remove this block after confirming Markdown works.
    ======================================================== */

    addMessage({
        author: "Markdown",
        text:
`# Markdown works

This is **bold**, *italic*, ~~strikethrough~~ and \`inline code\`.

> This is a blockquote.

- One
- Two
- Three

[Open Krynet](https://example.com)

\`\`\`js
const krynet = "community";
console.log(krynet);
\`\`\`

| Feature | Status |
| --- | --- |
| Markdown | Working |
| Code | Working |
| Tables | Working |`
    });

</script>

</body>
</html>
