<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">

  <title>KrynetAI.free – Chat</title>

  <link
    rel="icon"
    href="favicon.ico"
    type="image/x-icon"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: #313338;
      color: #f2f3f5;
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* -------------------------------------------------------
       APP
    ------------------------------------------------------- */

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-ad {
      min-height: 0;
      background: #1e1f22;
      border-bottom: 1px solid #202225;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .main {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    /* -------------------------------------------------------
       SIDEBAR
    ------------------------------------------------------- */

    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: #2b2d31;
      border-right: 1px solid #1f2023;
      display: flex;
      flex-direction: column;
    }

    .server-header {
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      font-weight: 700;
      border-bottom: 1px solid #1f2023;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .2);
    }

    .server-header span {
      color: #ff4d4d;
    }

    .channel-list {
      padding: 12px 8px;
      overflow-y: auto;
    }

    .channel-category {
      padding: 8px 8px 5px;
      color: #949ba4;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .channel {
      width: 100%;
      padding: 7px 10px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #b5bac1;
      text-align: left;
      font-size: 14px;
    }

    .channel:hover {
      background: #35373c;
      color: #dbdee1;
    }

    .channel.active {
      background: #404249;
      color: #fff;
    }

    .channel-icon {
      color: #949ba4;
      margin-right: 5px;
    }

    /* -------------------------------------------------------
       CHAT
    ------------------------------------------------------- */

    .chat {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #313338;
    }

    .chat-header {
      height: 52px;
      flex-shrink: 0;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1f2023;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .2);
      font-weight: 600;
    }

    .chat-header .hash {
      color: #949ba4;
      font-size: 22px;
    }

    .chat-header-name {
      font-size: 15px;
    }

    .chat-messages {
      flex: 1;
      min-height: 0;
      padding: 16px 0;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    /* -------------------------------------------------------
       MESSAGE
    ------------------------------------------------------- */

    .message {
      position: relative;
      display: flex;
      gap: 12px;
      padding: 4px 16px;
      margin-top: 8px;
    }

    .message:hover {
      background: rgba(0, 0, 0, .04);
    }

    .message:hover .message-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .avatar {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      border-radius: 50%;
      object-fit: cover;
      background: #202225;
    }

    .message-main {
      min-width: 0;
      max-width: min(760px, calc(100% - 52px));
    }

    .message-meta {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-bottom: 2px;
      line-height: 20px;
    }

    .message-author {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }

    .message-time {
      color: #949ba4;
      font-size: 11px;
    }

    .message-content {
      color: #dbdee1;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* -------------------------------------------------------
       MESSAGE ACTIONS
    ------------------------------------------------------- */

    .message-actions {
      position: absolute;
      right: 18px;
      top: -16px;
      z-index: 10;

      display: flex;
      align-items: center;

      opacity: 0;
      pointer-events: none;

      background: #313338;
      border: 1px solid #1f2023;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .35);

      overflow: hidden;
    }

    .message-action {
      width: 34px;
      height: 32px;
      border: 0;
      background: transparent;
      color: #b5bac1;
      font-size: 17px;
    }

    .message-action:hover {
      background: #404249;
      color: #fff;
    }

    /* -------------------------------------------------------
       REACTIONS
    ------------------------------------------------------- */

    .message-reactions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    /*
     * reactions.js can also populate these containers.
     * These defaults make them look correct even before JS
     * adds anything.
     */

    .kr-reactions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .kr-reaction {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 24px;
      padding: 2px 7px;

      border: 1px solid #4e5058;
      border-radius: 5px;

      background: #2b2d31;
      color: #dbdee1;

      font-size: 13px;
      cursor: pointer;
    }

    .kr-reaction:hover {
      border-color: #5865f2;
      background: #35373c;
    }

    .kr-reaction.active {
      border-color: #5865f2;
      background: rgba(88, 101, 242, .2);
    }

    .kr-reaction-count {
      color: #b5bac1;
      font-size: 12px;
    }

    .kr-add-reaction {
      width: 27px;
      height: 24px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #4e5058;
      border-radius: 5px;

      background: #2b2d31;
      color: #b5bac1;

      font-size: 15px;
      cursor: pointer;
    }

    .kr-add-reaction:hover {
      background: #35373c;
      color: #fff;
      border-color: #5865f2;
    }

    /* -------------------------------------------------------
       EMBEDS
    ------------------------------------------------------- */

    .kr-embed {
      width: 100%;
      max-width: 480px;
      margin-top: 8px;
    }

    .kr-embed a {
      transition: opacity .15s ease;
    }

    .kr-embed a:hover {
      opacity: .85;
    }

    .kr-embed iframe {
      display: block;
    }

    .kr-embed-reactions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .kr-embed-placeholder {
      min-height: 8px;
    }

    /* -------------------------------------------------------
       ATTACHMENTS
    ------------------------------------------------------- */

    .attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .attachment {
      display: flex;
      align-items: center;
      gap: 8px;

      max-width: 360px;
      padding: 8px 10px;

      background: #2b2d31;
      border: 1px solid #1f2023;
      border-radius: 6px;
    }

    .attachment-icon {
      font-size: 22px;
    }

    .attachment-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      color: #00a8fc;
      font-size: 13px;
    }

    .attachment-size {
      color: #949ba4;
      font-size: 11px;
    }

    /* -------------------------------------------------------
       USER LIST
    ------------------------------------------------------- */

    .user-list {
      width: 220px;
      flex-shrink: 0;
      padding: 18px 12px;
      background: #2b2d31;
      overflow-y: auto;
    }

    .user-list-title {
      padding: 0 8px 10px;
      color: #949ba4;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 8px;
      border-radius: 4px;
      color: #b5bac1;
      font-size: 13px;
    }

    .user:hover {
      background: #35373c;
    }

    .user .avatar {
      width: 32px;
      height: 32px;
      flex-basis: 32px;
    }

    .user-status {
      position: relative;
    }

    .status-dot {
      position: absolute;
      right: -1px;
      bottom: -1px;

      width: 10px;
      height: 10px;

      border: 2px solid #2b2d31;
      border-radius: 50%;
      background: #23a559;
    }

    .status-dot.idle {
      background: #f0b232;
    }

    /* -------------------------------------------------------
       COMPOSER
    ------------------------------------------------------- */

    .composer-area {
      flex-shrink: 0;
      padding: 0 16px 18px;
      background: #313338;
    }

    .selected-files {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 0 8px;
    }

    .selected-files.has-files {
      display: flex;
    }

    .selected-file {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 6px 9px;

      border-radius: 6px;
      background: #2b2d31;
      border: 1px solid #1f2023;

      font-size: 12px;
      color: #dbdee1;
    }

    .remove-file {
      width: 20px;
      height: 20px;
      padding: 0;

      border: 0;
      border-radius: 50%;

      background: transparent;
      color: #949ba4;
    }

    .remove-file:hover {
      color: #fff;
      background: #404249;
    }

    .composer {
      min-height: 44px;
      display: flex;
      align-items: flex-end;
      gap: 8px;

      padding: 8px 10px;

      background: #383a40;
      border-radius: 8px;
    }

    .composer-button {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;

      padding: 0;

      border: 0;
      border-radius: 50%;

      background: transparent;
      color: #b5bac1;

      font-size: 20px;
    }

    .composer-button:hover {
      color: #fff;
      background: #404249;
    }

    #chatInput {
      flex: 1;
      min-width: 0;

      min-height: 28px;
      max-height: 160px;

      padding: 4px 2px;

      border: 0;
      outline: 0;

      background: transparent;
      color: #dbdee1;

      resize: none;
      line-height: 20px;
    }

    #chatInput::placeholder {
      color: #949ba4;
    }

    #sendBtn {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;

      border: 0;
      border-radius: 6px;

      background: #5865f2;
      color: #fff;

      font-size: 16px;
    }

    #sendBtn:hover {
      background: #4752c4;
    }

    #sendBtn:disabled {
      opacity: .5;
      cursor: default;
    }

    #fileInput {
      display: none;
    }

    /* -------------------------------------------------------
       MOBILE
    ------------------------------------------------------- */

    @media (max-width: 900px) {
      .user-list {
        display: none;
      }
    }

    @media (max-width: 650px) {
      .sidebar {
        width: 68px;
      }

      .server-header {
        justify-content: center;
        padding: 0;
      }

      .server-header .server-name,
      .channel-category,
      .channel-name {
        display: none;
      }

      .channel {
        text-align: center;
        padding: 10px 0;
      }

      .channel-icon {
        margin: 0;
        font-size: 18px;
      }

      .message {
        padding-left: 10px;
        padding-right: 10px;
      }

      .composer-area {
        padding-left: 8px;
        padding-right: 8px;
      }
    }
  </style>
</head>

<script type="module">

  import {
    Embed
  } from "./js/embed.js";

  /*
   * Reactions is intentionally loaded separately.
   * embed.js also imports it for embed reactions.
   */
  import {
    Reactions
  } from "./js/reactions.js";


  /* -------------------------------------------------------
     ELEMENTS
  ------------------------------------------------------- */

  const input =
    document.getElementById(
      "chatInput"
    );

  const sendButton =
    document.getElementById(
      "sendBtn"
    );

  const chat =
    document.getElementById(
      "chatMessages"
    );

  const fileInput =
    document.getElementById(
      "fileInput"
    );

  const attachButton =
    document.getElementById(
      "attachButton"
    );

  const selectedFiles =
    document.getElementById(
      "selectedFiles"
    );


  /* -------------------------------------------------------
     STATE
  ------------------------------------------------------- */

  let messageCount = 0;

  let pendingFiles = [];


  /* -------------------------------------------------------
     TIME
  ------------------------------------------------------- */

  function getMessageTime() {
    return new Date()
      .toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );
  }


  /* -------------------------------------------------------
     MESSAGE REACTIONS
  ------------------------------------------------------- */

  function initializeMessageReactions(
    message
  ) {
    const container =
      message.querySelector(
        ".message-reactions"
      );

    if (!container) {
      return;
    }

    /*
     * Don't initialize the same container twice.
     */
    if (
      container.dataset.reactionsInitialized ===
      "true"
    ) {
      return;
    }

    container.dataset.reactionsInitialized =
      "true";

    try {
      new Reactions(
        container
      );
    } catch (error) {
      console.warn(
        "[Krynet] Could not initialize reactions:",
        error
      );
    }
  }


  /* -------------------------------------------------------
     MESSAGE ACTIONS
  ------------------------------------------------------- */

  function initializeMessageActions(
    message
  ) {
    const button =
      message.querySelector(
        ".add-message-reaction"
      );

    if (!button) {
      return;
    }

    if (
      button.dataset.initialized ===
      "true"
    ) {
      return;
    }

    button.dataset.initialized =
      "true";

    button.addEventListener(
      "click",
      event => {
        event.preventDefault();
        event.stopPropagation();

        initializeMessageReactions(
          message
        );

        /*
         * Ask reactions.js for its add UI
         * if the implementation exposes one.
         */
        const reactionAddButton =
          message.querySelector(
            ".kr-add-reaction"
          );

        if (reactionAddButton) {
          reactionAddButton.click();
        }
      }
    );
  }


  /* -------------------------------------------------------
     MESSAGE SETUP
  ------------------------------------------------------- */

  function initializeMessage(
    message
  ) {
    if (
      !(message instanceof HTMLElement)
    ) {
      return;
    }

    initializeMessageReactions(
      message
    );

    initializeMessageActions(
      message
    );
  }


  /* -------------------------------------------------------
     FILE SIZE
  ------------------------------------------------------- */

  function formatFileSize(
    bytes
  ) {
    if (bytes < 1024) {
      return `${bytes} B`;
    }

    if (bytes < 1024 * 1024) {
      return `${(
        bytes / 1024
      ).toFixed(1)} KB`;
    }

    if (bytes < 1024 * 1024 * 1024) {
      return `${(
        bytes /
        1024 /
        1024
      ).toFixed(1)} MB`;
    }

    return `${(
      bytes /
      1024 /
      1024 /
      1024
    ).toFixed(1)} GB`;
  }


  /* -------------------------------------------------------
     FILE PREVIEW LIST
  ------------------------------------------------------- */

  function renderSelectedFiles() {
    selectedFiles.replaceChildren();

    if (!pendingFiles.length) {
      selectedFiles.classList.remove(
        "has-files"
      );

      return;
    }

    selectedFiles.classList.add(
      "has-files"
    );

    pendingFiles.forEach(
      (file, index) => {
        const item =
          document.createElement(
            "div"
          );

        item.className =
          "selected-file";

        const icon =
          document.createElement(
            "span"
          );

        icon.textContent =
          file.type.startsWith("image/")
            ? "🖼️"
            : file.type.startsWith("video/")
              ? "🎬"
              : file.type.startsWith("audio/")
                ? "🎵"
                : "📎";

        const name =
          document.createElement(
            "span"
          );

        name.textContent =
          `${file.name} (${formatFileSize(file.size)})`;

        const remove =
          document.createElement(
            "button"
          );

        remove.className =
          "remove-file";

        remove.type =
          "button";

        remove.textContent =
          "×";

        remove.title =
          "Remove file";

        remove.addEventListener(
          "click",
          () => {
            pendingFiles.splice(
              index,
              1
            );

            renderSelectedFiles();
          }
        );

        item.append(
          icon,
          name,
          remove
        );

        selectedFiles.appendChild(
          item
        );
      }
    );
  }


  /* -------------------------------------------------------
     FILE INPUT
  ------------------------------------------------------- */

  attachButton.addEventListener(
    "click",
    () => {
      fileInput.click();
    }
  );

  fileInput.addEventListener(
    "change",
    () => {
      pendingFiles =
        Array.from(
          fileInput.files || []
        );

      renderSelectedFiles();
    }
  );


  /* -------------------------------------------------------
     CLEAR FILE INPUT
  ------------------------------------------------------- */

  function clearFiles() {
    pendingFiles = [];

    fileInput.value = "";

    renderSelectedFiles();
  }


  /* -------------------------------------------------------
     CREATE ATTACHMENTS
  ------------------------------------------------------- */

  function createAttachments(
    files
  ) {
    if (!files.length) {
      return null;
    }

    const wrapper =
      document.createElement(
        "div"
      );

    wrapper.className =
      "attachments";

    files.forEach(
      file => {
        const attachment =
          document.createElement(
            "div"
          );

        attachment.className =
          "attachment";

        const icon =
          document.createElement(
            "div"
          );

        icon.className =
          "attachment-icon";

        icon.textContent =
          file.type.startsWith("image/")
            ? "🖼️"
            : file.type.startsWith("video/")
              ? "🎬"
              : file.type.startsWith("audio/")
                ? "🎵"
                : "📎";

        const details =
          document.createElement(
            "div"
          );

        const name =
          document.createElement(
            "div"
          );

        name.className =
          "attachment-name";

        name.textContent =
          file.name;

        const size =
          document.createElement(
            "div"
          );

        size.className =
          "attachment-size";

        size.textContent =
          formatFileSize(
            file.size
          );

        details.append(
          name,
          size
        );

        attachment.append(
          icon,
          details
        );

        wrapper.appendChild(
          attachment
        );
      }
    );

    return wrapper;
  }


  /* -------------------------------------------------------
     CREATE MESSAGE
  ------------------------------------------------------- */

  function createMessage(
    text,
    files
  ) {
    const message =
      document.createElement(
        "article"
      );

    message.className =
      "message";

    message.dataset.messageId =
      `message-${Date.now()}-${messageCount}`;

    const avatar =
      document.createElement(
        "img"
      );

    avatar.className =
      "avatar";

    avatar.src =
      "https://cdn.krynet.com/avatars/default2.png";

    avatar.alt =
      "You";


    const main =
      document.createElement(
        "div"
      );

    main.className =
      "message-main";


    const meta =
      document.createElement(
        "div"
      );

    meta.className =
      "message-meta";


    const author =
      document.createElement(
        "span"
      );

    author.className =
      "message-author";

    author.textContent =
      "You";


    const time =
      document.createElement(
        "span"
      );

    time.className =
      "message-time";

    time.textContent =
      `Today at ${getMessageTime()}`;


    meta.append(
      author,
      time
    );


    const content =
      document.createElement(
        "div"
      );

    content.className =
      "message-content";

    content.textContent =
      text;


    const reactions =
      document.createElement(
        "div"
      );

    reactions.className =
      "message-reactions";


    main.append(
      meta,
      content
    );


    if (files.length) {
      const attachments =
        createAttachments(
          files
        );

      if (attachments) {
        main.appendChild(
          attachments
        );
      }
    }


    main.appendChild(
      reactions
    );


    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "message-actions";


    const reactionButton =
      document.createElement(
        "button"
      );

    reactionButton.type =
      "button";

    reactionButton.className =
      "message-action add-message-reaction";

    reactionButton.title =
      "Add Reaction";

    reactionButton.textContent =
      "😊";


    actions.appendChild(
      reactionButton
    );


    message.append(
      avatar,
      main,
      actions
    );


    return message;
  }


  /* -------------------------------------------------------
     SEND
  ------------------------------------------------------- */

  function sendMessage() {
    const text =
      input.value.trim();

    if (
      !text &&
      !pendingFiles.length
    ) {
      return;
    }

    const files =
      [...pendingFiles];

    const message =
      createMessage(
        text,
        files
      );

    chat.appendChild(
      message
    );

    messageCount++;

    initializeMessage(
      message
    );

    /*
     * Scan this new message for URLs.
     *
     * This is what makes:
     *
     * https://youtube.com/watch?v=...
     *
     * turn into an actual embed.
     */
    Embed.scanMessages(
      `.message[data-message-id="${message.dataset.messageId}"]`
    );

    input.value = "";

    clearFiles();

    input.style.height =
      "auto";

    chat.scrollTop =
      chat.scrollHeight;
  }


  /* -------------------------------------------------------
     SEND BUTTON
  ------------------------------------------------------- */

  sendButton.addEventListener(
    "click",
    sendMessage
  );


  /* -------------------------------------------------------
     KEYBOARD
  ------------------------------------------------------- */

  input.addEventListener(
    "keydown",
    event => {

      /*
       * Enter sends.
       *
       * Shift+Enter creates a newline.
       */
      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();

        sendMessage();
      }
    }
  );


  /* -------------------------------------------------------
     AUTO RESIZE TEXTAREA
  ------------------------------------------------------- */

  input.addEventListener(
    "input",
    () => {
      input.style.height =
        "auto";

      input.style.height =
        `${Math.min(
          input.scrollHeight,
          160
        )}px`;
    }
  );


  /* -------------------------------------------------------
     EXISTING MESSAGES
  ------------------------------------------------------- */

  chat
    .querySelectorAll(
      ".message"
    )
    .forEach(
      message => {
        initializeMessage(
          message
        );
      }
    );


  /* -------------------------------------------------------
     EMBED OBSERVER
  ------------------------------------------------------- */

  /*
   * Watch the chat for messages generated
   * by anything other than this script.
   */
  Embed.observeMessages(
    ".message"
  );


  console.log(
    "[Krynet] Chat initialized."
  );

</script>

</body>
</html>
