<html lang="en">
<head>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Google AdSense -->
  <script
    async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3940256099942544"
    crossorigin="anonymous">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Inter, system-ui, sans-serif;
      background: #0a0a0a;
      color: #fff;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       Layout
       ========================= */

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .ad-banner {
      min-height: 52px;
      padding: 6px 12px;
      background: #111;
      border-bottom: 1px solid #292929;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-content {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    /* =========================
       Sidebar
       ========================= */

    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: #151515;
      border-right: 1px solid #292929;
      display: flex;
      flex-direction: column;
      padding: 14px 10px;
    }

    .brand {
      padding: 10px 12px 18px;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .brand span {
      color: #ff4d4d;
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
    }

    .channel {
      padding: 9px 12px;
      margin-bottom: 3px;
      border-radius: 7px;
      color: #bbb;
      cursor: pointer;
    }

    .channel:hover,
    .channel.active {
      background: #262626;
      color: #fff;
    }

    /* =========================
       Chat
       ========================= */

    .chat-container {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      height: 58px;
      flex-shrink: 0;
      padding: 0 18px;
      display: flex;
      align-items: center;
      background: #151515;
      border-bottom: 1px solid #292929;
      font-weight: 600;
    }

    .chat-main {
      min-height: 0;
      flex: 1;
      display: flex;
    }

    .chat-messages {
      min-width: 0;
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* =========================
       Messages
       ========================= */

    .message {
      max-width: min(760px, 80%);
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .message.self {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
      background: #222;
    }

    .message-body {
      min-width: 0;
    }

    .message-meta {
      margin-bottom: 5px;
      color: #888;
      font-size: .75rem;
    }

    .message-content {
      padding: 9px 12px;
      border-radius: 9px;
      background: #191919;
      word-break: break-word;
    }

    .message.self .message-content {
      background: #3b0909;
    }

    /* =========================
       Media
       ========================= */

    .message-media {
      display: block;
      max-width: min(600px, 100%);
      max-height: 500px;
      margin-top: 7px;
      border-radius: 10px;
      object-fit: contain;
      background: #080808;
    }

    .message-media.audio {
      width: min(500px, 100%);
    }

    .message-file {
      margin-top: 7px;
      padding: 12px;
      min-width: 220px;
      max-width: 420px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #333;
      border-radius: 9px;
      background: #111;
    }

    .file-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #252525;
      font-size: 18px;
    }

    .file-info {
      min-width: 0;
    }

    .file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-size {
      margin-top: 3px;
      color: #777;
      font-size: .75rem;
    }

    /* =========================
       Users
       ========================= */

    .user-list {
      width: 210px;
      flex-shrink: 0;
      padding: 15px 12px;
      overflow-y: auto;
      background: #151515;
      border-left: 1px solid #292929;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: .9rem;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #43b581;
    }

    /* =========================
       Upload preview
       ========================= */

    .upload-preview {
      display: none;
      padding: 10px 14px;
      background: #111;
      border-top: 1px solid #292929;
    }

    .upload-preview.visible {
      display: block;
    }

    .preview-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 800px;
    }

    .preview-thumb {
      width: 58px;
      height: 58px;
      border-radius: 8px;
      object-fit: cover;
      background: #222;
    }

    .preview-info {
      min-width: 0;
      flex: 1;
    }

    .preview-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-type {
      color: #777;
      font-size: .75rem;
      margin-top: 3px;
    }

    .remove-upload {
      border: 0;
      background: transparent;
      color: #aaa;
      font-size: 20px;
    }

    .remove-upload:hover {
      color: #fff;
    }

    /* =========================
       Input
       ========================= */

    .chat-input {
      position: relative;
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #151515;
      border-top: 1px solid #292929;
    }

    .chat-input input[type="text"] {
      min-width: 0;
      flex: 1;
      padding: 11px 13px;
      border: 1px solid #333;
      outline: none;
      border-radius: 9px;
      background: #252525;
      color: #fff;
    }

    .chat-input input[type="text"]:focus {
      border-color: #555;
    }

    .input-button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 9px;
      background: #252525;
      color: #fff;
    }

    .input-button:hover {
      background: #333;
    }

    .send-button {
      padding: 0 18px;
      border: 0;
      border-radius: 9px;
      background: #ff4d4d;
      color: #fff;
      font-weight: 600;
    }

    .send-button:hover {
      background: #d93636;
    }

    .drop-zone {
      position: absolute;
      inset: 5px;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      border: 2px dashed #ff4d4d;
      border-radius: 10px;
      background: rgba(30, 0, 0, .94);
      font-weight: 600;
    }

    .chat-input.dragging .drop-zone {
      display: flex;
    }

    /* =========================
       File embedder
       ========================= */

    .embed-panel {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, .75);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .embed-panel.open {
      display: flex;
    }

    .embed-card {
      width: min(700px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      border: 1px solid #333;
      border-radius: 14px;
      background: #111;
    }

    .embed-card h2 {
      margin-top: 0;
    }

    .embed-file-input {
      width: 100%;
      margin: 15px 0;
    }

    .embed-actions {
      display: flex;
      gap: 8px;
    }

    .embed-actions button {
      padding: 9px 16px;
      border: 0;
      border-radius: 8px;
      background: #292929;
      color: #fff;
    }

    .embed-actions .primary {
      background: #ff4d4d;
    }

    .embed-status {
      margin-top: 12px;
      min-height: 20px;
      color: #aaa;
    }

    .embed-status.error {
      color: #ff6b6b;
    }

    .embed-preview {
      margin-top: 20px;
    }

    .embed-preview img,
    .embed-preview video,
    .embed-preview audio {
      display: block;
      max-width: 100%;
      max-height: 500px;
      margin: 12px auto;
      border-radius: 10px;
    }

    .embed-filename {
      color: #aaa;
      word-break: break-word;
      text-align: center;
    }

    /* =========================
       Mobile
       ========================= */

    @media (max-width: 800px) {
      .sidebar {
        display: none;
      }

      .user-list {
        display: none;
      }

      .message {
        max-width: 92%;
      }
    }
  </style>
</head>

     CHAT / UPLOAD LOGIC

<script>
'use strict';

/* =========================================================
   Elements
   ========================================================= */

const input =
  document.getElementById('chatInput');

const sendButton =
  document.getElementById('sendBtn');

const chat =
  document.getElementById('chatMessages');

const fileInput =
  document.getElementById('fileInput');

const attachButton =
  document.getElementById('attachButton');

const chatInputArea =
  document.getElementById('chatInputArea');

const uploadPreview =
  document.getElementById('uploadPreview');

const previewThumb =
  document.getElementById('previewThumb');

const previewName =
  document.getElementById('previewName');

const previewType =
  document.getElementById('previewType');

const removeUpload =
  document.getElementById('removeUpload');

const embedButton =
  document.getElementById('embedButton');

const embedPanel =
  document.getElementById('embedPanel');

const embedFileInput =
  document.getElementById('embedFileInput');

const embedFileButton =
  document.getElementById('embedFileButton');

const closeEmbedButton =
  document.getElementById('closeEmbedButton');

const embedStatus =
  document.getElementById('embedStatus');

const embedPreview =
  document.getElementById('embedPreview');


/* =========================================================
   State
   ========================================================= */

let selectedFile = null;
let selectedFileURL = null;
let embedObjectURL = null;
let messageCount = 0;


/* =========================================================
   Helpers
   ========================================================= */

function formatFileSize(bytes) {
  if (bytes < 1024) {
    return `${bytes} B`;
  }

  if (bytes < 1024 * 1024) {
    return `${(bytes / 1024).toFixed(1)} KB`;
  }

  if (bytes < 1024 * 1024 * 1024) {
    return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
  }

  return `${(bytes / 1024 / 1024 / 1024).toFixed(1)} GB`;
}


function getExtension(filename) {
  const parts =
    filename.toLowerCase().split('.');

  return parts.length > 1
    ? parts.pop()
    : '';
}


function getFileIcon(file) {
  if (file.type.startsWith('image/')) {
    return '🖼️';
  }

  if (file.type.startsWith('video/')) {
    return '🎥';
  }

  if (file.type.startsWith('audio/')) {
    return '🎵';
  }

  return '📄';
}


/* =========================================================
   Upload selection
   ========================================================= */

function selectFile(file) {
  if (!file) {
    return;
  }

  clearSelectedFile();

  selectedFile = file;
  selectedFileURL =
    URL.createObjectURL(file);

  uploadPreview.classList.add('visible');

  previewName.textContent =
    file.name;

  previewType.textContent =
    `${file.type || 'Unknown file'} • ${formatFileSize(file.size)}`;

  if (
    file.type.startsWith('image/')
  ) {
    previewThumb.src =
      selectedFileURL;

    previewThumb.style.display =
      'block';

    return;
  }

  previewThumb.removeAttribute('src');

  previewThumb.style.display =
    'none';
}


function clearSelectedFile() {
  selectedFile = null;

  if (selectedFileURL) {
    URL.revokeObjectURL(selectedFileURL);
    selectedFileURL = null;
  }

  uploadPreview.classList.remove(
    'visible'
  );

  previewThumb.removeAttribute('src');
}


attachButton.addEventListener(
  'click',
  () => fileInput.click()
);


fileInput.addEventListener(
  'change',
  () => {
    const file =
      fileInput.files?.[0];

    if (file) {
      selectFile(file);
    }
  }
);


removeUpload.addEventListener(
  'click',
  () => {
    clearSelectedFile();
    fileInput.value = '';
  }
);


/* =========================================================
   Drag & drop
   ========================================================= */

chatInputArea.addEventListener(
  'dragover',
  event => {
    event.preventDefault();

    chatInputArea.classList.add(
      'dragging'
    );
  }
);


chatInputArea.addEventListener(
  'dragleave',
  event => {
    if (
      event.target === chatInputArea
    ) {
      chatInputArea.classList.remove(
        'dragging'
      );
    }
  }
);


chatInputArea.addEventListener(
  'drop',
  event => {
    event.preventDefault();

    chatInputArea.classList.remove(
      'dragging'
    );

    const file =
      event.dataTransfer?.files?.[0];

    if (file) {
      selectFile(file);
    }
  }
);


/* =========================================================
   Paste images
   ========================================================= */

document.addEventListener(
  'paste',
  event => {
    const items =
      event.clipboardData?.items;

    if (!items) {
      return;
    }

    for (const item of items) {
      if (!item.type.startsWith('image/')) {
        continue;
      }

      const file =
        item.getAsFile();

      if (!file) {
        continue;
      }

      selectFile(file);
      break;
    }
  }
);


/* =========================================================
   Create media content
   ========================================================= */

function appendFileContent(
  parent,
  file
) {
  const url =
    URL.createObjectURL(file);

  if (file.type.startsWith('image/')) {

    const image =
      document.createElement('img');

    image.className =
      'message-media';

    image.src = url;
    image.alt = file.name;

    image.onload = () => {
      URL.revokeObjectURL(url);
    };

    image.onerror = () => {
      URL.revokeObjectURL(url);
      image.remove();
    };

    parent.appendChild(image);

    return;
  }


  if (file.type.startsWith('video/')) {

    const video =
      document.createElement('video');

    video.className =
      'message-media';

    video.controls = true;
    video.preload = 'metadata';
    video.src = url;

    video.onloadeddata = () => {
      /*
       * Keep the object URL alive while
       * the video exists.
       */
    };

    parent.appendChild(video);

    return;
  }


  if (file.type.startsWith('audio/')) {

    const audio =
      document.createElement('audio');

    audio.className =
      'message-media audio';

    audio.controls = true;
    audio.preload = 'metadata';
    audio.src = url;

    parent.appendChild(audio);

    return;
  }


  const fileCard =
    document.createElement('div');

  fileCard.className =
    'message-file';

  const icon =
    document.createElement('div');

  icon.className =
    'file-icon';

  icon.textContent =
    getFileIcon(file);

  const info =
    document.createElement('div');

  info.className =
    'file-info';

  const name =
    document.createElement('div');

  name.className =
    'file-name';

  name.textContent =
    file.name;

  const size =
    document.createElement('div');

  size.className =
    'file-size';

  size.textContent =
    formatFileSize(file.size);

  info.appendChild(name);
  info.appendChild(size);

  fileCard.appendChild(icon);
  fileCard.appendChild(info);

  parent.appendChild(fileCard);
}


/* =========================================================
   Send message
   ========================================================= */

function sendMessage() {

  const text =
    input.value.trim();

  if (!text && !selectedFile) {
    return;
  }

  const message =
    document.createElement('div');

  message.className =
    'message self';


  const avatar =
    document.createElement('img');

  avatar.className =
    'avatar';

  avatar.src =
    'https://cdn.krynet.com/avatars/default2.png';

  avatar.alt =
    'You';


  const body =
    document.createElement('div');

  body.className =
    'message-body';


  const meta =
    document.createElement('div');

  meta.className =
    'message-meta';

  const name =
    document.createElement('strong');

  name.textContent =
    'You';

  meta.appendChild(name);

  meta.appendChild(
    document.createTextNode(
      ' • ' +
      new Date().toLocaleTimeString(
        [],
        {
          hour: '2-digit',
          minute: '2-digit'
        }
      )
    )
  );


  body.appendChild(meta);


  if (text) {

    const bubble =
      document.createElement('div');

    bubble.className =
      'message-content';

    bubble.textContent =
      text;

    body.appendChild(bubble);
  }


  if (selectedFile) {

    appendFileContent(
      body,
      selectedFile
    );
  }


  message.appendChild(avatar);
  message.appendChild(body);

  chat.appendChild(message);

  messageCount++;


  /* Ad every 5 messages */

  if (messageCount % 5 === 0) {

    const adContainer =
      document.createElement('div');

    adContainer.className =
      'message';

    adContainer.innerHTML = `
      <div class="message-content">
        <ins
          class="adsbygoogle"
          style="display:block;width:100%"
          data-ad-client="ca-pub-3940256099942544"
          data-ad-slot="6300978111"
          data-ad-format="auto"
          data-full-width-responsive="true">
        </ins>
      </div>
    `;

    chat.appendChild(adContainer);

    try {
      (adsbygoogle =
        window.adsbygoogle || []).push({});
    } catch {
      // AdSense may not be available.
    }
  }


  input.value = '';

  clearSelectedFile();

  fileInput.value = '';

  chat.scrollTop =
    chat.scrollHeight;
}


sendButton.addEventListener(
  'click',
  sendMessage
);


input.addEventListener(
  'keydown',
  event => {
    if (
      event.key === 'Enter' &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }
  }
);


/* =========================================================
   File embedder
   ========================================================= */

function setEmbedStatus(
  text,
  error = false
) {
  embedStatus.textContent =
    text;

  embedStatus.classList.toggle(
    'error',
    error
  );
}


function cleanupEmbed() {

  embedPreview.replaceChildren();

  if (embedObjectURL) {
    URL.revokeObjectURL(
      embedObjectURL
    );

    embedObjectURL = null;
  }
}


function createEmbedMedia(file) {

  cleanupEmbed();

  const extension =
    getExtension(file.name);

  embedObjectURL =
    URL.createObjectURL(file);


  /*
   * Images
   */

  if (
    file.type.startsWith('image/') ||
    [
      'avif',
      'heif',
      'heic'
    ].includes(extension)
  ) {

    const image =
      document.createElement('img');

    image.alt =
      file.name;

    image.src =
      embedObjectURL;

    image.onload = () => {
      setEmbedStatus(
        'Image loaded successfully.'
      );
    };

    image.onerror = () => {
      setEmbedStatus(
        'This browser cannot decode this image format.',
        true
      );
    };

    embedPreview.appendChild(image);

    return;
  }


  /*
   * Audio
   */

  if (
    file.type.startsWith('audio/') ||
    [
      'aac',
      'm4a'
    ].includes(extension)
  ) {

    const audio =
      document.createElement('audio');

    audio.controls = true;
    audio.preload = 'metadata';
    audio.src =
      embedObjectURL;

    audio.onloadedmetadata = () => {
      setEmbedStatus(
        'Audio loaded successfully.'
      );
    };

    audio.onerror = () => {
      setEmbedStatus(
        'This browser cannot decode this audio file.',
        true
      );
    };

    embedPreview.appendChild(audio);

    return;
  }


  /*
   * Video
   */

  if (
    file.type.startsWith('video/') ||
    [
      'mp4',
      'webm'
    ].includes(extension)
  ) {

    const video =
      document.createElement('video');

    video.controls = true;
    video.preload = 'metadata';
    video.src =
      embedObjectURL;

    video.onloadedmetadata = () => {
      setEmbedStatus(
        'Video loaded successfully.'
      );
    };

    video.onerror = () => {
      setEmbedStatus(
        'This browser cannot decode this video.',
        true
      );
    };

    embedPreview.appendChild(video);

    return;
  }


  setEmbedStatus(
    'Unsupported file format.',
    true
  );
}


embedButton.addEventListener(
  'click',
  () => {
    embedPanel.classList.add(
      'open'
    );
  }
);


closeEmbedButton.addEventListener(
  'click',
  () => {
    embedPanel.classList.remove(
      'open'
    );

    cleanupEmbed();
  }
);


embedPanel.addEventListener(
  'click',
  event => {
    if (
      event.target === embedPanel
    ) {
      embedPanel.classList.remove(
        'open'
      );

      cleanupEmbed();
    }
  }
);


embedFileInput.addEventListener(
  'change',
  () => {

    const file =
      embedFileInput.files?.[0];

    if (!file) {
      return;
    }

    const filename =
      document.createElement('div');

    filename.className =
      'embed-filename';

    filename.textContent =
      file.name;

    embedPreview.replaceChildren(
      filename
    );

    setEmbedStatus(
      'Loading...'
    );

    createEmbedMedia(file);
  }
);


embedFileButton.addEventListener(
  'click',
  () => {

    const file =
      embedFileInput.files?.[0];

    if (!file) {
      setEmbedStatus(
        'Select a file first.',
        true
      );

      return;
    }

    createEmbedMedia(file);
  }
);


/* =========================================================
   Channel switching
   ========================================================= */

document
  .querySelectorAll('.channel')
  .forEach(channel => {

    channel.addEventListener(
      'click',
      () => {

        document
          .querySelectorAll('.channel')
          .forEach(item => {
            item.classList.remove(
              'active'
            );
          });

        channel.classList.add(
          'active'
        );

        const header =
          document.querySelector(
            '.chat-header'
          );

        header.textContent =
          channel.textContent.trim();
      }
    );
  });


/* =========================================================
   Initial state
   ========================================================= */

console.log(
  '[Krynet] Chat UI initialized'
);

</script>
