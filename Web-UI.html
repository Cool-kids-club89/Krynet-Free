<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">

  <title>KrynetAI.free – Chat UI</title>

  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <script
    async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3940256099942544"
    crossorigin="anonymous"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: #0a0a0a;
      color: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    /* ---------------------------------------------------------
       AD
    --------------------------------------------------------- */

    .ad-banner {
      min-height: 52px;
      background: #111;
      border-bottom: 1px solid #400000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      flex-shrink: 0;
    }

    /* ---------------------------------------------------------
       MAIN LAYOUT
    --------------------------------------------------------- */

    .main-content {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ---------------------------------------------------------
       SIDEBAR
    --------------------------------------------------------- */

    .sidebar {
      width: 240px;
      background: #1a0000;
      border-right: 1px solid #400000;
      display: flex;
      flex-direction: column;
      padding: 1rem 0;
      flex-shrink: 0;
    }

    .sidebar-title {
      padding: 0 1.25rem 1rem;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
    }

    .channel {
      padding: 0.6rem 1.25rem;
      border-radius: 5px;
      cursor: pointer;
      color: #fff;
      font-size: 0.95rem;
    }

    .channel:hover {
      background: #330000;
    }

    .channel.active {
      background: #400000;
    }

    /* ---------------------------------------------------------
       CHAT
    --------------------------------------------------------- */

    .chat-container {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 1rem;
      background: #1a0000;
      border-bottom: 1px solid #400000;
      font-size: 1rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .chat-main {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .chat-messages {
      flex: 1;
      min-width: 0;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* ---------------------------------------------------------
       MESSAGES
    --------------------------------------------------------- */

    .message {
      display: flex;
      gap: 0.6rem;
      max-width: min(760px, 85%);
      align-items: flex-start;
    }

    .message.self {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-content {
      background: #1a1a1a;
      padding: 0.6rem 0.9rem;
      border-radius: 0.6rem;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .message.self .message-content {
      background: #330000;
    }

    .message-meta {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 0.25rem;
    }

    .message-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    /* ---------------------------------------------------------
       FILE EMBEDS
    --------------------------------------------------------- */

    .file-embed {
      margin-top: 8px;
      padding: 10px;
      border-radius: 8px;
      background: #242424;
      border: 1px solid #3a3a3a;
      max-width: 500px;
    }

    .file-embed-name {
      font-size: 13px;
      color: #ddd;
      overflow-wrap: anywhere;
      margin-bottom: 8px;
    }

    .file-embed img,
    .file-embed video {
      display: block;
      width: 100%;
      max-width: 460px;
      max-height: 500px;
      object-fit: contain;
      border-radius: 7px;
    }

    .file-embed audio {
      width: 100%;
    }

    .file-download {
      display: inline-block;
      margin-top: 8px;
      color: #ff6b6b;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .file-download:hover {
      text-decoration: underline;
    }

    /* ---------------------------------------------------------
       USERS
    --------------------------------------------------------- */

    .user-list {
      width: 200px;
      background: #1a0000;
      border-left: 1px solid #400000;
      padding: 1rem 0.75rem;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #43b581;
      flex-shrink: 0;
    }

    .status-away {
      background: #faa61a;
    }

    /* ---------------------------------------------------------
       INPUT
    --------------------------------------------------------- */

    .chat-input {
      display: flex;
      gap: 8px;
      padding: 1rem;
      border-top: 1px solid #400000;
      background: #1a0000;
      flex-shrink: 0;
    }

    .chat-input input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 0.7rem 0.8rem;
      border: none;
      border-radius: 0.5rem;
      background: #333;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .chat-input input[type="text"]:focus {
      box-shadow: 0 0 0 1px #ff4d4d;
    }

    .chat-button {
      background: #ff4d4d;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      color: white;
      cursor: pointer;
      white-space: nowrap;
    }

    .chat-button:hover {
      background: #cc0000;
    }

    .upload-button {
      width: 42px;
      padding: 0;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #fileInput {
      display: none;
    }

    /* ---------------------------------------------------------
       DROP ZONE
    --------------------------------------------------------- */

    body.dragging-files::after {
      content: "Drop files to upload";
      position: fixed;
      inset: 15px;
      border: 2px dashed #ff4d4d;
      border-radius: 14px;
      background: rgba(40, 0, 0, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-size: 22px;
      font-weight: 700;
      pointer-events: none;
    }

    /* ---------------------------------------------------------
       RESPONSIVE
    --------------------------------------------------------- */

    @media (max-width: 800px) {
      .sidebar {
        width: 180px;
      }

      .user-list {
        display: none;
      }

      .message {
        max-width: 90%;
      }
    }

    @media (max-width: 600px) {
      .sidebar {
        display: none;
      }

      .chat-input {
        padding: 0.7rem;
      }

      .chat-button {
        padding-left: 0.8rem;
        padding-right: 0.8rem;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       ADS
  ========================================================== -->

  <div class="ad-banner">
    <ins
      class="adsbygoogle"
      style="display:block"
      data-ad-client="ca-pub-3940256099942544"
      data-ad-slot="6300978111"
      data-ad-format="auto"
      data-full-width-responsive="true"
    ></ins>

    <script>
      window.adsbygoogle = window.adsbygoogle || [];
      window.adsbygoogle.push({});
    </script>
  </div>


  <!-- =========================================================
       APP
  ========================================================== -->

  <div class="main-content">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-title">
        KrynetAI.free
      </div>

      <div class="channel-list">

        <div class="channel active">
          # general
        </div>

        <div class="channel">
          # support
        </div>

        <div class="channel">
          # random
        </div>

      </div>

    </aside>


    <!-- CHAT -->

    <section class="chat-container">

      <header class="chat-header">
        # general
      </header>


      <div class="chat-main">

        <main
          class="chat-messages"
          id="chatMessages"
        >

          <!-- Initial message -->

          <div
            class="message other"
            data-message
          >

            <img
              class="avatar"
              src="https://cdn.krynet.com/avatars/default1.png"
              alt="UserA"
            >

            <div>

              <div class="message-meta">
                <strong>UserA</strong>
                • 12:34 PM
              </div>

              <div class="message-content">

                <div class="message-text">
                  Welcome to KrynetAI.free
                </div>

              </div>

            </div>

          </div>

        </main>


        <!-- USERS -->

        <aside class="user-list">

          <div class="user">

            <div class="status-dot"></div>

            <img
              class="avatar"
              src="https://cdn.krynet.com/avatars/default1.png"
              alt="UserA"
            >

            <span>UserA</span>

          </div>


          <div class="user">

            <div class="status-dot status-away"></div>

            <img
              class="avatar"
              src="https://cdn.krynet.com/avatars/default2.png"
              alt="UserB"
            >

            <span>UserB</span>

          </div>

        </aside>

      </div>


      <!-- INPUT -->

      <div class="chat-input">

        <input
          id="fileInput"
          type="file"
          multiple
        >

        <button
          id="uploadBtn"
          class="chat-button upload-button"
          type="button"
          title="Upload files"
          aria-label="Upload files"
        >
          +
        </button>

        <input
          type="text"
          id="chatInput"
          placeholder="Type your message..."
          autocomplete="off"
        >

        <button
          id="sendBtn"
          class="chat-button"
          type="button"
        >
          Send
        </button>

      </div>

    </section>

  </div>

  <!-- =========================================================
       EMBED SYSTEM
       
       embed.js imports:
       
         import { Reactions } from "./reactions.js";
       
       so it must live at ./js/embed.js.
  ========================================================== -->

  <script
    type="module"
    src="./js/embed.js"
  ></script>


  <!-- =========================================================
       CHAT APP
  ========================================================== -->

  <script type="module">

    import { Embed } from "./js/embed.js";


    /* ---------------------------------------------------------
       ELEMENTS
    --------------------------------------------------------- */

    const input =
      document.getElementById("chatInput");

    const button =
      document.getElementById("sendBtn");

    const uploadButton =
      document.getElementById("uploadBtn");

    const fileInput =
      document.getElementById("fileInput");

    const chat =
      document.getElementById("chatMessages");


    /* ---------------------------------------------------------
       STATE
    --------------------------------------------------------- */

    let msgCount = 0;


    /* ---------------------------------------------------------
       HELPERS
    --------------------------------------------------------- */

    function getTime() {
      return new Date().toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );
    }


    function scrollChat() {
      chat.scrollTop =
        chat.scrollHeight;
    }


    function createMessage({
      text = "",
      self = false
    } = {}) {

      const container =
        document.createElement("div");

      container.className =
        self
          ? "message self"
          : "message other";

      container.dataset.message = "";


      const avatar =
        document.createElement("img");

      avatar.className =
        "avatar";

      avatar.src =
        self
          ? "https://cdn.krynet.com/avatars/default2.png"
          : "https://cdn.krynet.com/avatars/default1.png";

      avatar.alt =
        self
          ? "You"
          : "User";


      const info =
        document.createElement("div");


      const meta =
        document.createElement("div");

      meta.className =
        "message-meta";

      const name =
        document.createElement("strong");

      name.textContent =
        self
          ? "You"
          : "User";


      meta.append(
        name,
        document.createTextNode(
          ` • ${getTime()}`
        )
      );


      const content =
        document.createElement("div");

      content.className =
        "message-content";


      if (text) {

        const textElement =
          document.createElement("div");

        textElement.className =
          "message-text";

        textElement.textContent =
          text;

        content.appendChild(
          textElement
        );

      }


      info.append(
        meta,
        content
      );

      container.append(
        avatar,
        info
      );


      return {
        container,
        content
      };
    }


    /* ---------------------------------------------------------
       NORMAL MESSAGE
    --------------------------------------------------------- */

    function sendMessage() {

      const text =
        input.value.trim();

      if (!text) {
        return;
      }


      const {
        container
      } = createMessage({
        text,
        self: true
      });


      chat.appendChild(
        container
      );


      /*
       * This is the important part.
       *
       * embed.js scans the message text for URLs and
       * inserts the embed directly into this message.
       */

      Embed.scanMessages(
        "[data-message]"
      );


      msgCount++;


      /*
       * Ad every 5 messages.
       */

      if (
        msgCount % 5 === 0
      ) {

        addMessageAd();

      }


      input.value = "";

      scrollChat();
    }


    /* ---------------------------------------------------------
       MESSAGE AD
    --------------------------------------------------------- */

    function addMessageAd() {

      const container =
        document.createElement("div");

      container.className =
        "message";

      container.innerHTML = `
        <div style="width:100%;">
          <ins
            class="adsbygoogle"
            style="display:block;width:100%;"
            data-ad-client="ca-pub-3940256099942544"
            data-ad-slot="6300978111"
            data-ad-format="auto"
            data-full-width-responsive="true"
          ></ins>
        </div>
      `;


      chat.appendChild(
        container
      );


      try {

        window.adsbygoogle =
          window.adsbygoogle || [];

        window.adsbygoogle.push({});

      } catch {
        /* AdSense unavailable. */
      }
    }


    /* ---------------------------------------------------------
       FILE MESSAGE
    --------------------------------------------------------- */

    function addFileMessage(file) {

      if (!file) {
        return;
      }


      const {
        container,
        content
      } = createMessage({
        self: true
      });


      const fileEmbed =
        document.createElement("div");

      fileEmbed.className =
        "file-embed";


      const filename =
        document.createElement("div");

      filename.className =
        "file-embed-name";

      filename.textContent =
        file.name;


      fileEmbed.appendChild(
        filename
      );


      const objectURL =
        URL.createObjectURL(file);


      const type =
        file.type.toLowerCase();


      /*
       * IMAGE
       */

      if (
        type.startsWith("image/")
      ) {

        const image =
          document.createElement("img");

        image.src =
          objectURL;

        image.alt =
          file.name;

        image.loading =
          "lazy";


        image.addEventListener(
          "load",
          () => {
            URL.revokeObjectURL(
              objectURL
            );
          },
          {
            once: true
          }
        );


        image.addEventListener(
          "error",
          () => {
            URL.revokeObjectURL(
              objectURL
            );
          },
          {
            once: true
          }
        );


        fileEmbed.appendChild(
          image
        );

      }


      /*
       * VIDEO
       */

      else if (
        type.startsWith("video/")
      ) {

        const video =
          document.createElement("video");

        video.src =
          objectURL;

        video.controls =
          true;

        video.preload =
          "metadata";


        fileEmbed.appendChild(
          video
        );

      }


      /*
       * AUDIO
       */

      else if (
        type.startsWith("audio/")
      ) {

        const audio =
          document.createElement("audio");

        audio.src =
          objectURL;

        audio.controls =
          true;

        audio.preload =
          "metadata";


        fileEmbed.appendChild(
          audio
        );

      }


      /*
       * GENERIC FILE
       */

      else {

        const download =
          document.createElement("a");

        download.className =
          "file-download";

        download.href =
          objectURL;

        download.download =
          file.name;

        download.target =
          "_blank";

        download.rel =
          "noopener noreferrer";

        download.textContent =
          "Open / download file";


        fileEmbed.appendChild(
          download
        );

      }


      content.appendChild(
        fileEmbed
      );


      chat.appendChild(
        container
      );


      /*
       * Scan this message too.
       *
       * This means if the message also contains
       * a URL in the filename/text later, embed.js
       * can process it.
       */

      Embed.scanMessages(
        "[data-message]"
      );


      scrollChat();
    }


    /* ---------------------------------------------------------
       MULTIPLE FILES
    --------------------------------------------------------- */

    function handleFiles(files) {

      for (
        const file of files
      ) {

        addFileMessage(file);

      }

    }


    /* ---------------------------------------------------------
       UPLOAD BUTTON
    --------------------------------------------------------- */

    uploadButton.addEventListener(
      "click",
      () => {

        fileInput.click();

      }
    );


    fileInput.addEventListener(
      "change",
      () => {

        handleFiles(
          Array.from(
            fileInput.files || []
          )
        );


        fileInput.value =
          "";

      }
    );


    /* ---------------------------------------------------------
       SEND
    --------------------------------------------------------- */

    button.addEventListener(
      "click",
      sendMessage
    );


    input.addEventListener(
      "keydown",
      event => {

        if (
          event.key !== "Enter"
        ) {
          return;
        }

        if (
          event.shiftKey
        ) {
          return;
        }

        event.preventDefault();

        sendMessage();

      }
    );


    /* ---------------------------------------------------------
       PASTE IMAGE
    --------------------------------------------------------- */

    input.addEventListener(
      "paste",
      event => {

        const items =
          event.clipboardData?.items;

        if (!items) {
          return;
        }


        const files = [];


        for (
          const item of items
        ) {

          if (
            !item.type.startsWith(
              "image/"
            )
          ) {
            continue;
          }


          const file =
            item.getAsFile();

          if (file) {
            files.push(file);
          }

        }


        if (files.length) {

          event.preventDefault();

          handleFiles(files);

        }

      }
    );


    /* ---------------------------------------------------------
       DRAG + DROP
    --------------------------------------------------------- */

    let dragCounter = 0;


    document.addEventListener(
      "dragenter",
      event => {

        if (
          !event.dataTransfer?.types.includes(
            "Files"
          )
        ) {
          return;
        }

        event.preventDefault();

        dragCounter++;

        document.body.classList.add(
          "dragging-files"
        );

      }
    );


    document.addEventListener(
      "dragover",
      event => {

        if (
          event.dataTransfer?.types.includes(
            "Files"
          )
        ) {
          event.preventDefault();
        }

      }
    );


    document.addEventListener(
      "dragleave",
      event => {

        event.preventDefault();

        dragCounter--;

        if (
          dragCounter <= 0
        ) {

          dragCounter = 0;

          document.body.classList.remove(
            "dragging-files"
          );

        }

      }
    );


    document.addEventListener(
      "drop",
      event => {

        event.preventDefault();

        dragCounter = 0;

        document.body.classList.remove(
          "dragging-files"
        );


        const files =
          Array.from(
            event.dataTransfer?.files || []
          );


        if (!files.length) {
          return;
        }


        handleFiles(files);

      }
    );


    /* ---------------------------------------------------------
       INITIAL EMBEDS
    --------------------------------------------------------- */

    Embed.scanMessages(
      "[data-message]"
    );


    console.log(
      "[Krynet] Chat initialized"
    );

  </script>
