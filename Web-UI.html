<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">

  <title>KrynetAI.free – Chat UI</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <script
    async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3940256099942544"
    crossorigin="anonymous"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: #0a0a0a;
      color: #fff;
      display: flex;
      height: 100vh;
      flex-direction: column;
    }

    button,
    input {
      font-family: inherit;
    }

    .main-content {
      display: flex;
      flex-grow: 1;
      min-height: 0;
    }

    /* ================================
       SIDEBAR
       ================================ */

    .sidebar {
      width: 240px;
      background: #1a0000;
      border-right: 1px solid #400000;
      display: flex;
      flex-direction: column;
      padding: 1rem 0;
      flex-shrink: 0;
    }

    .channel-list {
      flex-grow: 1;
      overflow-y: auto;
    }

    .channel {
      padding: 0.5rem 1.25rem;
      border-radius: 5px;
      cursor: pointer;
      color: #fff;
      font-size: 0.95rem;
    }

    .channel:hover {
      background: #330000;
    }

    /* ================================
       CHAT
       ================================ */

    .chat-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      padding: 1rem;
      background: #1a0000;
      border-bottom: 1px solid #400000;
      font-size: 1rem;
      font-weight: 600;
    }

    .chat-main {
      display: flex;
      flex-grow: 1;
      min-height: 0;
    }

    .chat-messages {
      flex-grow: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-width: 0;
    }

    .message {
      display: flex;
      gap: 0.6rem;
      max-width: 70%;
      align-items: flex-start;
    }

    .message.self {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-content {
      background: #1a1a1a;
      padding: 0.6rem 0.9rem;
      border-radius: 0.6rem;
      word-break: break-word;
    }

    .message.self .message-content {
      background: #330000;
    }

    .message-meta {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 0.25rem;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    /* ================================
       USER LIST
       ================================ */

    .user-list {
      width: 200px;
      background: #1a0000;
      border-left: 1px solid #400000;
      padding: 1rem 0.75rem;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #43b581;
      flex-shrink: 0;
    }

    /* ================================
       INPUT
       ================================ */

    .chat-input {
      display: flex;
      padding: 1rem;
      border-top: 1px solid #400000;
      background: #1a0000;
    }

    .chat-input input {
      flex-grow: 1;
      padding: 0.6rem;
      border: none;
      border-radius: 0.5rem;
      background: #333;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .chat-input input:focus {
      box-shadow: 0 0 0 2px #660000;
    }

    .chat-input button,
    .embed-button {
      margin-left: 1rem;
      background: #ff4d4d;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      color: white;
      cursor: pointer;
    }

    .chat-input button:hover,
    .embed-button:hover {
      background: #cc0000;
    }

    /* ================================
       ADS
       ================================ */

    .ad-banner {
      background: #111;
      text-align: center;
      padding: 0.5rem;
      font-size: 0.9rem;
      border-bottom: 1px solid #400000;
    }

    /* ================================
       FILE EMBEDDER
       ================================ */

    .file-embed-panel {
      display: none;
      padding: 1rem;
      background: #120000;
      border-top: 1px solid #400000;
      border-bottom: 1px solid #400000;
    }

    .file-embed-panel.open {
      display: block;
    }

    .file-embed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .file-embed-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .file-close {
      background: transparent;
      border: 0;
      color: #aaa;
      cursor: pointer;
      font-size: 1.2rem;
    }

    .file-close:hover {
      color: #fff;
    }

    .file-embed-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .file-input {
      max-width: 100%;
      color: #ddd;
    }

    .file-status {
      margin-top: 0.75rem;
      min-height: 1.4em;
      font-size: 0.85rem;
      color: #aaa;
    }

    .file-status.error {
      color: #ff6b6b;
    }

    .file-preview {
      margin-top: 1rem;
      text-align: center;
    }

    .file-preview img,
    .file-preview audio,
    .file-preview video {
      display: block;
      max-width: 100%;
      margin: 15px auto;
      border-radius: 10px;
    }

    .file-preview video {
      max-height: 500px;
      background: #000;
    }

    .file-preview audio {
      width: min(100%, 600px);
    }

    .file-filename {
      opacity: 0.7;
      word-break: break-word;
      font-size: 0.85rem;
    }

    .attach-button {
      background: #333 !important;
      margin-left: 0 !important;
    }

    .attach-button:hover {
      background: #444 !important;
    }

    /* ================================
       MOBILE
       ================================ */

    @media (max-width: 800px) {
      .sidebar {
        width: 180px;
      }

      .user-list {
        display: none;
      }

      .message {
        max-width: 90%;
      }
    }

    @media (max-width: 600px) {
      .sidebar {
        display: none;
      }

      .file-embed-controls {
        flex-direction: column;
        align-items: stretch;
      }

      .embed-button {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>

  <!-- ================================
       AD BANNER
       ================================ -->

  <div class="ad-banner">
    <ins
      class="adsbygoogle"
      style="display:block"
      data-ad-client="ca-pub-3940256099942544"
      data-ad-slot="6300978111"
      data-ad-format="auto"
      data-full-width-responsive="true"
    ></ins>

    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>


  <!-- ================================
       MAIN APP
       ================================ -->

  <div class="main-content">

    <!-- ================================
         SIDEBAR
         ================================ -->

    <div class="sidebar">
      <div class="channel-list">

        <div class="channel">
          # general
        </div>

        <div class="channel">
          # support
        </div>

        <div class="channel">
          # random
        </div>

      </div>
    </div>


    <!-- ================================
         CHAT
         ================================ -->

    <div class="chat-container">

      <div class="chat-header">
        # general
      </div>


      <div class="chat-main">

        <div
          class="chat-messages"
          id="chatMessages"
        >

          <div class="message other">

            <img
              class="avatar"
              src="https://cdn.krynet.com/avatars/default1.png"
              alt="User"
            >

            <div>

              <div class="message-meta">
                <strong>UserA</strong>
                • 12:34 PM
              </div>

              <div class="message-content">
                Welcome to KrynetAI.free
              </div>

            </div>

          </div>

        </div>


        <!-- ================================
             USERS
             ================================ -->

        <div class="user-list">

          <div class="user">

            <div class="status-dot"></div>

            <img
              class="avatar"
              src="https://cdn.krynet.com/avatars/default1.png"
              alt="UserA"
            >

            <span>UserA</span>

          </div>


          <div class="user">

            <div
              class="status-dot"
              style="background-color:#faa61a;"
            ></div>

            <img
              class="avatar"
              src="https://cdn.krynet.com/avatars/default2.png"
              alt="UserB"
            >

            <span>UserB</span>

          </div>

        </div>

      </div>


      <!-- ================================
           FILE EMBEDDER
           ================================ -->

      <section
        id="fileEmbedPanel"
        class="file-embed-panel"
      >

        <div class="file-embed-header">

          <div class="file-embed-title">
            Krynet File Embed
          </div>

          <button
            type="button"
            id="fileCloseButton"
            class="file-close"
            aria-label="Close file embedder"
          >
            ×
          </button>

        </div>


        <div class="file-embed-controls">

          <input
            id="fileInput"
            class="file-input"
            type="file"
            accept=".avif,.heif,.heic,.aac,.m4a,.mp4"
          >

          <button
            type="button"
            id="embedButton"
            class="embed-button"
          >
            Embed File
          </button>

        </div>


        <div
          id="fileStatus"
          class="file-status"
          role="status"
          aria-live="polite"
        ></div>


        <div
          id="filePreview"
          class="file-preview"
        ></div>

      </section>


      <!-- ================================
           CHAT INPUT
           ================================ -->

      <div class="chat-input">

        <button
          type="button"
          id="attachBtn"
          class="attach-button"
          title="Embed a file"
          aria-label="Embed a file"
        >
          📎
        </button>

        <input
          type="text"
          id="chatInput"
          placeholder="Type your message..."
          autocomplete="off"
        >

        <button
          type="button"
          id="sendBtn"
        >
          Send
        </button>

      </div>

    </div>

  </div>


  <!-- =========================================================
       KRYNET JAVASCRIPT
       ========================================================= -->

  <script src="./js/Cloudflare.js"></script>
  <script src="./js/anonymous-upload.js"></script>
  <script src="./js/blurNSFW.js"></script>
  <script src="./js/clearURLS.js"></script>
  <script src="./js/copyFileContents.js"></script>
  <script src="./js/country-blocker.js"></script>
  <script src="./js/dearrow.js"></script>
  <script src="./js/embed.js"></script>
  <script src="./js/krysearch.js"></script>
  <script src="./js/markdownRenderer.js"></script>
  <script src="./js/openInApp.js"></script>
  <script src="./js/reactions.js"></script>
  <script src="./js/screenshare.js"></script>
  <script src="./js/sponsorblock.js"></script>
  <script src="./js/tpm.js"></script>
  <script src="./js/voicechat.js"></script>
  <script src="./js/webcam.js"></script>
  <script src="./js/youtubeAdblock.js"></script>


  <!-- =========================================================
       CHAT + FILE EMBED LOGIC
       ========================================================= -->

  <script>
    "use strict";

    /* ================================
       CHAT
       ================================ */

    const input =
      document.getElementById("chatInput");

    const button =
      document.getElementById("sendBtn");

    const chat =
      document.getElementById("chatMessages");

    let msgCount = 0;


    function sendMessage() {
      const msg =
        input.value.trim();

      if (!msg) {
        return;
      }


      const container =
        document.createElement("div");

      container.classList.add(
        "message",
        "self"
      );


      const avatar =
        document.createElement("img");

      avatar.className =
        "avatar";

      avatar.src =
        "https://cdn.krynet.com/avatars/default2.png";

      avatar.alt =
        "You";


      const infoWrap =
        document.createElement("div");


      const meta =
        document.createElement("div");

      meta.className =
        "message-meta";

      const strong =
        document.createElement("strong");

      strong.textContent =
        "You";

      meta.appendChild(strong);

      meta.appendChild(
        document.createTextNode(
          " • " +
          new Date().toLocaleTimeString(
            [],
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )
        )
      );


      const bubble =
        document.createElement("div");

      bubble.className =
        "message-content";

      bubble.textContent =
        msg;


      infoWrap.appendChild(meta);
      infoWrap.appendChild(bubble);

      container.appendChild(avatar);
      container.appendChild(infoWrap);

      chat.appendChild(container);


      msgCount++;


      if (msgCount % 5 === 0) {

        const adContainer =
          document.createElement("div");

        adContainer.classList.add(
          "message"
        );

        adContainer.innerHTML = `
          <ins
            class="adsbygoogle"
            style="display:block;width:100%;"
            data-ad-client="ca-pub-3940256099942544"
            data-ad-slot="6300978111"
            data-ad-format="auto"
            data-full-width-responsive="true"
          ></ins>
        `;

        chat.appendChild(
          adContainer
        );

        (
          window.adsbygoogle =
            window.adsbygoogle || []
        ).push({});
      }


      input.value = "";

      chat.scrollTop =
        chat.scrollHeight;
    }


    button.addEventListener(
      "click",
      sendMessage
    );


    input.addEventListener(
      "keypress",
      event => {
        if (event.key === "Enter") {
          sendMessage();
        }
      }
    );


    /* ================================
       FILE EMBEDDER
       ================================ */

    const fileInput =
      document.getElementById(
        "fileInput"
      );

    const embedButton =
      document.getElementById(
        "embedButton"
      );

    const filePreview =
      document.getElementById(
        "filePreview"
      );

    const fileStatus =
      document.getElementById(
        "fileStatus"
      );

    const filePanel =
      document.getElementById(
        "fileEmbedPanel"
      );

    const attachButton =
      document.getElementById(
        "attachBtn"
      );

    const closeFileButton =
      document.getElementById(
        "fileCloseButton"
      );

    let objectURL = null;


    function setFileStatus(
      text,
      error = false
    ) {
      fileStatus.textContent =
        text;

      fileStatus.classList.toggle(
        "error",
        error
      );
    }


    function cleanupFilePreview() {
      filePreview.replaceChildren();

      if (objectURL) {
        URL.revokeObjectURL(
          objectURL
        );

        objectURL = null;
      }

      setFileStatus("");
    }


    function getExtension(
      filename
    ) {
      const parts =
        filename
          .toLowerCase()
          .split(".");

      return parts.length > 1
        ? parts.pop()
        : "";
    }


    function createMediaElement(
      file
    ) {
      const extension =
        getExtension(file.name);


      objectURL =
        URL.createObjectURL(file);


      /* AVIF */

      if (extension === "avif") {

        const image =
          document.createElement("img");

        image.alt =
          file.name;

        image.src =
          objectURL;


        image.onload = () => {
          setFileStatus(
            "AVIF loaded successfully."
          );
        };


        image.onerror = () => {
          setFileStatus(
            "This browser cannot decode this AVIF file.",
            true
          );
        };


        filePreview.appendChild(
          image
        );

        return;
      }


      /* HEIF / HEIC */

      if (
        extension === "heif" ||
        extension === "heic"
      ) {

        const image =
          document.createElement("img");

        image.alt =
          file.name;

        image.src =
          objectURL;


        image.onload = () => {
          setFileStatus(
            "HEIF/HEIC loaded successfully."
          );
        };


        image.onerror = () => {
          setFileStatus(
            "This browser does not support HEIF/HEIC decoding.",
            true
          );
        };


        filePreview.appendChild(
          image
        );

        return;
      }


      /* AAC */

      if (extension === "aac") {

        const audio =
          document.createElement("audio");

        audio.controls = true;
        audio.preload = "metadata";
        audio.src = objectURL;


        audio.onloadedmetadata =
          () => {
            setFileStatus(
              "AAC loaded successfully."
            );
          };


        audio.onerror =
          () => {
            setFileStatus(
              "This browser cannot decode this AAC file.",
              true
            );
          };


        filePreview.appendChild(
          audio
        );

        return;
      }


      /* M4A */

      if (extension === "m4a") {

        const audio =
          document.createElement("audio");

        audio.controls = true;
        audio.preload = "metadata";
        audio.src = objectURL;


        audio.onloadedmetadata =
          () => {
            setFileStatus(
              "M4A loaded successfully."
            );
          };


        audio.onerror =
          () => {
            setFileStatus(
              "This browser cannot decode this audio file.",
              true
            );
          };


        filePreview.appendChild(
          audio
        );

        return;
      }


      /* MP4 */

      if (extension === "mp4") {

        const video =
          document.createElement("video");

        video.controls = true;
        video.preload = "metadata";
        video.src = objectURL;


        video.onloadedmetadata =
          () => {
            setFileStatus(
              "Video loaded successfully."
            );
          };


        video.onerror =
          () => {
            setFileStatus(
              "This browser cannot decode this video.",
              true
            );
          };


        filePreview.appendChild(
          video
        );

        return;
      }


      setFileStatus(
        "Unsupported file format.",
        true
      );
    }


    function embedFile() {
      cleanupFilePreview();


      const file =
        fileInput.files?.[0];


      if (!file) {
        setFileStatus(
          "Select a file first.",
          true
        );

        return;
      }


      const filename =
        document.createElement(
          "div"
        );

      filename.className =
        "file-filename";

      filename.textContent =
        file.name;


      filePreview.appendChild(
        filename
      );


      setFileStatus(
        "Loading..."
      );


      createMediaElement(
        file
      );
    }


    embedButton.addEventListener(
      "click",
      embedFile
    );


    fileInput.addEventListener(
      "change",
      cleanupFilePreview
    );


    /* ================================
       OPEN / CLOSE FILE PANEL
       ================================ */

    attachButton.addEventListener(
      "click",
      () => {
        filePanel.classList.toggle(
          "open"
        );

        if (
          filePanel.classList.contains(
            "open"
          )
        ) {
          fileInput.focus();
        }
      }
    );


    closeFileButton.addEventListener(
      "click",
      () => {
        filePanel.classList.remove(
          "open"
        );

        cleanupFilePreview();
      }
    );


    /* ================================
       INITIAL STATE
       ================================ */

    window.addEventListener(
      "beforeunload",
      () => {
        if (objectURL) {
          URL.revokeObjectURL(
            objectURL
          );
        }
      }
    );
  </script>

</body>
</html>
