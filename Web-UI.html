<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">

<title>Krynet Community</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #111214;
    color: #f2f3f5;
    overflow: hidden;
}

/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    overflow: hidden;
}

/* =========================================================
   SERVER SIDEBAR
========================================================= */

.server-sidebar {
    width: 72px;
    flex-shrink: 0;
    background: #0b0c0e;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-right: 1px solid #191a1e;
}

.server {
    width: 48px;
    height: 48px;
    border-radius: 16px;
    border: 0;
    background: #202225;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition:
        border-radius .15s ease,
        background .15s ease;
}

.server:hover {
    border-radius: 13px;
    background: #5865f2;
}

.server.active {
    border-radius: 13px;
    background: #5865f2;
}

.server-divider {
    width: 32px;
    height: 1px;
    background: #292b30;
}

/* =========================================================
   CHANNEL SIDEBAR
========================================================= */

.channel-sidebar {
    width: 240px;
    flex-shrink: 0;
    background: #18191c;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #101113;
}

.server-header {
    height: 52px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #101113;
    font-weight: 700;
}

.server-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.server-header button {
    border: 0;
    background: transparent;
    color: #b5bac1;
    font-size: 20px;
    cursor: pointer;
}

.channel-section {
    padding: 18px 10px 0;
}

.channel-section-title {
    padding: 0 8px 8px;
    color: #949ba4;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
}

.channel {
    width: 100%;
    border: 0;
    background: transparent;
    color: #949ba4;
    padding: 9px 10px;
    border-radius: 5px;
    text-align: left;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 9px;
}

.channel:hover {
    color: #dbdee1;
    background: #2a2c30;
}

.channel.active {
    color: #fff;
    background: #3b3d44;
}

.channel-icon {
    color: #72767d;
    font-size: 18px;
}

.channel.active .channel-icon {
    color: #b5bac1;
}

/* =========================================================
   USER PANEL
========================================================= */

.user-panel {
    margin-top: auto;
    padding: 10px;
    background: #111214;
    display: flex;
    align-items: center;
    gap: 9px;
}

.avatar {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: 50%;
    background: #5865f2;
    display: grid;
    place-items: center;
    font-weight: 700;
}

.user-info {
    min-width: 0;
}

.user-name {
    font-size: 13px;
    font-weight: 700;
}

.user-status {
    color: #949ba4;
    font-size: 11px;
}

.user-controls {
    margin-left: auto;
    display: flex;
    gap: 4px;
}

.user-controls button {
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: #b5bac1;
    cursor: pointer;
}

.user-controls button:hover {
    background: #2b2d31;
    color: #fff;
}

/* =========================================================
   CHAT
========================================================= */

.chat {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #313338;
}

.chat-header {
    height: 52px;
    flex-shrink: 0;
    padding: 0 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #202124;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
}

.chat-header-icon {
    color: #949ba4;
    font-size: 22px;
}

.chat-header-name {
    font-weight: 700;
}

.chat-header-topic {
    color: #949ba4;
    font-size: 13px;
    border-left: 1px solid #4a4d52;
    padding-left: 10px;
}

.chat-header-spacer {
    flex: 1;
}

.chat-header button {
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: #b5bac1;
    cursor: pointer;
    font-size: 17px;
}

.chat-header button:hover {
    background: #3b3d44;
    color: #fff;
}

/* =========================================================
   MESSAGE AREA
========================================================= */

.messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 18px 0 20px;

.message {
    position: relative;
    padding: 4px 20px;
    display: flex;

.message:hover {

}

.message-avatar {

    height: 40px;
    flex-shrink: 0;
    border-radius: 50%;
    background: #5865f2;
    display: grid;
    place-items: center;
    font-weight: 700;
}

.message-content {

.message-author-row {

    align-items: baseline;

}

.message-author {

    font-size: 15px;

.message-time {

    font-size: 11px;

.message-text {

    overflow-wrap: anywhere;
}

.message-text.hidden-link-text {
    display: none;

/* =========================================================

========================================================= */

.message-embeds {
    margin-top: 7px;

.kr-embed {

    background: #2b2d31;

.kr-embed-accent {

.kr-embed-title {

/* =========================================================

.kr-reactions {

<script type="module">

import { Reactions } from "./js/reactions.js";
import { Embed } from "./js/embed.js";


/* =========================================================
   ELEMENTS
========================================================= */

const messages =
    document.getElementById("messages");

const messageForm =
    document.getElementById("messageForm");

const messageInput =
    document.getElementById("messageInput");

const fileInput =
    document.getElementById("fileInput");

const uploadButton =

const uploadPreview =

/* =========================================================
   HELPERS
========================================================= */

function escapeText(value) {
    return String(value);
}


function getYouTubeId(value) {

    try {

        const url =
            new URL(value);

        if (
            url.hostname === "youtu.be" ||
            url.hostname === "www.youtu.be"
        ) {
            return url.pathname
                .slice(1)
                .split("/")[0];
        }

        if (
            url.hostname === "youtube.com" ||
            url.hostname === "www.youtube.com" ||
            url.hostname === "m.youtube.com"
        ) {

            if (
                url.pathname === "/watch"
            ) {
                return url.searchParams.get("v");
            }

            if (
                url.pathname.startsWith("/shorts/")
            ) {
                return url.pathname
                    .split("/")[2];
            }

            if (
                url.pathname.startsWith("/embed/")
            ) {
                return url.pathname
                    .split("/")[2];
            }
        }

    } catch {
        return null;
    }

    return null;
}


function getURLs(text) {

    const matches =
        text.match(
            /https?:\/\/[^\s<>"']+/gi
        );

    if (!matches) {
        return [];
    }

    return [
        ...new Set(
            matches
                .map(url => {
                    return url.replace(
                        /[),.!?]+$/,
                        ""
                    );
                })
        )
    ];
}


/* =========================================================
   YOUTUBE EMBED
========================================================= */

function createYouTubeEmbed(url) {

    const id =
        getYouTubeId(url);

    if (!id) {
        return null;
    }

    const embed =
        document.createElement("div");

    embed.className =
        "kr-embed";

    const accent =
        document.createElement("div");

    accent.className =
        "kr-embed-accent";

    const body =
        document.createElement("div");

    body.className =
        "kr-embed-body";

    const title =
        document.createElement("a");

    title.className =
        "kr-embed-title";

    title.href =
        url;

    title.target =
        "_blank";

    title.rel =
        "noopener noreferrer";

    title.textContent =
        "YouTube video";

    const iframe =
        document.createElement("iframe");

    iframe.className =
        "kr-youtube";

    /*
     * The raw watch URL never gets displayed.
     * Only the actual player appears in the message.
     */

    iframe.src =
        `https://www.youtube.com/embed/${encodeURIComponent(id)}?rel=0`;

    iframe.title =
        "YouTube video";

    iframe.loading =
        "lazy";

    iframe.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";

    iframe.allowFullscreen =
        true;

    body.append(
        title,
        iframe
    );

    embed.append(
        accent,
        body
    );

    return embed;
}

async function createWebsiteEmbed(url) {

    /*
     * Let the existing embed.js handle normal URLs.
     *
     * YouTube is handled separately because it needs
     * an actual iframe player rather than a thumbnail.
     */

    const youtube =
        createYouTubeEmbed(url);

    if (youtube) {
        return youtube;
    }

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message-embeds";

    /*
     * Ask embed.js to process a temporary message.
     */

    const temporary =
        document.createElement("div");

    temporary.className =
        "embed-source-message";

    temporary.innerText =
        url;

    wrapper.appendChild(
        temporary
    );

    /*
     * The supplied Embed module scans message elements
     * and appends embeds to them.
     */

    try {

        Embed.scanMessages(
            ".embed-source-message"
        );

        await new Promise(
            resolve =>
                setTimeout(resolve, 250)
        );

        const generated =
            temporary.querySelector(
                ".kr-embed"
            );

        if (generated) {

            wrapper.replaceChildren(
                generated
            );

            return wrapper;
        }

    } catch (error) {

        console.warn(
            "[Krynet] Website embed failed:",
            error
        );
    }

    return null;
}


/* =========================================================
   MESSAGE REACTIONS
========================================================= */

function setupMessageReactions(message) {

    const reactions =
        message.querySelector(
            ".message-reactions"
        );

    if (!reactions) {
        return;
    }

    const reactionArea =
        reactions.querySelector(
            ".kr-reactions"
        );

    if (!reactionArea) {
        return;
    }

    if (
        reactionArea.dataset.initialized ===
        "true"
    ) {
        return;
    }

    reactionArea.dataset.initialized =
        "true";

    /*
     * Use the reactions.js implementation when available.
     */

    try {
        new Reactions(
            reactionArea
        );
    } catch {
        /*
         * Fallback is handled below.
         */
    }
}


function addReactionButton(message) {

    const button =
        message.querySelector(
            ".add-reaction"
        );

    if (!button) {
        return;
    }

    button.addEventListener(
        "click",
        event => {

            event.preventDefault();
            event.stopPropagation();

            const emoji =
                prompt(
                    "Reaction emoji:",
                    "👍"
                );

            if (!emoji) {
                return;
            }

            const area =
                message.querySelector(
                    ".kr-reactions"
                );

            if (!area) {
                return;
            }

            let existing =
                [...area.querySelectorAll(
                    ".kr-reaction"
                )]
                .find(
                    item =>
                        item.dataset.emoji ===
                        emoji
                );

            if (existing) {

                const count =
                    existing.querySelector(
                        "span"
                    );

                count.textContent =
                    String(
                        Number(count.textContent || 0) +
                        1
                    );

                existing.classList.add(
                    "active"
                );

                return;
            }

            existing =
                document.createElement(
                    "button"
                );

            existing.type =
                "button";

            existing.className =
                "kr-reaction active";

            existing.dataset.emoji =
                emoji;

            existing.innerHTML =
                `${escapeText(emoji)} <span>1</span>`;

            area.appendChild(
                existing
            );

            existing.addEventListener(
                "click",
                () => {

                    const count =
                        existing.querySelector(
                            "span"
                        );

                    const next =
                        Number(
                            count.textContent || 0
                        ) - 1;

                    if (next <= 0) {
                        existing.remove();
                        return;
                    }

                    count.textContent =
                        String(next);

                }
            );

        }
    );
}


/* =========================================================
   CREATE MESSAGE
========================================================= */

async function createMessage(text) {

    const urls =
        getURLs(text);

    const message =
        document.createElement(
            "article"
        );

    message.className =
        "message";

    const avatar =
        document.createElement("div");

    avatar.className =
        "message-avatar";

    avatar.textContent =
        "B";

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    const authorRow =
        document.createElement("div");

    authorRow.className =
        "message-author-row";

    const author =
        document.createElement("span");

    author.className =
        "message-author";

    author.textContent =
        "Barney";

    const time =
        document.createElement("span");

    time.className =
        "message-time";

    time.textContent =
        "Just now";

    authorRow.append(
        author,
        time
    );


    /* =====================================================
       MESSAGE TEXT
    ====================================================== */

    const textElement =
        document.createElement("div");

    textElement.className =
        "message-text";

    /*
     * If the message is ONLY a URL, don't show the URL.
     * Discord-style behavior: username + embed.
     */

    const trimmed =
        text.trim();

    const isOnlyURL =
        urls.length === 1 &&
        trimmed === urls[0];

    if (isOnlyURL) {

        textElement.textContent =
            "";

        textElement.classList.add(
            "hidden-link-text"
        );

    } else {

        textElement.textContent =
            text;
    }


    content.append(
        authorRow,
        textElement
    );


    /* =====================================================
       EMBEDS
    ====================================================== */

    if (urls.length) {

        const embedContainer =
            document.createElement(
                "div"
            );

        embedContainer.className =
            "message-embeds";

        for (const url of urls) {

            const youtube =
                createYouTubeEmbed(url);

            if (youtube) {

                /*
                 * IMPORTANT:
                 *
                 * The YouTube URL is NOT appended
                 * as message text.
                 *
                 * The player lives directly underneath
                 * the username/message content.
                 */

                embedContainer.appendChild(
                    youtube
                );

                continue;
            }

            /*
             * For normal websites/files, use the existing
             * embed module.
             */

            try {

                const temporary =
                    document.createElement(
                        "div"
                    );

                temporary.className =
                    "embed-source-message";

                temporary.innerText =
                    url;

                document.body.appendChild(
                    temporary
                );

                Embed.scanMessages(
                    ".embed-source-message"
                );

                await new Promise(
                    resolve =>
                        setTimeout(resolve, 150)
                );

                const generated =
                    temporary.querySelector(
                        ".kr-embed"
                    );

                if (generated) {

                    embedContainer.appendChild(
                        generated
                    );
                }

                temporary.remove();

            } catch (error) {

                console.warn(
                    "[Krynet] Embed failed:",
                    url,
                    error
                );
            }
        }

        if (
            embedContainer.children.length
        ) {
            content.appendChild(
                embedContainer
            );
        }
    }


    /* =====================================================
       REACTIONS
    ====================================================== */

    const reactionRow =
        document.createElement(
            "div"
        );

    reactionRow.className =
        "message-reactions";

    const reactionArea =
        document.createElement(
            "div"
        );

    reactionArea.className =
        "kr-reactions";

    reactionRow.appendChild(
        reactionArea
    );

    content.appendChild(
        reactionRow
    );


    /* =====================================================
       ADD REACTION
    ====================================================== */

    const addReaction =
        document.createElement(
            "button"
        );

    addReaction.type =
        "button";

    addReaction.className =
        "add-reaction";

    addReaction.title =
        "Add Reaction";

    addReaction.textContent =
        "😊";


    message.append(
        avatar,
        content,
        addReaction
    );

    messages.appendChild(
        message
    );

    setupMessageReactions(
        message
    );

    addReactionButton(
        message
    );

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================================================
   SEND
========================================================= */

messageForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const text =
            messageInput.value.trim();

        if (!text) {
            return;
        }

        messageInput.value =
            "";

        messageInput.style.height =
            "36px";

        await createMessage(
            text
        );
    }
);


/* =========================================================
   ENTER TO SEND
========================================================= */

messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {
            event.preventDefault();

            messageForm.requestSubmit();
        }
    }
);


/* =========================================================
   AUTO RESIZE
========================================================= */

messageInput.addEventListener(
    "input",
    () => {

        messageInput.style.height =
            "36px";

        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                180
            ) + "px";
    }
);


/* =========================================================
   FILE UPLOAD
========================================================= */

uploadButton.addEventListener(
    "click",
    () => {
        fileInput.click();
    }
);


fileInput.addEventListener(
    "change",
    () => {

        const files =
            Array.from(
                fileInput.files || []
            );

        if (!files.length) {

            uploadPreview.classList.remove(
                "visible"
            );

            uploadPreview.textContent =
                "";

            return;
        }

        uploadPreview.classList.add(
            "visible"
        );

        uploadPreview.textContent =
            files.length === 1
                ? `Selected: ${files[0].name}`
                : `${files.length} files selected`;
    }
);


/* =========================================================
   CHANNEL BUTTONS
========================================================= */

document
    .querySelectorAll(".channel")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".channel"
                    )
                    .forEach(
                        item =>
                            item.classList.remove(
                                "active"
                            )
                    );

                button.classList.add(
                    "active"
                );

                const name =
                    button.textContent
                        .trim()
                        .replace(/^#/, "");

                document
                    .querySelector(
                        ".chat-header-name"
                    )
                    .textContent =
                    name;
            }
        );
    });


/* =========================================================
   INITIALIZE EXISTING REACTIONS
========================================================= */

document
    .querySelectorAll(".message")
    .forEach(message => {

        setupMessageReactions(
            message
        );

        addReactionButton(
            message
        );
    });


/* =========================================================
   INITIAL EMBEDS
========================================================= */

try {

    Embed.scanMessages(
        ".message"
    );

} catch (error) {

    console.warn(
        "[Krynet] Initial embed scan failed:",
        error
    );
}


/* =========================================================
   WATCH FOR NEW MESSAGES
========================================================= */

/*
 * MutationObserver is useful here because the chat is
 * dynamically adding message nodes after the initial page
 * has loaded. :contentReference[oaicite:1]{index=1}
 */

const observer =
    new MutationObserver(
        mutations => {

            for (const mutation of mutations) {

                for (
                    const node
                    of mutation.addedNodes
                ) {

                    if (
                        !(node instanceof Element)
                    ) {
                        continue;
                    }

                    if (
                        node.matches?.(
                            ".message"
                        )
                    ) {

                        setupMessageReactions(
                            node
                        );

                        addReactionButton(
                            node
                        );
                    }

                    node
                        .querySelectorAll?.(
                            ".message"
                        )
                        .forEach(
                            message => {

                                setupMessageReactions(
                                    message
                                );

                                addReactionButton(
                                    message
                                );
                            }
                        );
                }
            }
        }
    );


observer.observe(
    messages,
    {
        childList: true,
        subtree: true
    }
);

</script>

</body>
</html>
