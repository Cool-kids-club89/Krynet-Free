<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="color-scheme"
        content="dark"
    >

    <title>Krynet Community</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #202225;
            color: #ffffff;
            overflow: hidden;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            border: 0;
        }

        /* =====================================================
           APP
        ===================================================== */

        .app {
            width: 100%;
            height: 100%;
            display: flex;
            overflow: hidden;
        }

        /* =====================================================
           SERVER SIDEBAR
        ===================================================== */

        .server-sidebar {
            width: 72px;
            flex-shrink: 0;
            background: #1e1f22;
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .server-button {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: #313338;
            color: #fff;
            cursor: pointer;
            font-size: 19px;
            transition:
                border-radius .15s,
                background .15s,
                transform .15s;
        }

        .server-button:hover {
            border-radius: 14px;
            background: #5865f2;
            transform: translateY(-1px);
        }

        .server-button.active {
            border-radius: 14px;
            background: #5865f2;
        }

        .server-divider {
            width: 32px;
            height: 1px;
            background: #35363c;
        }

        /* =====================================================
           CHANNEL SIDEBAR
        ===================================================== */

        .channel-sidebar {
            width: 240px;
            flex-shrink: 0;
            background: #2b2d31;
            display: flex;
            flex-direction: column;
        }

        .server-header {
            height: 52px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #1f2023;
            font-weight: 700;
            cursor: pointer;
        }

        .server-header:hover {
            background: #35373c;
        }

        .channel-list {
            flex: 1;
            padding: 12px 8px;
            overflow-y: auto;
        }

        .channel-category {
            padding: 10px 8px 5px;
            color: #949ba4;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .channel {
            width: 100%;
            min-height: 36px;
            padding: 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 5px;
            background: transparent;
            color: #949ba4;
            cursor: pointer;
            text-align: left;
            margin: 1px 0;
        }

        .channel:hover {
            background: #35373c;
            color: #dbdee1;
        }

        .channel.active {
            background: #404249;
            color: #fff;
        }

        .channel-icon {
            width: 22px;
            color: #80848e;
            font-size: 20px;
        }

        .channel.active .channel-icon {
            color: #fff;
        }

        .voice-channel.connected {
            background: #263d32;
            color: #57f287;
        }

        .voice-channel.connected .channel-icon {
            color: #57f287;
        }

        .voice-channel.connecting {
            background: #3d3926;
            color: #faa61a;
        }

        .voice-channel.connecting .channel-icon {
            color: #faa61a;
        }

        /* =====================================================
           USER PANEL
        ===================================================== */

        .user-panel {
            min-height: 52px;
            padding: 8px;
            background: #232428;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #5865f2;
            font-size: 13px;
            font-weight: 700;
        }

        .user-info {
            min-width: 0;
            flex: 1;
        }

        .username {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-text {
            color: #949ba4;
            font-size: 11px;
        }

        .voice-status {
            color: #57f287;
            font-size: 10px;
            white-space: nowrap;
        }

        .voice-status.error {
            color: #ed4245;
        }

        .voice-status.connecting {
            color: #faa61a;
        }

        /* =====================================================
           CHAT
        ===================================================== */

        .chat {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #313338;
        }

        .chat-header {
            height: 52px;
            flex-shrink: 0;
            padding: 0 16px;
            border-bottom: 1px solid #26272b;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,.15);
        }

        .chat-header-icon {
            color: #949ba4;
            font-size: 22px;
        }

        .chat-header-name {
            font-weight: 700;
        }

        .chat-header-topic {
            color: #949ba4;
            font-size: 13px;
            border-left: 1px solid #4b4d53;
            padding-left: 10px;
        }

        .voice-header-status {
            display: none;
            align-items: center;
            gap: 7px;
            margin-left: 4px;
            padding-left: 10px;
            border-left: 1px solid #4b4d53;
            color: #57f287;
            font-size: 12px;
        }

        .voice-header-status.visible {
            display: flex;
        }

        .voice-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        .call-controls {
            display: flex;
            gap: 5px;
            margin-left: auto;
        }

        .call-button {
            width: 34px;
            height: 34px;
            border-radius: 7px;
            background: transparent;
            color: #b5bac1;
            cursor: pointer;
        }

        .call-button:hover {
            background: #404249;
            color: #fff;
        }

        .call-button.active {
            background: #5865f2;
            color: #fff;
        }

        /* =====================================================
           MESSAGES
        ===================================================== */

        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 20px 18px 12px;
        }

        .message {
            position: relative;
            display: flex;
            gap: 12px;
            padding: 3px 8px;
            margin: 1px 0;
            border-radius: 4px;
        }

        .message:hover {
            background: rgba(0,0,0,.04);
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            margin-top: 1px;
            border-radius: 50%;
            background: #5865f2;
            display: grid;
            place-items: center;
            font-size: 14px;
            font-weight: 700;
        }

        .message-content {
            min-width: 0;
            max-width: min(850px,100%);
        }

        .message-author-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            min-height: 20px;
        }

        .message-author {
            font-size: 15px;
            font-weight: 600;
        }

        .message-time {
            color: #949ba4;
            font-size: 11px;
        }

        .message-text {
            color: #dbdee1;
            font-size: 15px;
            line-height: 1.45;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .message.link-only .message-text {
            display: none;
        }

        /* =====================================================
           EMBEDS
        ===================================================== */

        .kr-embed {
            margin-top: 5px;
            max-width: 520px;
        }

        .kr-embed iframe {
            width: 100%;
            min-height: 292px;
            border: 0;
            border-radius: 7px;
            background: #18191c;
            display: block;
        }

        .kr-embed img {
            max-width: 100%;
            max-height: 420px;
            border-radius: 8px;
            object-fit: contain;
        }

        .kr-embed video {
            max-width: 100%;
            max-height: 420px;
            border-radius: 8px;
            background: #000;
        }

        /* =====================================================
           YOUTUBE
        ===================================================== */

        .youtube-embed {
            display: flex;
            max-width: 520px;
            overflow: hidden;
            border-radius: 8px;
            background: #2f3136;
        }

        .youtube-embed-bar {
            width: 4px;
            flex-shrink: 0;
            background: #ff0000;
        }

        .youtube-embed-body {
            flex: 1;
            min-width: 0;
            padding: 8px;
        }

        .youtube-embed iframe {
            min-height: 292px;
            width: 100%;
        }

        /* =====================================================
           REACTIONS
        ===================================================== */

        .kr-message-reactions,
        .message-reactions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 5px;
        }

        .kr-reaction {
            min-height: 25px;
            padding: 2px 7px;
            border: 1px solid #4f5158;
            border-radius: 7px;
            background: #2b2d31;
            color: #dbdee1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
        }

        .kr-reaction:hover {
            border-color: #5865f2;
            background: #35384a;
        }

        .kr-reaction.active {
            border-color: #5865f2;
            background: #3c4270;
        }

        /* =====================================================
           MESSAGE ACTIONS
        ===================================================== */

        .message-actions {
            position: absolute;
            right: 10px;
            top: -16px;
            display: none;
            align-items: center;
            gap: 2px;
            padding: 3px;
            border: 1px solid #1f2023;
            border-radius: 6px;
            background: #2b2d31;
            box-shadow: 0 4px 12px rgba(0,0,0,.3);
            z-index: 10;
        }

        .message:hover .message-actions {
            display: flex;
        }

        .message-action {
            width: 30px;
            height: 28px;
            border-radius: 4px;
            background: transparent;
            color: #b5bac1;
            cursor: pointer;
        }

        .message-action:hover {
            background: #404249;
            color: #fff;
        }

        /* =====================================================
           WELCOME
        ===================================================== */

        .welcome {
            padding: 18px 8px 20px;
        }

        .welcome-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .welcome-description {
            color: #949ba4;
            font-size: 14px;
        }

        /* =====================================================
           COMPOSER
        ===================================================== */

        .composer-wrap {
            padding: 0 16px 18px;
            flex-shrink: 0;
        }

        .attachment-preview {
            display: none;
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 8px;
            background: #2b2d31;
        }

        .attachment-preview.visible {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .attachment-preview img,
        .attachment-preview video {
            max-width: 100px;
            max-height: 70px;
            border-radius: 5px;
            object-fit: cover;
        }

        .attachment-name {
            flex: 1;
            min-width: 0;
            color: #dbdee1;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .attachment-remove {
            width: 28px;
            height: 28px;
            border-radius: 5px;
            background: transparent;
            color: #b5bac1;
            cursor: pointer;
        }

        .attachment-remove:hover {
            background: #404249;
            color: #fff;
        }

        .composer {
            min-height: 48px;
            border-radius: 8px;
            background: #383a40;
            display: flex;
            align-items: flex-end;
            padding: 8px;
            gap: 7px;
        }

        .composer-button {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 50%;
            background: transparent;
            color: #b5bac1;
            cursor: pointer;
            font-size: 18px;
        }

        .composer-button:hover {
            color: #fff;
            background: #404249;
        }

        .composer-input {
            flex: 1;
            min-width: 0;
            max-height: 160px;
            padding: 7px 4px;
            resize: none;
            border: 0;
            outline: 0;
            background: transparent;
            color: #dbdee1;
            line-height: 1.4;
        }

        .composer-input::placeholder {
            color: #949ba4;
        }

        .send-button {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border-radius: 7px;
            background: #5865f2;
            color: #fff;
            cursor: pointer;
            font-size: 17px;
        }

        .send-button:hover {
            background: #4752c4;
        }

        #fileInput {
            display: none;
        }

        /* =====================================================
           CALL PANEL
        ===================================================== */

        .call-panel {
            position: fixed;
            right: 20px;
            bottom: 85px;
            width: 360px;
            display: none;
            overflow: hidden;
            border: 1px solid #1f2023;
            border-radius: 10px;
            background: #18191c;
            box-shadow: 0 12px 40px rgba(0,0,0,.5);
            z-index: 100;
        }

        .call-panel.visible {
            display: block;
        }

        .call-panel-header {
            height: 42px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #232428;
            color: #dbdee1;
            font-size: 13px;
            font-weight: 600;
        }

        .call-close {
            width: 28px;
            height: 28px;
            border-radius: 5px;
            background: transparent;
            color: #b5bac1;
            cursor: pointer;
        }

        .call-close:hover {
            background: #404249;
            color: #fff;
        }

        .call-video {
            width: 100%;
            display: block;
            background: #000;
            aspect-ratio: 16 / 9;
            object-fit: contain;
        }

        .call-status {
            padding: 9px 12px;
            color: #949ba4;
            font-size: 12px;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {
            .channel-sidebar {
                width: 190px;
            }

            .server-sidebar {
                width: 60px;
            }

            .server-button {
                width: 42px;
                height: 42px;
            }
        }

        @media (max-width: 600px) {
            .server-sidebar {
                display: none;
            }

            .channel-sidebar {
                width: 64px;
            }

            .server-header {
                justify-content: center;
                padding: 0;
            }

            .server-header span {
                display: none;
            }

            .channel-category {
                display: none;
            }

            .channel {
                justify-content: center;
                padding: 0;
            }

            .channel span:not(.channel-icon) {
                display: none;
            }

            .user-info {
                display: none;
            }

            .user-panel {
                justify-content: center;
            }

            .messages {
                padding-left: 8px;
                padding-right: 8px;
            }

            .message-actions {
                display: none !important;
            }

            .chat-header-topic {
                display: none;
            }

            .voice-header-status {
                border-left: 0;
                padding-left: 0;
            }

            .call-panel {
                left: 8px;
                right: 8px;
                bottom: 76px;
                width: auto;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         SERVER SIDEBAR
    ====================================================== -->

    <aside class="server-sidebar">

        <button
            class="server-button active"
            title="Krynet"
            type="button"
        >
            K
        </button>

        <div class="server-divider"></div>

        <button
            class="server-button"
            title="Community"
            type="button"
        >
            C
        </button>

        <button
            class="server-button"
            title="Add server"
            type="button"
        >
            +
        </button>

    </aside>


    <!-- =====================================================
         CHANNEL SIDEBAR
    ====================================================== -->

    <aside class="channel-sidebar">

        <div class="server-header">
            <span>Krynet Community</span>
            <span style="margin-left:auto">⌄</span>
        </div>

        <div class="channel-list">

            <div class="channel-category">
                Text Channels
            </div>

            <button
                class="channel active"
                data-channel="general"
                data-type="text"
                type="button"
            >
                <span class="channel-icon">#</span>
                <span>general</span>
            </button>

            <button
                class="channel"
                data-channel="community"
                data-type="text"
                type="button"
            >
                <span class="channel-icon">#</span>
                <span>community</span>
            </button>

            <button
                class="channel"
                data-channel="development"
                data-type="text"
                type="button"
            >
                <span class="channel-icon">#</span>
                <span>development</span>
            </button>

            <div class="channel-category">
                Voice Channels
            </div>

            <button
                class="channel voice-channel"
                data-channel="Lounge"
                data-type="voice"
                type="button"
            >
                <span class="channel-icon">🔊</span>
                <span>Lounge</span>
            </button>

            <button
                class="channel voice-channel"
                data-channel="Gaming"
                data-type="voice"
                type="button"
            >
                <span class="channel-icon">🔊</span>
                <span>Gaming</span>
            </button>

        </div>

        <div class="user-panel">

            <div class="avatar">B</div>

            <div class="user-info">
                <div class="username">Barney</div>

                <div
                    class="status-text"
                    id="userStatus"
                >
                    Online
                </div>

                <div
                    class="voice-status"
                    id="voiceStatus"
                ></div>
            </div>

            <button
                class="composer-button"
                title="Settings"
                type="button"
            >
                ⚙
            </button>

        </div>

    </aside>


    <!-- =====================================================
         CHAT
    ====================================================== -->

    <main class="chat">

        <header class="chat-header">

            <span
                class="chat-header-icon"
                id="headerChannelIcon"
            >
                #
            </span>

            <span
                class="chat-header-name"
                id="channelName"
            >
                general
            </span>

            <span class="chat-header-topic">
                Krynet Community
            </span>

            <div
                class="voice-header-status"
                id="voiceHeaderStatus"
            >
                <span class="voice-dot"></span>
                <span id="voiceHeaderText">
                    Voice connected
                </span>
            </div>

            <div class="call-controls">

                <button
                    class="call-button"
                    id="cameraButton"
                    type="button"
                    title="Camera"
                >
                    📷
                </button>

                <button
                    class="call-button"
                    id="screenButton"
                    type="button"
                    title="Share screen"
                >
                    🖥
                </button>

                <button
                    class="call-button"
                    id="leaveVoiceButton"
                    type="button"
                    title="Leave voice"
                    style="display:none"
                >
                    📞
                </button>

            </div>

        </header>


        <!-- =================================================
             MESSAGES
        ================================================== -->

        <section
            class="messages"
            id="messages"
            aria-live="polite"
        >

            <div class="welcome">

                <div class="welcome-title">
                    Welcome to #general
                </div>

                <div class="welcome-description">
                    This is the beginning of this channel.
                </div>

            </div>


            <article
                class="message"
                data-message-id="welcome-1"
            >

                <div class="message-avatar">
                    K
                </div>

                <div class="message-content">

                    <div class="message-author-row">

                        <span class="message-author">
                            Krynet
                        </span>

                        <span class="message-time">
                            Today at 12:00 PM
                        </span>

                    </div>

                    <div class="message-text">
                        Welcome to the Krynet Community.
                    </div>

                    <div class="message-reactions"></div>

                </div>

                <div class="message-actions">

                    <button
                        class="message-action"
                        data-action="react"
                        title="Add Reaction"
                        type="button"
                    >
                        😊
                    </button>

                    <button
                        class="message-action"
                        data-action="reply"
                        title="Reply"
                        type="button"
                    >
                        ↩
                    </button>

                </div>

            </article>

        </section>


        <!-- =================================================
             COMPOSER
        ================================================== -->

        <div class="composer-wrap">

            <div
                class="attachment-preview"
                id="attachmentPreview"
            >

                <div id="attachmentContent"></div>

                <div
                    class="attachment-name"
                    id="attachmentName"
                ></div>

                <button
                    class="attachment-remove"
                    id="removeAttachment"
                    type="button"
                    title="Remove attachment"
                >
                    ×
                </button>

            </div>

            <div class="composer">

                <button
                    class="composer-button"
                    id="uploadButton"
                    type="button"
                    title="Upload a file"
                >
                    +
                </button>

                <input
                    id="fileInput"
                    type="file"
                    accept="image/*,video/*,audio/*,.avif,.heif,.heic,.aac,.m4a,.mp4,.pdf"
                >

                <textarea
                    id="messageInput"
                    class="composer-input"
                    rows="1"
                    placeholder="Message #general"
                    autocomplete="off"
                ></textarea>

                <button
                    class="send-button"
                    id="sendButton"
                    type="button"
                    title="Send"
                >
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>


<!-- =========================================================
     CALL PANEL
========================================================= -->

<div
    class="call-panel"
    id="callPanel"
>

    <div class="call-panel-header">

        <span id="callTitle">
            Camera
        </span>

        <button
            class="call-close"
            id="callClose"
            type="button"
        >
            ×
        </button>

    </div>

    <video
        class="call-video"
        id="callVideo"
        autoplay
        muted
        playsinline
    ></video>

    <div
        class="call-status"
        id="callStatus"
    >
        Ready
    </div>

</div>


<!-- =========================================================
     EXISTING SCRIPTS
========================================================= -->

<script src="./js/anonymous-upload.js"></script>

<script
    type="module"
    src="./js/openInApp.js"
></script>

<script src="./js/youtubeAdblock.js"></script>

<script src="./js/webcam.js"></script>

<script src="./js/screenshare.js"></script>


<!-- =========================================================
     VOICE CHAT CONFIG
========================================================= -->

<script>
    /*
     * These can also be populated by your server before
     * this HTML is served.
     *
     * Example:
     *
     * window.KRYNET_VOICE_CONFIG = {
     *     serverUrl: "https://voice.example.com",
     *     serverPublicKey: "BASE64_P256_PUBLIC_KEY"
     * };
     *
     * Do NOT put a server private key here.
     */

    window.KRYNET_VOICE_CONFIG =
        window.KRYNET_VOICE_CONFIG || {
            serverUrl: "",
            serverPublicKey: ""
        };
</script>


<!-- =========================================================
     CHAT APPLICATION

<script type="module">

    import { Embed } from "./js/embed.js";
    import { Reactions } from "./js/reactions.js";
    import { VoiceChatApex } from "./js/voicechat.js";

    "use strict";


    /* ========================================================
       ELEMENTS
    ======================================================== */

    const messages =
        document.getElementById("messages");

    const messageInput =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const fileInput =
        document.getElementById("fileInput");

    const uploadButton =
        document.getElementById("uploadButton");

    const attachmentPreview =
        document.getElementById("attachmentPreview");

    const attachmentContent =
        document.getElementById("attachmentContent");

    const attachmentName =
        document.getElementById("attachmentName");

    const removeAttachment =
        document.getElementById("removeAttachment");

    const channelName =
        document.getElementById("channelName");

    const headerChannelIcon =
        document.getElementById("headerChannelIcon");

    const cameraButton =
        document.getElementById("cameraButton");

    const screenButton =
        document.getElementById("screenButton");

    const leaveVoiceButton =
        document.getElementById("leaveVoiceButton");

    const callPanel =
        document.getElementById("callPanel");

    const callVideo =
        document.getElementById("callVideo");

    const callTitle =
        document.getElementById("callTitle");

    const callStatus =

    const callClose =

    const voiceStatus =
        document.getElementById("voiceStatus");

    const userStatus =
        document.getElementById("userStatus");

    const voiceHeaderStatus =
        document.getElementById("voiceHeaderStatus");

    const voiceHeaderText =
        document.getElementById("voiceHeaderText");


    /* ========================================================
       STATE
    ======================================================== */

    let selectedFile = null;

    let webcamSession = null;
    let screenSession = null;

    let voiceClient = null;
    let activeVoiceChannel = null;

    let voiceConnectionId = null;


    /*
     * Use your real authenticated session/user values here.
     *
     * If your application already exposes these globally,
     * those values are preferred.
     */

    const userId =
        window.KRYNET_USER_ID ||
        "barney";

    const sessionId =
        window.KRYNET_SESSION_ID ||
        crypto.randomUUID();


    const voiceConfig =
        window.KRYNET_VOICE_CONFIG || {};


    /* ========================================================
       VOICE HELPERS
    ======================================================== */

    function setVoiceStatus(
        text,
        state = ""
    ) {

        voiceStatus.textContent =
            text;

        voiceStatus.className =
            "voice-status";

        if (state) {
            voiceStatus.classList.add(state);
        }
    }


    function setVoiceHeader(
        visible,
        text = "Voice connected"
    ) {

        voiceHeaderStatus.classList.toggle(
            "visible",
            visible
        );

        voiceHeaderText.textContent =
            text;
    }


    function setVoiceChannelState(
        channel,
        state
    ) {

        document
            .querySelectorAll(".voice-channel")
            .forEach(item => {

                item.classList.remove(
                    "connected",
                    "connecting"
                );
            });

        if (!channel) {
            return;
        }

        const element =
            document.querySelector(
                `.voice-channel[data-channel="${CSS.escape(channel)}"]`
            );

        element?.classList.add(state);
    }


    function getVoiceServerUrl() {

        return (
            voiceConfig.serverUrl ||
            window.KRYNET_VOICE_SERVER_URL ||
            ""
        ).replace(/\/+$/, "");
    }


    function getVoiceServerPublicKey() {

        return (
            voiceConfig.serverPublicKey ||
            window.KRYNET_VOICE_SERVER_PUBLIC_KEY ||
            ""
        );
    }


    function ensureVoiceConfiguration() {

        const serverUrl =
            getVoiceServerUrl();

        const serverPublicKey =
            getVoiceServerPublicKey();


        if (!serverUrl) {

            throw new Error(
                "Voice server URL is not configured"
            );
        }


        if (!serverPublicKey) {

            throw new Error(
                "Voice server public key is not configured"
            );
        }


        return {
            serverUrl,
            serverPublicKey
        };
    }


    async function connectVoice(channel) {

        if (
            activeVoiceChannel === channel &&
            voiceClient
        ) {
            return;
        }


        if (voiceClient) {
            await disconnectVoice();
        }


        const config =
            ensureVoiceConfiguration();


        activeVoiceChannel =
            channel;

        voiceConnectionId =
            crypto.randomUUID();


        setVoiceChannelState(
            channel,
            "connecting"
        );

        setVoiceStatus(
            `Connecting to ${channel}...`,
            "connecting"
        );

        setVoiceHeader(
            true,
            `Connecting • ${channel}`
        );


        try {

            voiceClient =
                new VoiceChatApex(
                    config.serverUrl,
                    sessionId,
                    userId,
                    {
                        serverPublicKey:
                            config.serverPublicKey,

                        frameSize:
                            960,

                        bitrate:
                            128000,

                        sampleRate:
                            48000
                    }
                );


            await voiceClient.init();


            /*
             * init() starts:
             *
             * - microphone capture
             * - Opus encoder
             * - Opus decoder
             * - RNNoise
             * - ECDH/AES-GCM session key
             * - encrypted upload
             * - encrypted receive stream
             * - heartbeat
             *
             * The VoiceChatApex instance owns the complete
             * voice lifecycle from this point onward.
             */


            if (
                activeVoiceChannel !== channel ||
                voiceConnectionId === null
            ) {
                await voiceClient.stop();
                return;
            }


            setVoiceChannelState(
                channel,
                "connected"
            );

            setVoiceStatus(
                `Connected to ${channel}`,
                ""
            );

            setVoiceHeader(
                true,
                `Voice connected • ${channel}`
            );

            leaveVoiceButton.style.display =
                "block";


            userStatus.textContent =
                "In voice";


        } catch (error) {

            console.error(
                "[Krynet] Voice connection failed:",
                error
            );


            try {
                await voiceClient?.stop();
            } catch {
                // Already failed.
            }


            voiceClient =
                null;

            activeVoiceChannel =
                null;

            voiceConnectionId =
                null;


            setVoiceChannelState(
                channel,
                ""
            );

            setVoiceStatus(
                error?.message ||
                "Voice connection failed",
                "error"
            );

            setVoiceHeader(
                false
            );

            leaveVoiceButton.style.display =
                "none";

            userStatus.textContent =
                "Online";
        }
    }


    async function disconnectVoice() {

        const oldChannel =
            activeVoiceChannel;


        const oldClient =
            voiceClient;


        activeVoiceChannel =
            null;

        voiceClient =
            null;

        voiceConnectionId =
            null;


        if (oldClient) {

            try {
                await oldClient.stop();
            } catch (error) {

                console.warn(
                    "[Krynet] Voice shutdown:",
                    error
                );
            }
        }


        setVoiceChannelState(
            oldChannel,
            ""
        );

        setVoiceStatus(
            ""
        );

        setVoiceHeader(
            false
        );

        leaveVoiceButton.style.display =
            "none";

        userStatus.textContent =
            "Online";
    }


    /* ========================================================
       ELEMENT HELPERS
    ======================================================== */

    function getTime() {

        return new Date().toLocaleTimeString(
            [],
            {
                hour: "numeric",
                minute: "2-digit"
            }
        );
    }


    function getInitial(name) {

        return (
            name.trim().charAt(0).toUpperCase() ||
            "?"
        );
    }


    function isURLOnly(text) {

        const value =
            text.trim();

        if (!value) {
            return false;
        }

        try {

            const url =
                new URL(value);

            return (
                url.protocol === "http:" ||
                url.protocol === "https:"
            );

        } catch {

            return false;
        }
    }


    function isYouTubeURL(value) {

        try {

            const url =
                new URL(value);

            const host =
                url.hostname
                    .toLowerCase()
                    .replace(/^www\./, "");

            return (
                host === "youtube.com" ||
                host === "youtu.be" ||
                host === "youtube-nocookie.com"
            );

        } catch {

            return false;
        }
    }


    function getYouTubeVideoId(value) {

        try {

            const url =
                new URL(value);

            const host =
                url.hostname
                    .toLowerCase()
                    .replace(/^www\./, "");


            if (host === "youtu.be") {

                return (
                    url.pathname
                        .split("/")
                        .filter(Boolean)[0] ||
                    null
                );
            }


            if (
                host === "youtube.com" ||
                host === "youtube-nocookie.com"
            ) {

                if (
                    url.pathname === "/watch"
                ) {

                    return url.searchParams.get("v");
                }


                if (
                    url.pathname.startsWith("/shorts/")
                ) {

                    return (
                        url.pathname
                            .split("/")
                            .filter(Boolean)[1] ||
                        null
                    );
                }


                if (
                    url.pathname.startsWith("/embed/")
                ) {

                    return (
                        url.pathname
                            .split("/")
                            .filter(Boolean)[1] ||
                        null
                    );
                }
            }


            return null;

        } catch {

            return null;
        }
    }


    function removeWelcome() {

        messages
            .querySelector(".welcome")
            ?.remove();
    }


    /* ========================================================
       YOUTUBE
    ======================================================== */

    function createYouTubeEmbed(url) {

        const videoId =
            getYouTubeVideoId(url);

        if (!videoId) {
            return null;
        }


        const wrapper =
            document.createElement("div");

        wrapper.className =
            "kr-embed youtube-embed";


        const bar =
            document.createElement("div");

        bar.className =
            "youtube-embed-bar";


        const body =
            document.createElement("div");

        body.className =
            "youtube-embed-body";


        const iframe =
            document.createElement("iframe");

        iframe.src =
            "https://www.youtube-nocookie.com/embed/" +
            encodeURIComponent(videoId) +
            "?rel=0&modestbranding=1";

        iframe.title =
            "YouTube video";

        iframe.loading =
            "lazy";

        iframe.allow =
            "accelerometer; autoplay; clipboard-write; " +
            "encrypted-media; gyroscope; picture-in-picture; web-share";

        iframe.allowFullscreen =
            true;


        body.appendChild(
            iframe
        );

        wrapper.append(
            bar,
            body
        );

        return wrapper;
    }


    /* ========================================================
       LOCAL FILE EMBED
    ======================================================== */

    function createLocalFileEmbed(file) {

        const url =
            URL.createObjectURL(file);

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "kr-embed";


        if (
            file.type.startsWith("image/")
        ) {

            const image =
                document.createElement("img");

            image.src =
                url;

            image.alt =
                file.name;

            image.loading =
                "lazy";

            wrapper.appendChild(
                image
            );

            return wrapper;
        }


        if (
            file.type.startsWith("video/")
        ) {

            const video =
                document.createElement("video");

            video.src =
                url;

            video.controls =
                true;

            video.preload =
                "metadata";

            wrapper.appendChild(
                video
            );

            return wrapper;
        }


        if (
            file.type.startsWith("audio/")
        ) {

            const audio =
                document.createElement("audio");

            audio.src =
                url;

            audio.controls =
                true;

            audio.style.width =
                "100%";

            wrapper.appendChild(
                audio
            );

            return wrapper;
        }


        const card =
            document.createElement("div");

        card.textContent =
            "📎 " + file.name;


        Object.assign(
            card.style,
            {
                padding: "10px",
                borderRadius: "7px",
                background: "#3a3c43",
                color: "#dbdee1",
                fontSize: "13px"
            }
        );


        wrapper.appendChild(
            card
        );

        return wrapper;
    }


    /* ========================================================
       ADD MESSAGE
    ======================================================== */

    function addMessage({
        author = "Barney",
        text = "",
        file = null
    }) {

        removeWelcome();


        const article =
            document.createElement("article");

        article.className =
            "message";

        article.dataset.messageId =
            crypto.randomUUID();


        const linkOnly =
            isURLOnly(text);

        if (linkOnly) {
            article.classList.add("link-only");
        }


        const avatar =
            document.createElement("div");

        avatar.className =
            "message-avatar";

        avatar.textContent =
            getInitial(author);


        const content =
            document.createElement("div");

        content.className =
            "message-content";


        const authorRow =
            document.createElement("div");

        authorRow.className =
            "message-author-row";


        const authorElement =
            document.createElement("span");

        authorElement.className =
            "message-author";

        authorElement.textContent =
            author;


        const time =
            document.createElement("span");

        time.className =
            "message-time";

        time.textContent =
            `Today at ${getTime()}`;


        authorRow.append(
            authorElement,
            time
        );


        const textElement =
            document.createElement("div");

        textElement.className =
            "message-text";

        textElement.textContent =
            text;


        content.append(
            authorRow,
            textElement
        );


        if (file) {

            content.appendChild(
                createLocalFileEmbed(file)
            );
        }


        if (linkOnly) {

            if (
                isYouTubeURL(text)
            ) {

                const youtube =
                    createYouTubeEmbed(
                        text.trim()
                    );

                if (youtube) {
                    content.appendChild(
                        youtube
                    );
                }

            } else {

                requestAnimationFrame(() => {

                    Embed.scanMessages(
                        `.message[data-message-id="${CSS.escape(article.dataset.messageId)}"]`
                    );

                });
            }
        }


        const reactions =
            document.createElement("div");

        reactions.className =
            "kr-message-reactions";


        try {

            new Reactions(
                reactions
            );

        } catch (error) {

            console.warn(
                "[Krynet] Reactions failed:",
                error
            );
        }


        content.appendChild(
            reactions
        );


        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";


        const reactButton =
            document.createElement("button");

        reactButton.className =
            "message-action";

        reactButton.type =
            "button";

        reactButton.dataset.action =
            "react";

        reactButton.title =
            "Add Reaction";

        reactButton.textContent =
            "😊";


        const replyButton =
            document.createElement("button");

        replyButton.className =
            "message-action";

        replyButton.type =
            "button";

        replyButton.dataset.action =
            "reply";

        replyButton.title =
            "Reply";

        replyButton.textContent =
            "↩";


        actions.append(
            reactButton,
            replyButton
        );


        article.append(
            avatar,
            content,
            actions
        );


        messages.appendChild(
            article
        );


        try {

            if (
                typeof Reactions.attach ===
                "function"
            ) {

                Reactions.attach(
                    reactions
                );
            }

        } catch {
            // Constructor implementations
            // initialize themselves.
        }


        reactButton.addEventListener(
            "click",
            () => {

                reactions.dispatchEvent(
                    new CustomEvent(
                        "krynet:add-reaction",
                        {
                            bubbles: true
                        }
                    )
                );
            }
        );


        messages.scrollTop =
            messages.scrollHeight;


        return article;
    }


    /* ========================================================
       SEND
    ======================================================== */

    function sendMessage() {

        const text =
            messageInput.value.trim();


        if (
            !text &&
            !selectedFile
        ) {
            return;
        }


        addMessage({
            author: "Barney",
            text,
            file: selectedFile
        });


        messageInput.value =
            "";

        messageInput.style.height =
            "auto";

        clearAttachment();
    }


    /* ========================================================
       ATTACHMENTS
    ======================================================== */

    function showAttachment(file) {

        selectedFile =
            file;


        attachmentPreview.classList.add(
            "visible"
        );


        attachmentName.textContent =
            file.name;


        attachmentContent.replaceChildren();


        if (
            file.type.startsWith("image/")
        ) {

            const image =
                document.createElement("img");

            image.src =
                URL.createObjectURL(file);

            image.alt =
                file.name;

            attachmentContent.appendChild(
                image
            );

            return;
        }


        if (
            file.type.startsWith("video/")
        ) {

            const video =
                document.createElement("video");

            video.src =
                URL.createObjectURL(file);

            video.muted =
                true;

            attachmentContent.appendChild(
                video
            );
        }
    }


    function clearAttachment() {

        selectedFile =
            null;

        fileInput.value =
            "";

        attachmentContent.replaceChildren();

        attachmentName.textContent =
            "";

        attachmentPreview.classList.remove(
            "visible"
        );
    }


    /* ========================================================
       CALL PANEL
    ======================================================== */

    function showCallPanel(
        title,
        status
    ) {

        callTitle.textContent =
            title;

        callStatus.textContent =
            status;

        callPanel.classList.add(
            "visible"
        );
    }


    function hideCallPanel() {

        callPanel.classList.remove(
            "visible"
        );

        callVideo.pause();

        callVideo.srcObject =
            null;
    }


    /* ========================================================
       WEBCAM
    ======================================================== */

    async function stopWebcam() {

        if (!webcamSession) {
            return;
        }


        try {
            webcamSession.stop();
        } catch {
            // Ignore shutdown errors.
        }


        webcamSession =
            null;


        cameraButton.classList.remove(
            "active"
        );


        hideCallPanel();
    }


    cameraButton.addEventListener(
        "click",
        async () => {

            if (webcamSession) {

                await stopWebcam();

                return;
            }


            if (
                typeof window.startWebcamStream !==
                "function"
            ) {

                showCallPanel(
                    "Camera",
                    "webcam.js is not loaded"
                );

                return;
            }


            try {

                showCallPanel(
                    "Camera",
                    "Starting camera..."
                );


                webcamSession =
                    await window.startWebcamStream();


                if (
                    webcamSession?.stream
                ) {

                    callVideo.srcObject =
                        webcamSession.stream;

                    await callVideo
                        .play()
                        .catch(() => {});
                }


                cameraButton.classList.add(
                    "active"
                );


                callStatus.textContent =
                    "Camera active";


            } catch (error) {

                webcamSession =
                    null;


                callStatus.textContent =
                    error?.message ||
                    "Could not start camera";


                console.error(
                    "[Krynet] Camera failed:",
                    error
                );
            }
        }
    );


    /* ========================================================
       SCREEN SHARE
    ======================================================== */

    async function stopScreenshare() {

        if (!screenSession) {
            return;
        }


        try {
            screenSession.stop();
        } catch {
            // Ignore shutdown errors.
        }


        screenSession =
            null;


        screenButton.classList.remove(
            "active"
        );


        hideCallPanel();
    }


    screenButton.addEventListener(
        "click",
        async () => {

            if (screenSession) {

                await stopScreenshare();

                return;
            }


            if (
                typeof window.startMonitorAdaptiveScreenshare !==
                "function"
            ) {

                showCallPanel(
                    "Screen Share",
                    "screenshare.js is not loaded"
                );

                return;
            }


            const wsUrl =
                window.KRYNET_SCREEN_WS_URL ||
                "wss://localhost:8443/screenshare";


            const wtUrl =
                window.KRYNET_SCREEN_WT_URL ||
                "https://localhost:8443/screenshare";


            try {

                showCallPanel(
                    "Screen Share",
                    "Starting screen capture..."
                );


                screenSession =
                    await window.startMonitorAdaptiveScreenshare(
                        wsUrl,
                        wtUrl,
                        {
                            captureAudio: true,
                            videoQuality: .82,
                            maxFPS: 60,
                            useSpatialAudio: false
                        }
                    );


                if (
                    screenSession?.stream
                ) {

                    callVideo.srcObject =
                        screenSession.stream;

                    await callVideo
                        .play()
                        .catch(() => {});
                }


                screenButton.classList.add(
                    "active"
                );


                callStatus.textContent =
                    "Screen sharing active";


            } catch (error) {

                screenSession =
                    null;


                callStatus.textContent =
                    error?.message ||
                    "Could not start screen share";


                console.error(
                    "[Krynet] Screen share failed:",
                    error
                );
            }
        }
    );


    /* ========================================================
       LEAVE VOICE
    ======================================================== */

    leaveVoiceButton.addEventListener(
        "click",
        async () => {

            await disconnectVoice();
        }
    );


    /* ========================================================
       CALL CLOSE
    ======================================================== */

    callClose.addEventListener(
        "click",
        async () => {

            await stopWebcam();

            await stopScreenshare();
        }
    );


    /* ========================================================
       COMPOSER
    ======================================================== */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    uploadButton.addEventListener(
        "click",
        () => fileInput.click()
    );


    fileInput.addEventListener(
        "change",
        () => {

            const file =
                fileInput.files?.[0];

            if (!file) {
                return;
            }

            showAttachment(file);
        }
    );


    removeAttachment.addEventListener(
        "click",
        clearAttachment
    );


    messageInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );


    messageInput.addEventListener(
        "input",
        () => {

            messageInput.style.height =
                "auto";

            messageInput.style.height =
                Math.min(
                    messageInput.scrollHeight,
                    160
                ) + "px";
        }
    );


    /* ========================================================
       CHANNEL SWITCHING
    ======================================================== */

    document
        .querySelectorAll(".channel")
        .forEach(channel => {

            channel.addEventListener(
                "click",
                async () => {

                    const name =
                        channel.dataset.channel ||
                        "general";

                    const type =
                        channel.dataset.type ||
                        "text";


                    /*
                     * Voice channels are real voice actions.
                     * Clicking the currently connected channel
                     * leaves it.
                     */

                    if (type === "voice") {

                        if (
                            activeVoiceChannel === name &&
                            voiceClient
                        ) {

                            await disconnectVoice();

                            return;
                        }


                        await connectVoice(name);

                        return;
                    }


                    /*
                     * Text channel selection.
                     */

                    if (voiceClient) {
                        /*
                         * Deliberately keep voice connected while
                         * moving through text channels.
                         */
                    }


                    document
                        .querySelectorAll(
                            ".channel"
                        )
                        .forEach(item => {

                            item.classList.remove(
                                "active"
                            );
                        });


                    channel.classList.add(
                        "active"
                    );


                    channelName.textContent =
                        name;

                    headerChannelIcon.textContent =
                        "#";


                    messageInput.placeholder =
                        `Message #${name}`;
                }
            );

        });


    /* ========================================================
       VOICE CLEANUP
    ======================================================== */

    window.addEventListener(
        "beforeunload",
        () => {

            /*
             * stop() is intentionally fired without awaiting.
             * The VoiceChatApex implementation handles its own
             * stream shutdown.
             */

            try {
                voiceClient?.stop();
            } catch {
                // Ignore page shutdown errors.
            }
        }
    );


    /* ========================================================
       INITIAL EMBEDS
    ======================================================== */

    requestAnimationFrame(() => {

        Embed.scanMessages(
            ".message"
        );
    });


    /* ========================================================
       MESSAGE OBSERVER
    ======================================================== */

    const messageObserver =
        new MutationObserver(
            mutations => {

                let shouldScan =
                    false;


                for (
                    const mutation of mutations
                ) {

                    for (
                        const node of mutation.addedNodes
                    ) {

                        if (
                            node instanceof Element &&
                            (
                                node.matches(
                                    ".message"
                                ) ||
                                node.querySelector?.(
                                    ".message"
                                )
                            )
                        ) {

                            shouldScan =
                                true;
                        }
                    }
                }


                if (shouldScan) {

                    Embed.scanMessages(
                        ".message"
                    );
                }
            }
        );


    messageObserver.observe(
        messages,
        {
            childList: true,
            subtree: true
        }
    );


    /* ========================================================
       STARTUP
    ======================================================== */

    setVoiceStatus("");

    setVoiceHeader(false);

</script>

</body>
</html>
