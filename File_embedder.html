<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">

  <title>Krynet File Embedder</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0e0e0e;
      color: white;
    }

    .container {
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }

    input {
      margin: 15px 0;
    }

    button {
      padding: 9px 16px;
      cursor: pointer;
    }

    .status {
      margin-top: 15px;
      min-height: 1.5em;
    }

    .error {
      color: #ff6b6b;
    }

    .preview {
      margin-top: 25px;
    }

    .preview img,
    .preview audio,
    .preview video {
      display: block;
      max-width: 100%;
      margin: 15px auto;
      border-radius: 10px;
    }

    .filename {
      opacity: 0.7;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <main class="container">

    <h2>Krynet File Embed</h2>

    <input
      id="fileInput"
      type="file"
      accept=".avif,.heif,.heic,.aac,.m4a,.mp4"
    >

    <br>

    <button id="embedButton">
      Embed File
    </button>

    <div
      id="status"
      class="status"
      role="status"
      aria-live="polite"
    ></div>

    <div
      id="preview"
      class="preview"
    ></div>

  </main>

  <script>
    'use strict';

    const fileInput =
      document.getElementById('fileInput');

    const embedButton =
      document.getElementById('embedButton');

    const preview =
      document.getElementById('preview');

    const status =
      document.getElementById('status');

    let objectURL = null;


    function setStatus(text, error = false) {
      status.textContent = text;
      status.classList.toggle('error', error);
    }


    function cleanup() {
      preview.replaceChildren();

      if (objectURL) {
        URL.revokeObjectURL(objectURL);
        objectURL = null;
      }
    }


    function getExtension(filename) {
      const parts = filename.toLowerCase().split('.');

      return parts.length > 1
        ? parts.pop()
        : '';
    }


    function createMediaElement(file) {

      const extension =
        getExtension(file.name);

      objectURL =
        URL.createObjectURL(file);


      /*
       * AVIF
       */

      if (extension === 'avif') {

        const img =
          document.createElement('img');

        img.alt = file.name;
        img.src = objectURL;

        img.onload = () => {
          setStatus('AVIF loaded successfully.');
        };

        img.onerror = () => {
          setStatus(
            'This browser cannot decode this AVIF file.',
            true
          );
        };

        preview.appendChild(img);

        return;
      }


      /*
       * HEIF / HEIC
       */

      if (
        extension === 'heif' ||
        extension === 'heic'
      ) {

        const img =
          document.createElement('img');

        img.alt = file.name;
        img.src = objectURL;

        img.onload = () => {
          setStatus(
            'HEIF/HEIC loaded successfully.'
          );
        };

        img.onerror = () => {
          setStatus(
            'This browser does not support HEIF/HEIC decoding.',
            true
          );
        };

        preview.appendChild(img);

        return;
      }


      /*
       * AAC
       */

      if (extension === 'aac') {

        const audio =
          document.createElement('audio');

        audio.controls = true;
        audio.preload = 'metadata';
        audio.src = objectURL;

        audio.onloadedmetadata = () => {
          setStatus(
            'AAC loaded successfully.'
          );
        };

        audio.onerror = () => {
          setStatus(
            'This browser cannot decode this AAC file.',
            true
          );
        };

        preview.appendChild(audio);

        return;
      }


      /*
       * M4A
       */

      if (extension === 'm4a') {

        const audio =
          document.createElement('audio');

        audio.controls = true;
        audio.preload = 'metadata';
        audio.src = objectURL;

        audio.onloadedmetadata = () => {
          setStatus(
            'M4A loaded successfully.'
          );
        };

        audio.onerror = () => {
          setStatus(
            'This browser cannot decode this audio file.',
            true
          );
        };

        preview.appendChild(audio);

        return;
      }


      /*
       * MP4
       */

      if (extension === 'mp4') {

        const video =
          document.createElement('video');

        video.controls = true;
        video.preload = 'metadata';
        video.src = objectURL;

        video.onloadedmetadata = () => {
          setStatus(
            'Video loaded successfully.'
          );
        };

        video.onerror = () => {
          setStatus(
            'This browser cannot decode this video.',
            true
          );
        };

        preview.appendChild(video);

        return;
      }


      setStatus(
        'Unsupported file format.',
        true
      );
    }


    function embedFile() {

      cleanup();

      const file =
        fileInput.files?.[0];

      if (!file) {
        setStatus(
          'Select a file first.',
          true
        );
        return;
      }

      const filename =
        document.createElement('div');

      filename.className =
        'filename';

      filename.textContent =
        file.name;

      preview.appendChild(filename);

      setStatus('Loading...');

      createMediaElement(file);
    }


    embedButton.addEventListener(
      'click',
      embedFile
    );


    fileInput.addEventListener(
      'change',
      cleanup
    );

  </script>

</body>
</html>
