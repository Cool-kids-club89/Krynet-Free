<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Krynet File Embedder</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0e0e0e;
      color: #fff;
    }

    .container {
      max-width: 650px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }

    input[type="file"] {
      margin: 15px 0;
    }

    button {
      padding: 9px 16px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      min-height: 1.5em;
    }

    .error {
      color: #ff6b6b;
    }

    .preview {
      margin-top: 25px;
    }

    .preview img,
    .preview video,
    .preview audio {
      display: block;
      max-width: 100%;
      margin: 15px auto 0;
      border-radius: 10px;
    }

    .filename {
      margin-top: 10px;
      opacity: 0.7;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <main class="container">
    <h2>Krynet File Embed</h2>

    <input
      type="file"
      id="fileInput"
      accept=".he-aac,.heif,.heic,.avif,audio/aac,image/avif,image/heif,image/heic"
    >

    <br>

    <button id="embedButton" type="button">
      Embed File
    </button>

    <div
      id="status"
      class="status"
      role="status"
      aria-live="polite"
    ></div>

    <div id="preview" class="preview"></div>
  </main>

  <script>
    'use strict';

    const fileInput = document.getElementById('fileInput');
    const embedButton = document.getElementById('embedButton');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');

    let currentObjectURL = null;

    const MAX_FILE_SIZE = 25 * 1024 * 1024;

    const ALLOWED_TYPES = new Set([
      'audio/aac',
      'audio/aacp',
      'image/avif',
      'image/heif',
      'image/heic'
    ]);

    function setStatus(message, error = false) {
      status.textContent = message;
      status.classList.toggle('error', error);
    }

    function clearPreview() {
      preview.replaceChildren();

      if (currentObjectURL) {
        URL.revokeObjectURL(currentObjectURL);
        currentObjectURL = null;
      }
    }

    function createPreview(file) {
      clearPreview();

      const mime = file.type;

      if (!ALLOWED_TYPES.has(mime)) {
        setStatus(
          `Unsupported file type: ${mime || 'unknown'}`,
          true
        );
        return;
      }

      currentObjectURL = URL.createObjectURL(file);

      let element;

      if (mime.startsWith('audio/')) {
        element = document.createElement('audio');
        element.controls = true;
        element.preload = 'metadata';

      } else if (mime.startsWith('image/')) {
        element = document.createElement('img');
        element.alt = file.name;
        element.loading = 'lazy';

      } else {
        setStatus('Unsupported media type.', true);
        return;
      }

      element.src = currentObjectURL;

      element.addEventListener(
        'error',
        () => {
          setStatus(
            'Your browser cannot decode this file.',
            true
          );
        },
        { once: true }
      );

      const filename = document.createElement('div');
      filename.className = 'filename';
      filename.textContent = file.name;

      preview.appendChild(element);
      preview.appendChild(filename);
    }

    function embedFile() {
      const file = fileInput.files?.[0];

      if (!file) {
        setStatus('Select a file first.', true);
        return;
      }

      if (file.size > MAX_FILE_SIZE) {
        setStatus(
          'File is too large. Maximum size is 25 MB.',
          true
        );
        return;
      }

      setStatus('Loading...');
      createPreview(file);

      if (currentObjectURL) {
        setStatus('File embedded locally.');
      }
    }

    embedButton.addEventListener(
      'click',
      embedFile
    );

    fileInput.addEventListener(
      'change',
      () => {
        clearPreview();
        setStatus('');
      }
    );
  </script>
</body>
</html>
